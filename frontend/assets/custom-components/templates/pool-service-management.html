<script>
(() => {
  const D = JSON.parse(document.getElementById('mimic-data').textContent);
  const W = 1440, frame = document.getElementById('app-frame');
  const fit = () => { const s = window.innerWidth / W; frame.style.transform = 'scale(' + s + ')'; frame.style.height = (window.innerHeight / s) + 'px'; };
  window.addEventListener('resize', fit); fit();
  const setAttrs = (el, attrs) => { [...el.attributes].forEach(a => el.removeAttribute(a.name)); attrs.forEach(([k, v]) => el.setAttribute(k, v)); };
  const T = D.themes;
  let theme = new URLSearchParams(location.search).get('theme') === 'dark' && T.dark ? 'dark' : 'light', cur = 0;
  const show = (i, push) => {
    cur = i;
    const p = T[theme][i], doc = frame.contentDocument;
    setAttrs(doc.documentElement, p.htmlAttrs); setAttrs(doc.body, p.bodyAttrs);
    const mk = n => { if (typeof n === 'string') return doc.createTextNode(n);
      const svg = n[0].startsWith('s:'), el = svg ? doc.createElementNS('http://www.w3.org/2000/svg', n[0].slice(2)) : doc.createElement(n[0]);
      for (const [k, v] of n[1]) { try { k === 'xlink:href' ? el.setAttributeNS('http://www.w3.org/1999/xlink', k, v) : el.setAttribute(k, v); } catch (e) {} }
      if (n[0] === 'textarea') el.value = el.textContent;
      for (const c of n[2]) el.appendChild(mk(c));
      return el; };
    const frag = doc.createDocumentFragment(); p.tree.forEach(n => frag.appendChild(mk(n)));
    doc.body.replaceChildren(frag);
    doc.querySelectorAll('input, textarea, select, button').forEach(e => e.setAttribute('tabindex', '-1'));
    doc.querySelectorAll('[data-snap-scroll]').forEach(e => { const [t, l] = e.getAttribute('data-snap-scroll').split(','); e.scrollTop = +t; e.scrollLeft = +l; });
    if (push) history.replaceState(null, '', '#' + p.handle);
  };
  frame.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><style>' + D.css.replace(/<\/style/gi, '<\\/style') + '</style></head><body></body></html>';
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    doc.addEventListener('click', e => {
      const nav = e.target.closest('button[data-id]');
      const i = nav ? T.light.findIndex(p => p.id === nav.getAttribute('data-id')) : -1;
      if (i >= 0) { e.preventDefault(); show(i, true); return; }
      // the app's own buttons: page switches and light/dark
      const comp = name => e.target.closest('._tooljet-' + CSS.escape(name));
      for (const [n, handle] of Object.entries(D.navButtons || {})) if (comp(n)) {
        const k = T.light.findIndex(p => p.handle === handle); if (k >= 0) { e.preventDefault(); show(k, true); return; } }
      let want = null;
      for (const [n, m] of Object.entries(D.themeButtons || {})) if (comp(n)) want = m === 'toggle' ? (theme === 'dark' ? 'light' : 'dark') : m;
      const themeBtn = e.target.closest('.page-dark-mode-btn-wrapper button');   // ToolJet's own theme button, not the collapse button beside it
      if (T.dark && themeBtn && themeBtn.querySelector('.lucide-moon, .lucide-sun')) want = theme === 'dark' ? 'light' : 'dark';
      if (want && T.dark) {
        e.preventDefault(); theme = want;
        const u = new URL(location.href); theme === 'dark' ? u.searchParams.set('theme', 'dark') : u.searchParams.delete('theme');
        history.replaceState(null, '', u); show(cur, false); return;
      }
      if (e.target.closest('a, button, form')) e.preventDefault();   // UI only: nothing else acts
    }, true);
    doc.addEventListener('submit', e => e.preventDefault(), true);
    const start = Math.max(0, T.light.findIndex(p => '#' + p.handle === location.hash));
    show(start, false);
  }, { once: true });
})();
</script>
