<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      Custom component shell (F2). Static — same file for every component
      instance, heavily cacheable. Loaded as the iframe src by
      LibraryComponentRunner (F3), same-origin with the ToolJet app.

      Protocol (parent <-> shell), per LLD §5.2:
        shell  -> parent : { type: 'ready' }
        parent -> shell  : { type: 'load', bundleUrl, componentName, cssUrl? }
        parent -> shell  : { type: 'props', data }
        shell  -> parent : { type: 'stateChange', key, value }   (via SDK, F3)
        shell  -> parent : { type: 'event', name }               (via SDK, F3)
        shell  -> parent : { type: 'error', message }
    -->
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; }
    </style>
    <!--
      Import map: component bundles are built by the ToolJet CLI with
      external react/react-dom/react/jsx-runtime — their literal
      `import ... from 'react'` statements resolve here, to the vendor
      builds generated by scripts/build-vendor-bundle.js.
      Relative URLs (resolved against this file) keep sub-path deploys working.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "./vendor/react.js",
          "react/jsx-runtime": "./vendor/jsx-runtime.js",
          "react-dom": "./vendor/react-dom.js",
          "react-dom/client": "./vendor/react-dom-client.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import * as React from 'react';
      import * as ReactDOMClient from 'react-dom/client';
      import * as ReactJSXRuntime from 'react/jsx-runtime';

      // LLD §6 documented globals.
      window.__tj_React = React;
      window.__tj_ReactDOM = ReactDOMClient;
      window.__tj_ReactJSXRuntime = ReactJSXRuntime;

      let root = null;
      let Component = null;
      let currentProps = {};

      const post = (msg) => window.parent.postMessage(msg, '*');

      // ── SDK bridge (F3) ─────────────────────────────────────────────────
      // The CLI rewrites `import { ToolJet } from '@tooljet/custom-component-sdk'`
      // to `window.__tj_ToolJet` (builder.ts tooljetSdkPlugin), so this object IS
      // the SDK at runtime. Hooks run inside the component's render using the
      // same vendor React instance — that's why this lives here, after imports.
      //
      // useStateX({ name, initialValue }): two-way bound state.
      //   in : parent-sent props win — when currentProps[name] changes, adopt it
      //        (setState-during-render, React's documented derived-state pattern).
      //   out: every value change posts stateChange → parent setExposedVariable.
      const makeStateHook = () =>
        function useTjState({ name, initialValue } = {}) {
          const external = currentProps[name];
          const [value, setValue] = React.useState(external !== undefined ? external : initialValue);
          const lastExternal = React.useRef(external);
          if (lastExternal.current !== external) {
            lastExternal.current = external;
            if (external !== undefined && external !== value) setValue(external);
          }
          React.useEffect(() => {
            post({ type: 'stateChange', key: name, value });
          }, [name, value]);
          return [value, setValue];
        };

      window.__tj_ToolJet = {
        useStateString: makeStateHook(),
        useStateNumber: makeStateHook(),
        useStateBoolean: makeStateHook(),
        useStateObject: makeStateHook(),
        useStateArray: makeStateHook(),
        useStateEnumeration: makeStateHook(),
        // useEventCallback({ name: 'onSave' }) → stable fn that fires the ToolJet event
        useEventCallback: function useTjEvent({ name } = {}) {
          return React.useCallback(() => post({ type: 'event', name }), [name]);
        },
        // Build-time only (manifest-generator reads defaultWidth/Height); no runtime effect.
        useComponentSettings: () => {},
      };

      const render = () => {
        if (!Component) return;
        root = root ?? ReactDOMClient.createRoot(document.getElementById('root'));
        root.render(React.createElement(Component, currentProps));
      };

      window.addEventListener('message', async (e) => {
        const { type, bundleUrl, componentName, cssUrl, data } = e.data ?? {};

        if (type === 'load') {
          try {
            if (cssUrl) {
              const link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = cssUrl;
              document.head.appendChild(link);
            }
            const mod = await import(bundleUrl);
            Component = mod[componentName];
            if (!Component) throw new Error(`export "${componentName}" not found in bundle`);
            render();
          } catch (err) {
            post({ type: 'error', message: String(err?.message ?? err) });
          }
        }

        if (type === 'props') {
          currentProps = data ?? {};
          render();
        }
      });

      post({ type: 'ready' });
    </script>
  </body>
</html>
