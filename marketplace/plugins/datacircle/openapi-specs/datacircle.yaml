        slug:
          type: string
          description: The API's slug, the words of its sheet's address on datacircle.dev, /<slug>-api-pricing.
        plans:
          type: integer
          description: How many plans the API has on the sheet.
        providers:
          type: integer
          description: How many providers sell it.
        sheetPage:
          type: string
          format: uri
          description: The API's sheet on datacircle.dev, its plans and their prices.
          nullable: true
        bestPage:
          type: string
          format: uri
          description: The API's best page on datacircle.dev, which ranks its providers on our benchmark. Null where it has
            none.
          nullable: true
        best:
          type: object
          description: The plan the sheet ranks first, null where we score none of the API's plans.
          properties:
            provider:
              description: Who sells the endpoint, in Latin letters where its pages also write its name in another alphabet
                (互亿无线 Ihuyi is Ihuyi). On the sheet, the provider's name starts each row's API plan.
            plan:
              description: The plan's name on the provider's pricing page, in English where that page writes it in another
                alphabet (XMLStock's "Максимум" is "Maximum"). Its plan page gives its own name too.
            score:
              description: 'We score each plan out of 100 on five parts: price, accuracy, cost to get started, bundled calls
                and performance. We score accuracy and performance from our benchmark of the provider''s call. Until we benchmark
                the call, the plan''s accuracy, performance and Overall scores are N/A. The accuracy, performance and Overall
                scores are also N/A on a plan that lacks a check or feature the benchmarked plan has. The accuracy, performance
                and Overall scores are also N/A when we can''t tell which benchmark score fits the plan. A plan whose accuracy
                score is 0 has an Overall score of 0, whatever the plan''s other scores. Each API''s sheet shows what we measured
                on each benchmarked plan, in the columns after the price. We rank a plan''s price per 1,000 against the other
                scored plans of the same API. We score cost to get started and bundled calls on the plan alone. We give N/A
                to yearly plans, contact us plans and plans over $500 to start. We also give N/A to plans bought on a marketplace
                and plans that need your own LinkedIn, X or WhatsApp account. We score a free plan only when the provider
                has no paid plan for that call. The free plan must never end. Any limit on the plan''s calls must reset each
                day or sooner. Other free plans get N/A. A plan we don''t score gets no score for any of the five parts, even
                when we benchmarked the call. Click Score in the sheet''s bar to set the five weights. The JSON, datacircle.json
                and datacircle.csv give each plan''s score at the default weights. A plan with N/A has an empty score in the
                JSON, datacircle.json and datacircle.csv. The sheet''s CSV has no scores.'
            perThousand:
              description: The price of 1,000 items on this plan, in dollars. The price is 0 on a free plan. A lifetime plan
                is one you pay for once. Its units come back each day or month, with no end. On a lifetime plan, we spread
                the price over 24 months of units. On a plan that charges by the call, each call asks for one item. We add
                the Start fee to each item's price. When the call has a Minimum per call above that, each item costs the minimum.
                On a plan that charges by the page, we divide a page's price by the most results one page holds. Then we multiply
                by 1,000. We leave the price blank when the provider doesn't say how many results a page holds. On a search
                that charges by the page, we price the first page of each search, whatever the page holds. On a flat fee,
                we take the most items the plan allows in one month. We multiply those items by the months the fee covers.
                We divide the fee by that total. Then we multiply by 1,000. We leave the price blank when the provider doesn't
                say how many items the plan allows. A plan with no end date and only limits per second, minute, hour or day
                has no cap on items. A flat fee with no cap on items shows "no limit" on the sheet. We leave the price blank
                in the CSV and JSON. On a waterfall's paid plan, we show the average cost of a call. We take the price of
                each provider listed under Waterfall. We weight each price by how often a call reaches that provider. We leave
                the price blank when a provider a call can reach has no hit rate or page size. On a plan with a Monthly fee,
                we first subtract one month of the fee from the plan's units. Then we divide the plan's price by the number
                of items the remaining units buy. Then we multiply by 1,000. We leave the price blank when the Monthly fee
                uses up all the plan's units. Some plans limit calls per second, minute, hour, day or month. We divide the
                price by the items the limit allows, if that is fewer than the items you pay for. Then we multiply by 1,000.
                We leave the price blank on a top-up, because a top-up buys no fixed number of items. We also leave the price
                blank when the provider's website doesn't say what an item costs on this plan. We leave the price blank, too,
                when the website doesn't say how many items the price buys.
          nullable: true
