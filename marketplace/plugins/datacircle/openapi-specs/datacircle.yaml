openapi: 3.0.3
info:
  title: Datacircle API
  version: 1.0.0
  description: 'Find the best GTM APIs. We benchmark all the GTM APIs and we put the results on our website. This API lists
    every API on our sheet, who is best for each and every plan, free, with no key. Each plan comes with its score out of
    100, and the best come first, as on the sheet. No key, no account. At most 60 calls a minute from one address: every plan
    is one file at https://datacircle.dev/datacircle.json.'
  termsOfService: https://datacircle.dev/terms
  contact:
    name: Datacircle
    url: https://datacircle.dev/support
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
servers:
- url: https://api.datacircle.dev/v1
externalDocs:
  description: What each key means
  url: https://datacircle.dev/fields
security: []
paths:
  /apis:
    get:
      operationId: listApis
      summary: List the APIs
      description: Every API on the sheet, in its order, with its slug, how many plans and providers it has, its best plan
        and its pages.
      parameters: []
      responses:
        '200':
          description: List the APIs
          headers:
            Link:
              description: '<https://datacircle.dev/api>; rel="canonical": the answer''s page on datacircle.dev.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Api'
        '429':
          description: More than 60 calls in a minute from one address.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /apis/{slug}/best:
    get:
      operationId: getBestPlans
      summary: Who is best for an API
      description: The API's plans best first by score, as the sheet and its best page order them, each with its rank.
      parameters:
      - name: slug
        in: path
        required: true
        description: The API's slug, the words of its sheet's address on datacircle.dev, /<slug>-api-pricing.
        schema:
          type: string
      - name: limit
        in: query
        description: How many plans to give, 1 to 50. 10 when left out.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      responses:
        '200':
          description: Who is best for an API
          headers:
            Link:
              description: '<bestPage>; rel="canonical": the API''s best page on datacircle.dev, its sheet (sheetPage) where
                it has none.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: string
                    description: 'This column names each row''s API. Each API has a sheet in the GTM APIs list. Most sheets
                      share the API''s name. For the rest, we give the sheet''s name after the API. "Employee profile", on
                      the LinkedIn profiles sheet, returns a person''s LinkedIn profile. "Employee email", on the Find email
                      sheet, finds a person''s work email. "Email validation", on the Validate email sheet, checks whether
                      an email address takes mail. "Employee phone", on the Find phone sheet, finds a person''s phone number.
                      "Company profile", on the LinkedIn company profiles sheet, returns a company''s LinkedIn page. "Company
                      headcount" counts a company''s staff. "Phone validation", on the Validate phone sheet, checks whether
                      a phone number is valid. "Post comments", on the LinkedIn post comments sheet, returns the comments
                      on a LinkedIn post. "Post reactions", on the LinkedIn post reactions sheet, returns the reactions to
                      a LinkedIn post, each with the person who reacted. "Employee lookalikes", on the Similar people sheet,
                      returns people similar to the person you send. "Company lookalikes", on the Similar companies sheet,
                      returns companies similar to the company you send. "Company technologies" returns the tools a company
                      uses. "Company job count" counts the jobs a company has open on LinkedIn. "Employee posts", on the LinkedIn
                      person posts sheet, returns a person''s LinkedIn posts. "Company posts", on the LinkedIn company posts
                      sheet, returns a company''s LinkedIn posts. "Company funding" returns a company''s funding rounds. "Company
                      jobs", on the Company open jobs sheet, returns the jobs a company has open. "Employee search", on the
                      LinkedIn people search sheet, finds people by job title, company and place. "Company search", on the
                      LinkedIn company search sheet, finds companies by industry, size and place. "Job search", on the LinkedIn
                      job search sheet, finds jobs by title, company and place. "Reverse email lookup" finds the person behind
                      an email address. "Post search", on the LinkedIn post search sheet, finds posts by keyword. "Post details",
                      on the LinkedIn post details sheet, returns a post from the post''s URL or ID. "Job details", on the
                      LinkedIn job details sheet, returns a job from the job''s URL or ID. "Employee comments", on the LinkedIn
                      person comments sheet, returns the comments a person left on posts. "Employee reactions", on the LinkedIn
                      person reactions sheet, returns the posts a person reacted to. "Post reposts", on the LinkedIn post
                      reposts sheet, returns the people who reposted a LinkedIn post. "Employee recommendations", on the LinkedIn
                      person recommendations sheet, returns the recommendations on a person''s LinkedIn profile. "Job lookalikes",
                      on the Similar jobs sheet, returns jobs similar to the job you send. "Employee articles", on the LinkedIn
                      person articles sheet, returns a person''s LinkedIn articles. "Company enrichment" returns a company''s
                      profile from each seller''s own database. "People search" finds people in each seller''s own database.
                      "Company discovery" finds companies in each seller''s own database. "Job postings" finds job postings
                      in each seller''s own database. "Job posting details" returns a job posting from the posting''s ID.
                      "Person enrichment" returns a person''s profile. "Leadership changes" returns the new hires, promotions
                      and departures in a company''s senior roles. "Company hierarchy" returns a company''s parent companies
                      and subsidiaries. "Web search" returns the web pages that match a query. "SERP" returns a search engine''s
                      results page as data. "News search" returns the news articles that match a query. "Image search" returns
                      the images a search engine finds for a query, in the order the engine ranks them. "Video search" returns
                      the videos a search engine finds for a query, in the order the engine ranks them. "Search autocomplete"
                      returns the searches a search engine suggests as you type a query. "Web scraping" returns a page''s
                      content from the page''s URL. "Keyword research" returns a keyword''s search volume, cost per click
                      and competition. "Ranked keywords" returns the keywords a domain ranks for in Google, with the domain''s
                      position and traffic for each keyword. "Related keywords" returns keywords like the keyword you send,
                      with the search volume of each. "Backlinks" returns the links that point to a domain. "Domain authority"
                      returns a domain''s authority score and the number of links to the domain. "X profile" returns an X
                      (Twitter) account''s profile from the account''s handle. "X posts" returns an X account''s posts. "Instagram
                      profile" returns an Instagram account''s profile. "Instagram posts" returns an Instagram account''s
                      posts. "TikTok profile" returns a TikTok account''s profile. "TikTok videos" returns a TikTok account''s
                      videos. "YouTube channel" returns a YouTube channel''s name, subscribers and description. "YouTube channel
                      videos" returns a YouTube channel''s videos. "Reddit profile" returns a Reddit account''s profile. "Reddit
                      posts" returns a Reddit account''s posts. "Facebook page" returns a Facebook page''s details from the
                      page''s URL. "Facebook posts" returns a Facebook page''s posts. "Threads profile" returns a Threads
                      account''s profile. "Threads posts" returns a Threads account''s posts. "Bluesky profile" returns a
                      Bluesky account''s profile. "Bluesky posts" returns a Bluesky account''s posts. "Telegram channel" returns
                      a Telegram channel''s details. "Telegram channel posts" returns a Telegram channel''s posts. "Pinterest
                      search" returns the pins Pinterest finds for a query. "Pinterest pin" returns a Pinterest pin''s details.
                      "Pinterest board pins" returns the pins on a Pinterest board. "Pinterest user boards" returns a Pinterest
                      account''s boards. "Hacker News search" returns the Hacker News stories for a query. "Hacker News story
                      comments" returns the comments on a Hacker News story. "Twitch profile" returns a Twitch channel''s
                      profile. "Twitch videos" returns a Twitch channel''s videos. "Twitch clip" returns a Twitch clip''s
                      details. "Kick clip" returns a Kick clip''s details. "Snapchat profile" returns a Snapchat account''s
                      profile. "Truth Social profile" returns a Truth Social account''s profile. "Truth Social posts" returns
                      a Truth Social account''s posts. "GitHub profile" returns a GitHub account''s profile. "GitHub repository"
                      returns a GitHub repository''s details. "GitHub user repositories" returns a GitHub account''s repositories.
                      "Douyin profile" returns a Douyin account''s profile. "Douyin user videos" returns a Douyin account''s
                      videos. "Douyin video" returns a Douyin video''s details. "Weibo profile" returns a Weibo account''s
                      profile. "Weibo user posts" returns a Weibo account''s posts. "Weibo post" returns a Weibo post''s details.
                      "Xiaohongshu profile" returns a Xiaohongshu (RedNote) account''s profile. "Xiaohongshu user notes" returns
                      a Xiaohongshu account''s notes. "Xiaohongshu note" returns a Xiaohongshu note''s details. "Zhihu profile"
                      returns a Zhihu account''s profile. "Zhihu question answers" returns the answers to a Zhihu question.
                      "Kuaishou profile" returns a Kuaishou account''s profile. "Kuaishou user videos" returns a Kuaishou
                      account''s videos. "Kuaishou video" returns a Kuaishou video''s details. "Bilibili profile" returns
                      a Bilibili account''s profile. "Bilibili user videos" returns a Bilibili account''s videos. "Bilibili
                      video" returns a Bilibili video''s details. "Facebook ads" returns a company''s ads from Meta''s Ad
                      Library. "Google ads" returns a company''s ads from Google''s Ads Transparency Center. "LinkedIn ads"
                      returns a company''s ads from LinkedIn''s Ad Library. "TikTok ads" returns a company''s TikTok ads.
                      "G2 reviews" returns a software product''s reviews on G2. "Capterra reviews" returns a software product''s
                      reviews on Capterra. "Trustpilot reviews" returns a company''s reviews on Trustpilot. "Glassdoor reviews"
                      returns a company''s reviews on Glassdoor, written by people who work or worked there. "App Store app"
                      returns an app''s listing on the App Store from the app''s App Store ID. "App Store reviews" returns
                      an app''s reviews on the App Store. "Google Play app" returns an app''s listing on Google Play from
                      the app''s package name. "Google Play reviews" returns an app''s reviews on Google Play. "Amazon product"
                      returns a product''s listing on Amazon from the product''s ASIN. "Amazon search" returns the products
                      Amazon finds for a query, in the order Amazon ranks them. "Google Shopping product" returns a product''s
                      offers on Google Shopping from the product''s Google Shopping ID. "Google Shopping search" returns the
                      products Google Shopping shows for a query, in the order Google Shopping ranks them. "Walmart product"
                      returns the Walmart listing for a Walmart ID. "Walmart search" returns the products Walmart finds for
                      a query, in the order Walmart ranks them. "eBay product" returns the eBay listing for a listing ID.
                      "eBay search" returns the listings eBay finds for a query, in the order eBay ranks them. "eBay sold
                      listings" returns the listings eBay shows as sold for a query, newest sale first. "TikTok Shop product"
                      returns the listing at a TikTok Shop product link. "TikTok Shop search" returns the products TikTok
                      Shop finds for a query, in the order TikTok Shop ranks them. "Facebook Marketplace listing" returns
                      one listing from the listing''s link or ID. "Facebook Marketplace search" returns the listings Facebook
                      Marketplace shows for a search term in a city. "Zillow search" returns the homes Zillow lists in a place,
                      in the order Zillow ranks them. "Zillow property" returns a home''s Zillow listing from the home''s
                      Zillow URL. "Redfin search" returns the homes Redfin lists in a ZIP code, in the order Redfin ranks
                      them. "Redfin property" returns a home''s Redfin listing from the home''s Redfin URL. "Realtor.com search"
                      returns the homes Realtor.com lists in a place, in the order Realtor.com ranks them. "Realtor.com property"
                      returns a home''s Realtor.com listing from the home''s Realtor.com ID. "App Store search" returns the
                      apps the App Store finds for a query, in the order the App Store ranks them. "Google Play search" returns
                      the apps Google Play finds for a query, in the order Google Play ranks them. "ChatGPT answer" returns
                      ChatGPT''s answer to a prompt. "Perplexity answer" returns Perplexity''s answer to a prompt. "Gemini
                      answer" returns Gemini''s answer to a prompt. "Bing Copilot answer" returns Bing Copilot''s answer to
                      a prompt. "Google AI Overview answer" returns the AI Overview Google shows for a prompt, over its search
                      results. "Google AI Mode answer" returns the answer Google''s AI Mode gives a prompt. "Business verification"
                      looks a company up by legal name in a state''s register and returns the register''s record of the company.
                      "Local business search" finds businesses on a map that match your search in an area. You get each business''s
                      address, phone and website when the map lists them. "Local business reviews" returns a business''s reviews
                      on a map. You send the business''s place ID. "Domain WHOIS" returns a domain''s WHOIS record: who registered
                      it, its registrar, and when it was created, last updated and expires. "IP company lookup" returns the
                      name of the company or network that owns an IP address. Some answers give the owner''s domain, kind
                      of owner or ASN too.'
                  slug:
                    type: string
                    description: The API's slug, the words of its sheet's address on datacircle.dev, /<slug>-api-pricing.
                  sheetPage:
                    type: string
                    format: uri
                    description: The API's sheet on datacircle.dev, its plans and their prices.
                    nullable: true
                  bestPage:
                    type: string
                    format: uri
                    description: The API's best page on datacircle.dev, which ranks its providers on our benchmark. Null where
                      it has none.
                    nullable: true
                  total:
                    type: integer
                    description: How many plans the API has.
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
        '400':
          description: A parameter out of its range, with what it must be.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'No API has this slug: the answer lists every slug.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  slugs:
                    type: array
                    items:
                      type: string
        '429':
          description: More than 60 calls in a minute from one address.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /plans:
    get:
      operationId: searchPlans
      summary: Search the plans
      description: Every plan on the sheet, or an API's, or those whose provider or plan name holds every word of query. total
        counts every plan found, plans holds up to limit of them from offset.
      parameters:
      - name: api
        in: query
        description: The API, its name or its slug as /apis gives them. Every API when left out.
        schema:
          type: string
      - name: query
        in: query
        description: Words that must all appear in the provider's or plan's name, ignoring case and accents.
        schema:
          type: string
      - name: sort
        in: query
        description: 'score, the default: best first, as on the sheet at datacircle.dev, each API''s plans together, unscored
          plans last. provider: A to Z. price: $ per 1,000, lowest first.'
        schema:
          type: string
          enum:
          - score
          - provider
          - price
          default: score
      - name: limit
        in: query
        description: How many plans to give, 1 to 50. 10 when left out.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      - name: offset
        in: query
        description: How many found plans to skip first. 0 when left out.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Search the plans
          headers:
            Link:
              description: '<https://datacircle.dev/api>; rel="canonical": the answer''s page on datacircle.dev.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: How many plans were found.
                  offset:
                    type: integer
                    description: How many found plans were skipped first.
                  sheetPage:
                    type: string
                    format: uri
                    description: The API's sheet on datacircle.dev, its plans and their prices.
                    nullable: true
                  bestPage:
                    type: string
                    format: uri
                    description: The API's best page on datacircle.dev, which ranks its providers on our benchmark. Null where
                      it has none.
                    nullable: true
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
                    description: Up to limit plans, each with its rank on its API.
        '400':
          description: A parameter out of its range, with what it must be.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: More than 60 calls in a minute from one address.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /providers/{slug}:
    get:
      operationId: getProvider
      summary: One provider on every API
      description: The provider's plans on each API it sells, and its rank on each, as its best page ranks it.
      parameters:
      - name: slug
        in: path
        required: true
        description: 'The provider''s slug: its name in lowercase letters and digits, the rest a hyphen, as Bright Data''s
          bright-data.'
        schema:
          type: string
      responses:
        '200':
          description: One provider on every API
          headers:
            Link:
              description: '<https://datacircle.dev/api>; rel="canonical": the answer''s page on datacircle.dev.'
              schema:
                type: string
          content:
