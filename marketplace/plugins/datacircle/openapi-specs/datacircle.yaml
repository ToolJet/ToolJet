            the listing at a TikTok Shop product link. "TikTok Shop search" returns the products TikTok Shop finds for a query,
            in the order TikTok Shop ranks them. "Facebook Marketplace listing" returns one listing from the listing''s link
            or ID. "Facebook Marketplace search" returns the listings Facebook Marketplace shows for a search term in a city.
            "Zillow search" returns the homes Zillow lists in a place, in the order Zillow ranks them. "Zillow property" returns
            a home''s Zillow listing from the home''s Zillow URL. "Redfin search" returns the homes Redfin lists in a ZIP
            code, in the order Redfin ranks them. "Redfin property" returns a home''s Redfin listing from the home''s Redfin
            URL. "Realtor.com search" returns the homes Realtor.com lists in a place, in the order Realtor.com ranks them.
            "Realtor.com property" returns a home''s Realtor.com listing from the home''s Realtor.com ID. "App Store search"
            returns the apps the App Store finds for a query, in the order the App Store ranks them. "Google Play search"
            returns the apps Google Play finds for a query, in the order Google Play ranks them. "ChatGPT answer" returns
            ChatGPT''s answer to a prompt. "Perplexity answer" returns Perplexity''s answer to a prompt. "Gemini answer" returns
            Gemini''s answer to a prompt. "Bing Copilot answer" returns Bing Copilot''s answer to a prompt. "Google AI Overview
            answer" returns the AI Overview Google shows for a prompt, over its search results. "Google AI Mode answer" returns
            the answer Google''s AI Mode gives a prompt. "Business verification" looks a company up by legal name in a state''s
            register and returns the register''s record of the company. "Local business search" finds businesses on a map
            that match your search in an area. You get each business''s address, phone and website when the map lists them.
            "Local business reviews" returns a business''s reviews on a map. You send the business''s place ID. "Domain WHOIS"
            returns a domain''s WHOIS record: who registered it, its registrar, and when it was created, last updated and
            expires. "IP company lookup" returns the name of the company or network that owns an IP address. Some answers
            give the owner''s domain, kind of owner or ASN too.'
        website:
          description: The provider's website.
        pricingPage:
          description: 'The page where you buy the plan: the provider''s pricing page, or the plan''s page on another site,
            like RapidAPI. Some providers have no pricing page, like a job board with a free public API. For those, this is
            the page of API docs for the plan. The button on the plan''s page links to this page.'
        pitch:
          description: How the provider sells the row's call, quoted from the call's own page. When one page covers all the
            provider's calls, we quote the provider's own pitch. "[...]" marks a cut.
        strengths:
          description: The plan's strengths, which we work out from the plan's row. Each strength is a band that many plans
            of the same API are in. Strengths differ by API. We list and explain them under Strengths on datacircle.dev/fields.
            Only LinkedIn profiles and Find email have strengths so far. Blank (`[]` in the JSON) when the plan has none,
            and then the plan's page leaves Strengths out. Under Filters, you see only the rows with every strength you tick.
        aggregators:
          description: 'Aggregators like treg and Deepline sell the row''s call. With one aggregator account, you reach many
            providers. Each cell gives what a call costs through the aggregator with your own provider key. The cell also
            gives what 1,000 items cost when you pay the aggregator and have no account at the provider: "treg: your key free,
            paid $1.50". We add "per 1,000 results" when the aggregator charges per result found. We say "paid, no fixed price"
            when the aggregator publishes no price. When an aggregator charges by the page, we divide a page''s price by the
            most results one page holds. Then we multiply by 1,000. We write "paid, page size not stated" when the aggregator
            doesn''t say how many results a page holds. Some aggregators list the call but don''t say whether you pay them
            or use your own key. For those, we write "listed, how it''s sold not stated". An aggregator may sell one of the
            provider''s calls without saying which. Then the cell ends with "this call or another", the provider''s name and
            "call": "this call or another Pubrio call". A cell says "none" when no aggregator we checked for the row''s API
            sells the call. A blank cell (`null` in the JSON) means we haven''t checked any aggregator for that API. We skip
            calls an aggregator doesn''t list. In the JSON, each aggregator has these keys. `aggregator` is the aggregator''s
            name. `url` is the aggregator''s page for the call. `ownKey` is what a call costs there with your own key, or
            null when you can''t use yours. `paid` is true when you can pay the aggregator. `paid` and `ownKey` are both null
            when the aggregator doesn''t say how the call is sold. `callStated` is false when the aggregator doesn''t say
            whether the call is this one or another of the provider''s. `usd` is the aggregator''s price in dollars for one
            `per`, or null when the aggregator sets no price. `perThousand` is the aggregator''s price in dollars for 1,000.
            `per` is "call", "result" or "page". `resultsPerPage` is the most results a page holds, or null.'
        waterfall:
          description: Some routers, like treg's, try one provider after another until one finds the answer. On a router's
            call, the Waterfall column lists each provider the router tries, in order. After each provider, we give in brackets
            the name the router uses for that provider's call. Then we give the provider's price per 1,000 on this plan and
            how often the provider finds the answer. For Validate email and Validate phone, we give how often the provider
            checks what you send. We count a check whether the provider's verdict is right or wrong. We add "misses billed"
            when the provider charges for a miss. For a provider that charges by the page, we divide a page's price by the
            most results one page holds. Then we multiply by 1,000. We write "page size not stated" when the provider doesn't
            say how many results a page holds. The router publishes how often each provider finds an answer over all the router's
            calls. We assume each provider finds answers at the published rate. We assume this even on calls where the earlier
            providers found nothing. We leave the Waterfall column blank on calls with a single provider. In the JSON, each
            provider in the Waterfall is a step with these keys. `provider` is the provider's name. `call` is the provider's
            call, which you can also make alone. `perThousand`, `per` and `resultsPerPage` mean the same as the keys of the
            same names on a plan's row. `hitRate` is from 0 to 1, or null when the router publishes no rate. `missesBilled`
            is true when the provider charges for a miss.
        freshness:
          description: 'How old the answer may be, as the provider''s pages say. "live": the provider gets the data at the
            moment you call. The provider reads sources like LinkedIn, company websites, job boards, search results, keyword
            data or a page you send. Or the provider finds or checks an email or phone number at the moment you call. Some
            providers keep each answer for an hour or less. They give the same answer to anyone who asks the same question
            in that time. We call a plan that keeps answers for an hour or less "live" too. Renidly, for example, keeps each
            answer for 20 minutes. "1 month" or "30 days": the provider answers from a copy and refreshes the copy as often
            as the value says. "as of 2025-11-13": from a copy last refreshed that day. "stored": from a copy with no date
            on the provider''s pages. Some email or phone checks never ask the mail server or the carrier. They read only
            the format, the domain''s DNS and the provider''s own lists. We mark those checks "stored" too. Freshness is blank
            (`null` in the JSON) when the provider''s pages don''t say how fresh the answer is. Freshness is also blank when
            the pages don''t agree with each other. Plans that answer from a copy are on the same sheet as the plans that
            read live. When the provider''s pages give some fields a different freshness from the rest, we list those fields
            in brackets. `fieldFreshness` gives the freshness of each field in brackets. Bright Data''s LinkedIn profile is
            "live (current title, jobs, schools: as of 2025-11-13)". LinkedIn put current title, jobs and schools behind a
            login wall. Bright Data serves those three fields from a copy.'
        fieldFreshness:
          description: 'How old the answer may be, as the provider''s pages say. "live": the provider gets the data at the
            moment you call. The provider reads sources like LinkedIn, company websites, job boards, search results, keyword
            data or a page you send. Or the provider finds or checks an email or phone number at the moment you call. Some
            providers keep each answer for an hour or less. They give the same answer to anyone who asks the same question
            in that time. We call a plan that keeps answers for an hour or less "live" too. Renidly, for example, keeps each
            answer for 20 minutes. "1 month" or "30 days": the provider answers from a copy and refreshes the copy as often
            as the value says. "as of 2025-11-13": from a copy last refreshed that day. "stored": from a copy with no date
            on the provider''s pages. Some email or phone checks never ask the mail server or the carrier. They read only
            the format, the domain''s DNS and the provider''s own lists. We mark those checks "stored" too. Freshness is blank
            (`null` in the JSON) when the provider''s pages don''t say how fresh the answer is. Freshness is also blank when
            the pages don''t agree with each other. Plans that answer from a copy are on the same sheet as the plans that
            read live. When the provider''s pages give some fields a different freshness from the rest, we list those fields
            in brackets. `fieldFreshness` gives the freshness of each field in brackets. Bright Data''s LinkedIn profile is
            "live (current title, jobs, schools: as of 2025-11-13)". LinkedIn put current title, jobs and schools behind a
            login wall. Bright Data serves those three fields from a copy.'
        history:
          description: 'How far back the answers reach, on an API whose answers are dated. A company''s funding rounds and
            open jobs are dated. "since 2016": back to 2016. "open only": only what is open now. "the last 7 days": a window
            that ends today. "no limit": every one ever. ", closed only" after a value: the closed ones alone. Blank (`null`
            in the JSON) when the provider''s pages don''t say, or when the answers aren''t dated.'
        countries:
          description: 'On Validate phone, the countries whose numbers the call checks, like "United States". On Business
            verification, Company enrichment, Company discovery, Company hierarchy, Company headcount and Similar companies,
            the countries of the companies found. On People search, Person enrichment and Find email, the countries whose
            people the call finds. We take them from the provider''s pages. "Worldwide": the call covers any country. "Worldwide"
            also means the call covers over 100 countries. Blank (`null` in the JSON) until we read the countries on the provider''s
            pages. Also blank when the provider''s pages don''t list the countries. Blank on every other API.'
        fullFamilyTree:
          description: 'On Company hierarchy, this column says whether one call gives the whole family tree. The whole tree
            runs from the top parent down each branch. "yes" (`true` in the JSON): one call gives the whole tree, counting
            every page of results the call returns. "no" (`false`): one call gives part of the tree, like the parents or one
            level of subsidiaries. You call again for each company to get the rest. The column is blank (`null` in the JSON)
            until we read the provider''s website. The column is also blank when the provider''s website doesn''t say. Always
            blank on every other API.'
        checks:
          description: 'This column lists the checks each call makes, as the provider''s pages describe them. You find this
            column on the Validate email and Validate phone sheets. On Find email, the column lists the checks a finder makes
            on an address before giving you the address. A finder that asks the mail server takes longer than a finder that
            doesn''t. On an email, "format": the address is well formed. "mail servers": the domain has servers that take
            mail. "disposable domains": the call spots a domain on a list of throwaway domains. "role addresses": the call
            spots a shared address, like sales@. "mailbox": the call checks with the mail server that the mailbox exists.
            On a number, "numbering plan": the number fits the rules of the number''s country. "carrier": the call finds the
            carrier the number is with today. If the owner moved the number to a new carrier, you see the new carrier. "line
            in service": the call checks with the network that the line is live. "messaging apps": the call checks with a
            messaging app, like WhatsApp, that the number has an account there. A call without "mailbox" doesn''t check the
            mailbox. Such a call can pass an address that bounces. The column is blank (`null` in the JSON) until we read
            the provider''s pages. Also blank when the provider''s pages don''t say. Always blank on every other API.'
        searchesIn:
          description: 'This column says where the call looks for posts. We read where the call looks on the provider''s pages.
            You find this column on the LinkedIn post search sheet. "LinkedIn''s search": the call runs LinkedIn''s own search.
            "Google''s index": the call searches Google for LinkedIn posts. Google sets how many posts the call can find.
            New posts show up only after Google indexes them. "a search engine''s index": the call searches another search
            engine for LinkedIn posts. We also mark a call "a search engine''s index" when the provider''s pages don''t name
            the search engine. "the provider''s own database": the call searches a copy of LinkedIn posts the provider keeps.
            We leave the column blank (`null` in the JSON) when the provider''s pages don''t say. We leave the column blank
            for every other API.'
        keep:
          description: How long the provider's terms let you keep the API's answers. "no limit" when the terms set none. "no
            API terms" when the provider has no API terms.
        use:
          description: What the provider's terms let you use the API's answers for. Also what the terms ask in return, like
            a link back or a credit. "any" when the terms limit nothing and ask nothing. "no API terms" when the provider
            has no API terms.
        plan:
          description: The plan's name on the provider's pricing page, in English where that page writes it in another alphabet
            (XMLStock's "Максимум" is "Maximum"). Its plan page gives its own name too.
        who:
          description: 'Who the provider offers the plan to: "anyone", or the condition the provider''s pages set, like "anyone
            with a work email" or "on approval of an application".'
        auth:
          description: '"none" when the call needs no API key and no account with the provider on this plan. For example:
            a public job board, or a call you pay for each time from a wallet. Null when the call needs an API key or an account.'
        billing:
          description: 'How you pay. "free": the plan costs nothing. "on-demand": you pay for what you use, with nothing to
            buy first. "one-time": a pack or a top-up you pay for first, then use. "contact": no public price, so you ask
            the provider for one. A subscription: "monthly", "quarterly" (every three months), "half-yearly" (every six months)
            or "yearly". The sheet shows "one-time" as "pay first" and "on-demand" as "pay as you go".'
        charged:
          description: 'On a pay-as-you-go plan ("on-demand"), when the provider takes the money. "per call": you pay for
            each call, from a wallet. AnyAPI, Scrappa and Tomba take USDC by x402 or MPP. "monthly": the provider bills you
            each month for what you used, like Crawlbase and the RapidAPI plans. "at a threshold": the provider bills you
            each time you owe a set amount, like API Direct at $10. Blank (`null` in the JSON) on every other plan. The sheet
            shows Charged in the Pay column.'
        topUp:
          description: true on a top-up. A top-up is a plan you pay for first ("one-time"). You can top up any amount at or
            above the provider's minimum. The Pay column shows the minimum. All the money you top up pays for calls. AnyAPI's
            top-up from $10 works this way. false on a pack with a fixed size. Blank (`null` in the JSON) on every other plan.
            The CSV says "yes" on a top-up.
        pay:
          description: 'The plan''s price, in the plan''s `currency`. On a subscription, the price covers the months in `termMonths`.
            In the sheet''s CSV, we write the months after the price. Some examples: "$39.00/month", "€99.00/month" on a plan
            in euros, or "$468.00/15 months" on gtm-api.com''s yearly plan. A pack''s Pay is the pack''s price. A top-up''s
            Pay is the smallest amount you can top up. On a top-up with no minimum from the provider, Pay is blank (`null`
            in the JSON). A free plan''s Pay is $0.00. On a usage tier, Pay is what you pay each month for your calls below
            that tier. Each of those calls costs the price of the tier the call is in. Some tiers have a minimum. If your
            calls below the tier cost less than the minimum, you pay the minimum. When a usage tier sits on a subscription,
            you also pay the plan''s price. Crawlbase has a tier for the next 10M requests. On that tier, Pay is $583: what
            you pay each month for your calls below the tier. On Mailgun''s Foundation plan, you pay $95 a month for up to
            5,000 validations. The $95 is the $35 plan plus $60 for the validations. On a pay-as-you-go plan, the sheet''s
            Pay column shows Charged.'
        currency:
          description: '`currency` is the currency of the plan''s Pay, as an ISO 4217 code: "USD" for dollars, "EUR" for euros.
            `exchangeRate` is the dollars one unit of the currency buys: 1 for dollars.'
        exchangeRate:
          description: '`currency` is the currency of the plan''s Pay, as an ISO 4217 code: "USD" for dollars, "EUR" for euros.
            `exchangeRate` is the dollars one unit of the currency buys: 1 for dollars.'
        termMonths:
          description: 'On a subscription: how many months the plan''s Pay buys. 1, 3, 6 or 12 on a monthly, quarterly, half-yearly
            or yearly plan. Some providers give more months for the same price: gtm-api.com''s yearly plans run 15 months
            for the price of 12. Blank (`null`) on every other plan.'
        score:
          description: 'We score each plan out of 100 on five parts: price, accuracy, cost to get started, bundled calls and
            performance. We score accuracy and performance from our benchmark of the provider''s call. Until we benchmark
            the call, the plan''s accuracy, performance and Overall scores are N/A. The accuracy, performance and Overall
            scores are also N/A on a plan that lacks a check or feature the benchmarked plan has. The accuracy, performance
            and Overall scores are also N/A when we can''t tell which benchmark score fits the plan. A plan whose accuracy
            score is 0 has an Overall score of 0, whatever the plan''s other scores. Each API''s sheet shows what we measured
            on each benchmarked plan, in the columns after the price. We rank a plan''s price per 1,000 against the other
            scored plans of the same API. We score cost to get started and bundled calls on the plan alone. We give N/A to
            yearly plans, contact us plans and plans over $500 to start. We also give N/A to plans bought on a marketplace
            and plans that need your own LinkedIn, X or WhatsApp account. We score a free plan only when the provider has
            no paid plan for that call. The free plan must never end. Any limit on the plan''s calls must reset each day or
            sooner. Other free plans get N/A. A plan we don''t score gets no score for any of the five parts, even when we
            benchmarked the call. Click Score in the sheet''s bar to set the five weights. The JSON, datacircle.json and datacircle.csv
            give each plan''s score at the default weights. A plan with N/A has an empty score in the JSON, datacircle.json
            and datacircle.csv. The sheet''s CSV has no scores.'
        from:
          description: On a usage tier, like Crawlbase's pay as you go, `from` is the monthly item count where the tier's
            price starts. `from` counts calls or results, as `per` says. `graduated` is true when this tier's price covers
            only the items from `from` up. The items below `from` then cost the lower tiers' prices. `graduated` is false
            when every item of the month costs this tier's price. Both are null on every other plan.
        graduated:
          description: On a usage tier, like Crawlbase's pay as you go, `from` is the monthly item count where the tier's
            price starts. `from` counts calls or results, as `per` says. `graduated` is true when this tier's price covers
            only the items from `from` up. The items below `from` then cost the lower tiers' prices. `graduated` is false
            when every item of the month costs this tier's price. Both are null on every other plan.
        units:
          description: 'What the plan gives for the price, counted in `unit`. On a usage tier, where the tier starts: "from
            the 51st call a month".'
        unit:
          description: The unit the plan charges by. A "credit" is the provider's own credit. A "request" is one call. A "result"
            is one item a call returns. "usd" is a prepaid balance in dollars. An "execution hour" is an hour the provider's
            servers run your job. A "linked account" is your own LinkedIn account or WhatsApp number. A "seat" is one user.
            A "token" is the provider's count of the text a call reads and writes. Some providers count run time in tokens
            too. A "prompt" is a question the provider asks AI engines for you, every day or on another schedule. A "keyword"
            is a search term the provider tracks for you. It searches the term every day or every week, as the plan says.
            We show the plan's unit. If the plan names none, we show the provider's `unit`.
        renews:
          description: 'When `units` come back: "day", "month", "quarter", "half-year", "year", or "never". On a monthly plan
            whose units come back each day, you pay for 30 days of them. A yearly, half-yearly or quarterly plan has "month"
            when the units come a month at a time. The plan has "year", "half-year" or "quarter" when you get all the units
            at once.'
        expires:
          description: 'When the units you don''t use lapse, in the provider''s words: "never", "365 days", "at renewal: unused
            credits do not carry over". Blank when the provider''s pages don''t say.'
        ends:
          description: 'The plan''s last day, as the provider gives the date: 2026-12-02 for Explorium. We don''t score a
            plan that ends. We don''t link to the provider''s site. The day after the last day, we take the plan off the sheet.
            Blank for plans with no last day.'
        calls:
          description: 'The number of items you get for the plan''s price, counted in `per`. On a plan that charges by the
            page, `calls` and `monthlyCap` count pages. `calls` is the number of items the plan''s units pay for: "100 calls,
            once" for a free trial, "1,250 results a month" for an allowance. On a plan that charges by the call, `calls`
            is the plan''s units divided by the cost of one call. That cost includes the Start fee. A plan can limit calls
            per day or per month. Then `calls` is the most calls the limit allows before the units renew. The limit counts
            each call as one item. On a plan that charges by the page, the limit counts each call as one page. Say a plan
            allows 10,000 requests a month and 200 calls a day. You get 6,000 calls a month, because 30 days of 200 calls
            is 6,000. Some providers count each result toward the limit. A list you send in one call counts one result for
            each row. When a provider counts results, `limitsCountedIn` says "result", and `calls` and `monthlyCap` count
            results. A limit of 2,000 results a day allows 60,000 results in a month of 30 days. We fill `monthlyCap` when
            a call costs 0 units, like a call on a flat fee. `monthlyCap` is the most items you get a month, or "no limit".
            On a plan with a daily or monthly limit, `monthlyCap` is the most calls in 30 days. 3,000 calls a day make 90,000.
            The Enough for column shows 3,000 calls a day as "90,000 calls a month". A call that charges by the result can
            take several items at once. Each item then counts as one result: 50 calls a day of 10 items make 15,000 results
            in 30 days. A call that returns a list, like a search, gets as many results as it finds. A limit on its calls
            doesn''t cap its results. Any plan can limit calls per hour, minute or second. `calls` and `monthlyCap` also hold
            the most calls a limit per hour, minute or second allows. A limit of 50 calls an hour allows 36,000 calls in 30
            days. We count a call limit in `monthlyCap` only when each call returns one item or a fixed-size page. Some providers
            say they limit the month but give no number. When such a plan has no daily or monthly limit, `monthlyCap` is `null`,
            whatever its limit per hour, minute or second. Such a limit says how fast you can call, not how many items the
            month gives. On a free trial shorter than 30 days, `monthlyCap` is the most calls you get over the whole trial.
            The trial''s calls never renew. A 7-day trial with 1,000 calls a day shows as "7,000 calls, once". Enough for
            shows `calls`, or `monthlyCap` when a row has no `calls`. On a plan with a Monthly fee, the provider first takes
            one month''s fee from the plan''s units. `calls` counts the calls left after the fee. We count the calls again
            each time the provider refills the plan''s units. Enough for says "0 calls left after the monthly fee" when the
            fee uses up all the plan''s units. Enough for is blank when the provider doesn''t say how many items you get.
            Enough for is also blank on pay as you go plans and on top-ups. Enough for is blank too on subscriptions that
            charge for each item on top of the fee. Enough for is also blank when a waterfall''s average call costs nothing.
            `calls` and `monthlyCap` are `null` when Enough for is blank.'
        monthlyCap:
          description: 'The number of items you get for the plan''s price, counted in `per`. On a plan that charges by the
            page, `calls` and `monthlyCap` count pages. `calls` is the number of items the plan''s units pay for: "100 calls,
            once" for a free trial, "1,250 results a month" for an allowance. On a plan that charges by the call, `calls`
            is the plan''s units divided by the cost of one call. That cost includes the Start fee. A plan can limit calls
            per day or per month. Then `calls` is the most calls the limit allows before the units renew. The limit counts
            each call as one item. On a plan that charges by the page, the limit counts each call as one page. Say a plan
            allows 10,000 requests a month and 200 calls a day. You get 6,000 calls a month, because 30 days of 200 calls
            is 6,000. Some providers count each result toward the limit. A list you send in one call counts one result for
            each row. When a provider counts results, `limitsCountedIn` says "result", and `calls` and `monthlyCap` count
            results. A limit of 2,000 results a day allows 60,000 results in a month of 30 days. We fill `monthlyCap` when
            a call costs 0 units, like a call on a flat fee. `monthlyCap` is the most items you get a month, or "no limit".
            On a plan with a daily or monthly limit, `monthlyCap` is the most calls in 30 days. 3,000 calls a day make 90,000.
            The Enough for column shows 3,000 calls a day as "90,000 calls a month". A call that charges by the result can
            take several items at once. Each item then counts as one result: 50 calls a day of 10 items make 15,000 results
            in 30 days. A call that returns a list, like a search, gets as many results as it finds. A limit on its calls
            doesn''t cap its results. Any plan can limit calls per hour, minute or second. `calls` and `monthlyCap` also hold
            the most calls a limit per hour, minute or second allows. A limit of 50 calls an hour allows 36,000 calls in 30
            days. We count a call limit in `monthlyCap` only when each call returns one item or a fixed-size page. Some providers
            say they limit the month but give no number. When such a plan has no daily or monthly limit, `monthlyCap` is `null`,
            whatever its limit per hour, minute or second. Such a limit says how fast you can call, not how many items the
            month gives. On a free trial shorter than 30 days, `monthlyCap` is the most calls you get over the whole trial.
            The trial''s calls never renew. A 7-day trial with 1,000 calls a day shows as "7,000 calls, once". Enough for
            shows `calls`, or `monthlyCap` when a row has no `calls`. On a plan with a Monthly fee, the provider first takes
            one month''s fee from the plan''s units. `calls` counts the calls left after the fee. We count the calls again
            each time the provider refills the plan''s units. Enough for says "0 calls left after the monthly fee" when the
            fee uses up all the plan''s units. Enough for is blank when the provider doesn''t say how many items you get.
            Enough for is also blank on pay as you go plans and on top-ups. Enough for is blank too on subscriptions that
            charge for each item on top of the fee. Enough for is also blank when a waterfall''s average call costs nothing.
            `calls` and `monthlyCap` are `null` when Enough for is blank.'
        perThousand:
          description: The price of 1,000 items on this plan, in dollars. The price is 0 on a free plan. A lifetime plan is
            one you pay for once. Its units come back each day or month, with no end. On a lifetime plan, we spread the price
            over 24 months of units. On a plan that charges by the call, each call asks for one item. We add the Start fee
            to each item's price. When the call has a Minimum per call above that, each item costs the minimum. On a plan
            that charges by the page, we divide a page's price by the most results one page holds. Then we multiply by 1,000.
            We leave the price blank when the provider doesn't say how many results a page holds. On a search that charges
            by the page, we price the first page of each search, whatever the page holds. On a flat fee, we take the most
            items the plan allows in one month. We multiply those items by the months the fee covers. We divide the fee by
            that total. Then we multiply by 1,000. We leave the price blank when the provider doesn't say how many items the
            plan allows. A plan with no end date and only limits per second, minute, hour or day has no cap on items. A flat
            fee with no cap on items shows "no limit" on the sheet. We leave the price blank in the CSV and JSON. On a waterfall's
            paid plan, we show the average cost of a call. We take the price of each provider listed under Waterfall. We weight
            each price by how often a call reaches that provider. We leave the price blank when a provider a call can reach
            has no hit rate or page size. On a plan with a Monthly fee, we first subtract one month of the fee from the plan's
            units. Then we divide the plan's price by the number of items the remaining units buy. Then we multiply by 1,000.
            We leave the price blank when the Monthly fee uses up all the plan's units. Some plans limit calls per second,
            minute, hour, day or month. We divide the price by the items the limit allows, if that is fewer than the items
            you pay for. Then we multiply by 1,000. We leave the price blank on a top-up, because a top-up buys no fixed number
            of items. We also leave the price blank when the provider's website doesn't say what an item costs on this plan.
            We leave the price blank, too, when the website doesn't say how many items the price buys.
        listPerThousand:
          description: 'For a provider that prices in dollars, like an Apify Actor: dollars for 1,000 items at the provider''s
            list price. Apify sells a year of credit at a discount: on Starter, $204 buys $228 of credit, twelve months at
            $19. So an Actor''s yearly plans cost less per 1,000 than the Actor''s list price. On a plan that charges by the
            call, List $ per 1,000 includes the Start fee. On a discounted plan, click or tap the plan''s $ per 1,000 on the
            sheet to see who gives the discount. The plan''s page also names who gives the discount, under the price. `listPerThousand`
            is blank (`null` in the JSON) when the provider prices in credits or calls. The key is also blank when the provider''s
            pages don''t say what an item costs.'
        overagePerThousand:
          description: 'On a subscription: dollars for each 1,000 items you get past the plan''s units, when the provider
            sells extra items. On a plan that charges by the call, Overage includes the Start fee.'
        unitsCap:
          description: '"hard" means calls stop once the plan''s units run out. "soft" means calls go on after the plan''s
            units run out. Those calls cost the Overage price when the provider gives one. Blank (`null` in the JSON) when
            the provider''s pages don''t say.'
        addons:
          description: 'On an email API''s subscription: the packs of units the provider sells on top of the plan. We read
            them on the pricing page. Each pack has `units` and `pay`, in the plan''s currency. `renews` is "month" or "year"
            when you pay for the pack again with the plan. `renews` is "never" when you buy the pack once. `perThousand` is
            dollars for 1,000 emails at the pack''s price. The sheet''s CSV says "500 credits a month for $10 ($20.00 per
            1,000)". An empty list when the provider sells none. Blank (null) on every other plan.'
        notFoundPerThousand:
          description: What you pay for 1,000 items the provider has no answer for. 0 when the provider charges nothing for
            them, as on free plans. On a waterfall, the cost of a call when no provider finds the answer. That cost is the
            sum of the prices of the providers that charge for a miss.
        catchAllPerThousand:
          description: 'On an email API: dollars for 1,000 calls that return an address at a catch-all domain. Such a domain
            takes mail for any address. So you can''t check whether the person''s mailbox exists, and the email may bounce.
            0 when such calls cost nothing, or when the provider returns no such address. The same as the row''s $ per 1,000
            when the provider charges for any address found. Blank when the provider''s pages don''t say.'
        bounceRefund:
          description: 'On an email API: the credit or refund the provider gives when a paid address bounces. Also the conditions,
            in the provider''s words, like "the credit, reported from the dashboard or the API and reviewed". "never" when
            the provider''s pages say a bounced address stays charged. Blank when the pages don''t say.'
        repeatFree:
          description: 'On a call that costs units: how long you can get a paid item again for free. On a flat fee with a
            call limit, the time before the same item counts toward the limit again. We copy the time from the provider''s
            pages, like "20 minutes". "no limit" means the provider never charges again for an item you paid for once. "never"
            means the provider charges each time you get the item again. Blank when the provider''s pages don''t say.'
        alsoPaysFor:
          description: The other calls you get for the plan's price. The other calls each have a separate limit. We use the
            provider's words, in English where the provider writes them in another alphabet, as the Call column does. When
            a plan pays for more than 40 other calls, we write their count instead, like "300 other calls". We leave out apps,
            extensions, MCP servers, proxies and storage, since they are not calls. We also leave out features you can use
            only in the provider's app, like sending the provider's email campaigns. For example, gtm-api.com's account price
            also buys 100 searches, 50 messages and 25 connection requests a day. "nothing" when you get only the row's call.
            The row's $ per 1,000 is for that call alone, since providers don't say how to split their price. Blank (`null`
            in the JSON) until we read the provider's plan. Also blank on a "contact" plan whose pages don't say what the
            price buys.
        sharesBudgetWith:
          description: 'The other calls that spend the same credits or limit as this row''s call, like gtm-api.com''s company
            and post reads. We name each in English where the provider writes it in another alphabet: XMLStock''s "Яндекс
            Wordstat" is "Yandex Wordstat". When more than 40 other calls spend the same credits or limit, we write their
            count instead, like "300 other calls". We leave out apps and MCP servers, which are not calls. We work out the
            row''s $ per 1,000 as if you make none of these calls. "nothing" when no other call shares the budget. On the
            sheet, the Also pays for column lists these calls last, after the words "from the same budget". Blank (`null`
            in the JSON) until we check which calls share the budget. Also blank when the provider''s pages don''t say.'
        startPerCall:
          description: A fee in dollars you pay once for each call, on top of the price per item. An Apify Actor's start fee
            is one. You pay the same fee for a call of 1,000 items or a call of one item. On a plan that charges by the call,
            each call asks for one item. On that plan, the $ per 1,000, List $ per 1,000, Overage and Enough for columns all
            count the Start fee. On a plan that charges by the result or the page, a call can return any number of results.
            On those plans, the $ per 1,000, List $ per 1,000, Overage and Enough for columns leave the Start fee out. The
            Start fee is $0.00 on a free plan, and blank when the plan has no start fee. A provider's page can give a range,
            like "2-3 credits". `startPerCall` then holds the lowest fee and `startPerCallMax` holds the highest. The sheet
            and the CSV show "$0.04 to $0.06". `startPerCallMax` is blank on a plan with one start fee or none.
        startPerCallMax:
          description: A fee in dollars you pay once for each call, on top of the price per item. An Apify Actor's start fee
            is one. You pay the same fee for a call of 1,000 items or a call of one item. On a plan that charges by the call,
            each call asks for one item. On that plan, the $ per 1,000, List $ per 1,000, Overage and Enough for columns all
            count the Start fee. On a plan that charges by the result or the page, a call can return any number of results.
            On those plans, the $ per 1,000, List $ per 1,000, Overage and Enough for columns leave the Start fee out. The
            Start fee is $0.00 on a free plan, and blank when the plan has no start fee. A provider's page can give a range,
            like "2-3 credits". `startPerCall` then holds the lowest fee and `startPerCallMax` holds the highest. The sheet
            and the CSV show "$0.04 to $0.06". `startPerCallMax` is blank on a plan with one start fee or none.
        minimumPerCall:
          description: 'The least you pay for one call, in dollars, when its items and its Start fee cost less. The sheet
            says it under the $ per 1,000, on hover and on the plan''s page. Rakko Keyword charges at least 15 credits a request,
            for any number of keywords. On a plan that charges by the call, each call asks for one item, so the $ per 1,000
            counts each item at the minimum. On a plan that charges by the result or the page, the $ per 1,000 leaves the
            minimum out. `perThousandFrom` then says from how many results or pages a call the $ per 1,000 holds: 500 keywords
            at Rakko Keyword''s 0.03 credits a keyword. A call of fewer costs the minimum. The minimum is $0.00 on a free
            plan. Blank (`null` in the JSON) when the call has no minimum, and `perThousandFrom` blank on a plan that charges
            by the call.'
        perThousandFrom:
          description: 'The least you pay for one call, in dollars, when its items and its Start fee cost less. The sheet
            says it under the $ per 1,000, on hover and on the plan''s page. Rakko Keyword charges at least 15 credits a request,
            for any number of keywords. On a plan that charges by the call, each call asks for one item, so the $ per 1,000
            counts each item at the minimum. On a plan that charges by the result or the page, the $ per 1,000 leaves the
            minimum out. `perThousandFrom` then says from how many results or pages a call the $ per 1,000 holds: 500 keywords
            at Rakko Keyword''s 0.03 credits a keyword. A call of fewer costs the minimum. The minimum is $0.00 on a free
            plan. Blank (`null` in the JSON) when the call has no minimum, and `perThousandFrom` blank on a plan that charges
            by the call.'
        monthlyFee:
          description: A monthly fee the call needs. The provider takes the fee from the plan's units. For example, RouterGrowth
            charges $9.625 a month for each LinkedIn account you connect. `monthlyFee` is the fee in dollars. `monthlyFeePer`
            is what one fee pays for, like "LinkedIn account". The Enough for and $ per 1,000 columns count what is left after
            one month of the fee. Blank (`null` in the JSON) when the call has no monthly fee.
        monthlyFeePer:
          description: A monthly fee the call needs. The provider takes the fee from the plan's units. For example, RouterGrowth
            charges $9.625 a month for each LinkedIn account you connect. `monthlyFee` is the fee in dollars. `monthlyFeePer`
            is what one fee pays for, like "LinkedIn account". The Enough for and $ per 1,000 columns count what is left after
            one month of the fee. Blank (`null` in the JSON) when the call has no monthly fee.
        extras:
          description: Fields that cost more than the row's price. Each group of extra fields has `fields` and `perThousand`.
            `perThousand` is the price you pay on top of the row's price. Some providers charge for each search and also for
            the extra fields on each result. For those providers, `perThousand` is the price for 1,000 searches. We assume
            each search returns the most results the plan allows.
        costUnits:
          description: The plan's units one call costs, counted in `unit`. 1 for a call at one credit. 0 for a free call,
            like a call on a flat fee. On a plan that charges by the result or the page, the units one result or page costs,
            as `per` says. Null when the provider doesn't list the cost.
        per:
          description: The price counts a "call" or a "result". A call asks for one item. A result is each item a call returns.
            Some calls return a page of results. "result" means you pay for each result on the page. "page of 50" means you
            pay for each page of up to 50 results. You pay for a whole page even when the page holds fewer than 50. In the
            JSON, `resultsPerPage` is the most results a page holds. `resultsPerPage` is `null` when the price isn't per page
            or the provider doesn't say the page size. "page, size not stated" means the provider doesn't say how many results
            a page holds. On a search, a call is one search, and a "page of 10" holds up to 10 results. The price is for the
            first page of each search. Each further page costs the same as the first page.
        resultsPerPage:
          description: The price counts a "call" or a "result". A call asks for one item. A result is each item a call returns.
            Some calls return a page of results. "result" means you pay for each result on the page. "page of 50" means you
            pay for each page of up to 50 results. You pay for a whole page even when the page holds fewer than 50. In the
            JSON, `resultsPerPage` is the most results a page holds. `resultsPerPage` is `null` when the price isn't per page
            or the provider doesn't say the page size. "page, size not stated" means the provider doesn't say how many results
            a page holds. On a search, a call is one search, and a "page of 10" holds up to 10 results. The price is for the
            first page of each search. Each further page costs the same as the first page.
        resultsCap:
          description: 'For a search API: the most results one search gets on this plan, however many pages you ask for. "no
            limit" when the provider says you can get every match. Blank (`null` in the JSON) when the provider''s docs don''t
            say, or when the API isn''t a search. On a plan that charges by the page, you pay for each page you ask for.'
        perSecond:
          description: 'The most calls a second you can keep up. When the provider counts a limit over a longer window, we
            divide the limit. We divide a limit per minute by 60, per 5 minutes by 300, per hour by 3,600. When the provider
            sets several limits, we show the tightest: 25 a second and 40 a minute is 0.67. We round to two decimals. A rate
            under 0.1 keeps two digits past the zeros: 5 an hour is 0.0014.'
        perDay:
          description: 'The most calls a day. Some providers count each result of a call instead, like each row of a list.
            `limitsCountedIn` says what the provider counts: "call", "result" or "page". The provider counts the same unit
            for this column and for the plan''s monthly limit. `limitsCountedIn` says "call" when the provider''s docs don''t
            say.'
        limitsCountedIn:
          description: 'The most calls a day. Some providers count each result of a call instead, like each row of a list.
            `limitsCountedIn` says what the provider counts: "call", "result" or "page". The provider counts the same unit
            for this column and for the plan''s monthly limit. `limitsCountedIn` says "call" when the provider''s docs don''t
            say.'
        concurrent:
          description: The most calls running at once, or "no limit". "n/a" when the provider sets no cap on calls at once
            but limits calls by the second. Then Per second sets your limit. Blank (null) when the provider's pages don't
            say.
        batch:
          description: The most items you send in one call on this plan. 1 when the call takes one at a time. "no limit" when
            the provider says a call takes any number. Blank (null) when a call takes a list and the provider's pages don't
            say how many. A call that refuses fewer than a set number shows the fewest and the most, like "2,000 to 2,000,000".
            A call that needs at least 2,000 and has no top limit shows "2,000 or more". A call that needs at least 2,000
            shows "at least 2,000" when the provider's pages don't give the top limit.
        minBatch:
          description: The fewest items you send in one call on this plan, when the provider refuses fewer. The Batch column
            shows this number first, like "2,000 to 2,000,000". Null when the provider sets no lowest number.
        answer:
          description: The way you get the call's answer. "in the call" when the call's response holds the answer. "by polling
            or webhook" when the call returns a job. Once the job is done, you get the answer from another call or at your
            webhook. "in the call or by polling" when the call returns the answer if the answer is ready in time. If the answer
            isn't ready, the call returns a job you check later. An Apify Actor returns a job when the run goes past 5 minutes.
            "in the call or by webhook" when you choose in your request. "by polling" when only another call gets the answer.
            "by webhook" when only a URL you give gets the answer. Blank (null) when the provider's pages don't say.
        call:
          description: The call's name in the provider's docs, when the provider sells more than one call for the API. LinkFinder
            AI's lead_full_name_to_email and linkedin_profile_to_email are two such calls, both POST /. In English where the
            docs write it in another alphabet (XMLStock's "Яндекс Live" is "Yandex Live"). Its plan page gives its own name
            too. Blank (`null` in the JSON) when the provider sells one.
        method:
          description: The call's HTTP method.
        path:
          description: We give the path from the provider's docs. When that path fails, we give the path that works. Each
            plan of a call has the same path. A plan the provider serves at a separate address has a separate path.
        send:
          description: You send an input like a URL, an email or a keyword. You must send every input listed before "Optional:".
            In the CSV and JSON downloads, the inputs after a semicolon are optional.
        fields:
          description: The fields the answer can hold at the row's price, each when the provider has the value. We count the
            answer that holds the result, a not-found included. We leave out a field that only an error holds. Errors include
            no credits left, a bad input, a timeout and a rate limit. We also leave out a failed row of a bulk answer. An
            answer with no result yet, still verifying or queued, is left out too. We count each field once. A list counts
            once, and so does each field in the list. So jobs, job title and job company are three fields. We count this way
            for every provider. Under Filters, Must return keeps the rows whose answer can hold every field you tick, at the
            row's price.
        docsBehind:
          description: Where the provider shows the call's docs only once you sign up ("sign-up") or only to customers who
            buy by contract ("sales"). The plan's Method, Path and You send are then empty, since no public page shows them.
            Empty where a public page documents the call.
        latencyMs:
          description: The median time a call takes. For a benchmarked call, we show our benchmark's median. The API's benchmark
            columns show the same median. From each call's time, we subtract the mean time of three free calls to the same
            provider, made just before. If that mean is longer than the call, we use the provider's median baseline instead.
            We cap the baseline at the call's time, so no time is below zero. For a call we didn't benchmark, we show the
            time from the provider's pages. Or we show a time we measured when we added the row. On a plan without a check
            or feature of the benchmarked plan, we show the provider's time or our own. We leave the median blank (null) when
            we have no time. We also leave the median blank when the benchmarked call gave no answer we could time. The JSON
            and datacircle.csv give the time in milliseconds. The sheet and the sheet's CSV give the time in seconds.
        docs:
          description: The provider's page for the call.
        readFrom:
          description: 'The pages we read the row''s values from. They are the sheet''s last column: click a cell to see each
            page, or press ⌘C to copy them all.'
        checked:
          description: The day we last read every value on those pages, California time.
        page:
          type: string
          format: uri
          description: 'The address of the plan''s own page on datacircle.dev. Only datacircle.json and datacircle.csv have
            this key, and each plan our MCP server gives. There it is the page search engines show for the plan: its own page,
            or the page of a plan list that holds it.'
        rank:
          type: integer
          minimum: 1
          description: The plan's place among its API's plans we score, best first, from 1, as the sheet orders them. Null
            on a plan we don't score, listed after them.
          nullable: true
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
