          creatify-aurora: '#/components/schemas/CreatifyAuroraRequest'
          veo-3.1-fast-generate-001: '#/components/schemas/Veo3_1FastRequest'
          veo-3.1-generate-001: '#/components/schemas/Veo3_1Request'
    BytedanceSeedance25Request:
      properties:
        webhook:
          description: Include to send the generation's result to the workspace's configured flows webhooks once it completes or fails. The webhook payload matches the terminal response of the corresponding GET endpoint.
          examples:
            - type: all
            - ids:
                - Q8mVr2LpXcT4nB6yJdKw
