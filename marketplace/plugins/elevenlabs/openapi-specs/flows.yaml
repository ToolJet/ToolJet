    TemplateRunCreateRequest:
      properties:
        inputs:
          additionalProperties:
            $ref: '#/components/schemas/TemplateRunInput'
          type: object
          maxProperties: 64
          title: Inputs
          description: 'Input values keyed by input port id. Every input port of the version being run must be given; a missing or unknown id is rejected. Pass `{}` for a template with no inputs.'
        version_id:
          title: Version Id
          description: 'The template snapshot to run. Pass a specific version id to pin that snapshot, or `latest` (the default when omitted) to run the template''s most recently published version. Only published versions can be pinned, except by the template''s owner, who may also pin an unpublished saved snapshot to try it out before publishing. The live draft is never run through this API.'
          examples:
            - latest
            - ver_01hxyz
          type: string
          minLength: 1
        webhook:
          description: 'Include to send the run''s result to the workspace''s configured flows webhooks once the run''s `status` reaches `completed` or `failed`. One event for the whole run: the `flows_template_run` event''s `data` matches the terminal response of `GET /v1/flows/templates/{template_id}/runs/{run_id}`.'
          examples:
            - type: all
            - ids:
                - Q8mVr2LpXcT4nB6yJdKw
              type: ids
          $ref: '#/components/schemas/WebhookTarget'
      additionalProperties: false
      type: object
      required:
        - inputs
      title: TemplateRunCreateRequest
      description: 'Request body of ``POST /v1/flows/templates/{template_id}/runs``.'
      example:
        inputs:
          prompt: a corgi on a surfboard
          reference:
            asset_id: 5xM2KqOnZyce22SPZ9d4
            type: asset
        version_id: latest
        webhook:
          type: all
    WebhookTarget:
      oneOf:
        - $ref: '#/components/schemas/WebhookTargetAll'
        - $ref: '#/components/schemas/WebhookTargetIds'
      discriminator:
        propertyName: type
        mapping:
          all: '#/components/schemas/WebhookTargetAll'
          ids: '#/components/schemas/WebhookTargetIds'
    WebhookTargetIds:
      properties:
        type:
          type: string
          const: ids
          title: Type
          description: Send the result to the listed flows webhooks.
        ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Ids
          description: The IDs of the workspace flows webhooks to deliver the result to. Each must be one of the workspace's configured flows webhooks.
          examples:
            - - Q8mVr2LpXcT4nB6yJdKw
      type: object
      required:
        - type
        - ids
      title: WebhookTargetIds
      description: Deliver the result to specific configured flows webhooks.
    WebhookTargetAll:
      properties:
        type:
          type: string
          const: all
          title: Type
          description: Send the result to all of the workspace's configured flows webhooks.
      type: object
      required:
        - type
      title: WebhookTargetAll
      description: Deliver the result to all of the workspace's configured flows webhooks.
    TemplateRunInput:
      anyOf:
        - type: string
        - type: boolean
        - type: integer
        - type: number
        - $ref: '#/components/schemas/TemplateInputReference'
        - items:
            $ref: '#/components/schemas/TemplateRunInput'
          type: array
          maxItems: 64
      title: TemplateRunInput
      description: |-
        One value bound to a template input port, in the form its `content_schema`
        calls for. A `string` port takes the text itself; `number`, `integer` and
        `boolean` ports take a JSON value of that type. Anything stored elsewhere is
        a reference discriminated on `type`: a prior `generation`, an uploaded
        `asset`, a `voice`, or media passed `inline_base64`. An `array` port takes a
        JSON array with one value per element, admissible for the schema's `items`.
        `object` ports cannot be bound through this API yet.

        No constraints beyond the wire shape live here: what a port accepts (an
        `enum`, a length) is stated by its `content_schema`, and the run path
        validates against that same schema.
    TemplateInputReference:
      oneOf:
        - $ref: '#/components/schemas/GenerationReference'
        - $ref: '#/components/schemas/StaticAssetReference'
        - $ref: '#/components/schemas/VoiceReference'
        - $ref: '#/components/schemas/InlineBase64Reference'
      discriminator:
        propertyName: type
        mapping:
          asset: '#/components/schemas/StaticAssetReference'
          generation: '#/components/schemas/GenerationReference'
          inline_base64: '#/components/schemas/InlineBase64Reference'
          voice: '#/components/schemas/VoiceReference'
    InlineBase64Reference:
      properties:
        type:
          type: string
          const: inline_base64
          title: Type
        content_base64:
          type: string
          maxLength: 34952536
          title: Content Base64
          description: 'The media file''s bytes, base64-encoded (standard alphabet). Up to 25MB decoded.'
          examples:
            - iVBORw0KGgoAAAANSUhEUgAA...
        mime_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/heic
            - image/heif
            - audio/mpeg
            - audio/wav
            - video/mp4
            - video/quicktime
            - video/webm
          title: Mime Type
          description: The MIME type of the encoded media.
      additionalProperties: false
      type: object
      required:
        - type
        - content_base64
        - mime_type
      title: InlineBase64Reference
      description: |-
        Media passed inline as base64. Stored as an ephemeral asset with no
        guaranteed retention. To keep an input and reuse it, upload via
        ``POST /v1/assets`` and pass an ``asset`` reference instead.
    VoiceReference:
      properties:
        type:
          type: string
          const: voice
          title: Type
        voice_id:
          type: string
          minLength: 1
          title: Voice Id
          description: The ID of a voice in this workspace.
          examples:
            - 21m00Tcm4TlvDq8ikWAM
      additionalProperties: false
      type: object
      required:
        - type
        - voice_id
      title: VoiceReference
      description: A voice this workspace can use.
    StaticAssetReference:
      properties:
        type:
          type: string
          const: asset
          title: Type
        asset_id:
          type: string
          title: Asset Id
          description: 'The ID of an asset uploaded via the assets API (`POST /v1/assets`), as returned in that response''s `asset_id`.'
          examples:
            - 5xM2KqOnZyce22SPZ9d4
      additionalProperties: false
      type: object
      required:
        - type
        - asset_id
      title: StaticAssetReference
      description: An asset uploaded via the assets API.
    GenerationReference:
      properties:
        type:
          type: string
          const: generation
          title: Type
        generation_id:
          type: string
          title: Generation Id
          description: 'The ID of the generation whose output to use, as returned when the generation was created.'
          examples:
            - JWr5N6X9ZTqf8jD2LmQb
      additionalProperties: false
      type: object
      required:
        - type
        - generation_id
      title: GenerationReference
      description: The output of a prior generation on this API.
    TemplateRunListResponse:
      properties:
        runs:
          items:
            $ref: '#/components/schemas/TemplateRunResponse'
          type: array
          title: Runs
          description: 'The runs on this page, newest first. Each item has the same shape as `GET /v1/flows/templates/{template_id}/runs/{run_id}`.'
        next_cursor:
          title: Next Cursor
          description: Pass as `cursor` to fetch the next page. `null` when there is no further page.
          type: string
        has_more:
          type: boolean
          title: Has More
          description: Whether more runs exist beyond this page.
          readOnly: true
      type: object
      required:
        - runs
        - next_cursor
        - has_more
      title: TemplateRunListResponse
      description: 'One page of the caller''s public-API template runs, newest first.'
      example:
        has_more: true
        next_cursor: MjAyNi0wNy0xN1QxMjowMDowMHxLeDJtUDdZNFdWcmc5a0UzTm5SYw
        runs:
          - id: sess_JWr5N6X9ZTqf8jD2LmQb
            outputs:
              marketing_title:
                content: Ride the wave.
                id: Kx2mP7Y4WVrg9kE3NnRc
                status: completed
                type: string
              product_demo:
                id: QWr5N6X9ZTqf8jD2La3B
                status: generating
                type: video
              product_still:
                content_mime_type: image/png
                content_url: 'https://storage.googleapis.com/generations/JWr5N6X9ZTqf8jD2LmQb'
                id: JWr5N6X9ZTqf8jD2LmQb
                status: completed
                type: image
            status: generating
            template_id: tmpl_abc123
            version_id: ver_01hxyz
