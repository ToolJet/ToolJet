          items:
            $ref: '#/components/schemas/AudioReference'
          type: array
          maxItems: 10
          title: Audios
          description: 'Up to 10 reference audios, e.g. for lipsync. Cannot be combined with `start_frame`/`end_frame`.'
      additionalProperties: false
      type: object
      required:
        - model_id
        - prompt
      title: BytedanceSeedance25Request
      description: |-
        Request body for the ByteDance Seedance 2.5 video model.

        Diverges from the Seedance 2.0 public shape: no 4K, durations up to 30s,
        larger reference caps, audio-only input allowed, and no ``seed`` (Ark
        tolerates it but does not honour it).

        ByteDance models are disabled by default and require explicit approval
        before use. Contact support to request access.
    AudioReference:
      oneOf:
        - $ref: '#/components/schemas/GenerationReference'
        - $ref: '#/components/schemas/StaticAssetReference'
        - $ref: '#/components/schemas/InlineAudioReference'
