  '/v1/flows/templates/{template_id}/runs':
    get:
      tags:
        - Flows
        - Templates
      summary: List Template Runs
      description: 'List this template''s runs created through this API, newest first.'
      operationId: list_public_template_runs
      parameters:
        - name: template_id
          in: path
          required: true
          schema:
            type: string
            description: 'The ID of the template, as shown in the ElevenLabs app or by `GET /v1/flows/templates`.'
            title: Template Id
          description: 'The ID of the template, as shown in the ElevenLabs app or by `GET /v1/flows/templates`.'
        - name: cursor
          in: query
          required: false
          schema:
            description: 'Pagination cursor: the `next_cursor` value of the previous page''s response. Omit it for the first page.'
            title: Cursor
            type: string
          description: 'Pagination cursor: the `next_cursor` value of the previous page''s response. Omit it for the first page.'
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: How many runs to return per page.
            default: 30
            title: Page Size
          description: How many runs to return per page.
        - name: version_id
          in: query
          required: false
          schema:
            description: Only return runs of this template version id.
            title: Version Id
            type: string
          description: Only return runs of this template version id.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateRunListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - flows
        - templates
        - runs
      x-fern-sdk-method-name: list
    post:
      tags:
        - Flows
        - Templates
      summary: Create Template Run
      description: 'Start a run of a flows template. Pass `version_id` to pin a snapshot, or omit it / pass `latest` to run the latest published version. Set input values under `inputs`, keyed by input port id. The response is the run in its initial state, with every output already listed under its port id in `outputs`. Include `webhook` to receive a `flows_template_run` event carrying the finished run once its `status` is `completed` or `failed`; this is the recommended way to wait. Without one, fetch `GET /v1/flows/templates/{template_id}/runs/{run_id}` at a modest interval until the `status` is terminal.'
      operationId: create_public_template_run
      parameters:
        - name: template_id
          in: path
          required: true
          schema:
            type: string
            description: 'The ID of the template, as shown in the ElevenLabs app or by `GET /v1/flows/templates`.'
            title: Template Id
          description: 'The ID of the template, as shown in the ElevenLabs app or by `GET /v1/flows/templates`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRunCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - flows
        - templates
        - runs
      x-fern-sdk-method-name: create
  '/v1/flows/templates/{template_id}/runs/{run_id}':
    get:
      tags:
        - Flows
        - Templates
      summary: Get Template Run
      description: 'Retrieve a template run: its `status`, rolled up from its outputs, and each output''s own status and download URL once completed.'
      operationId: get_public_template_run
      parameters:
        - name: template_id
          in: path
          required: true
          schema:
            type: string
            description: 'The ID of the template, as shown in the ElevenLabs app or by `GET /v1/flows/templates`.'
            title: Template Id
          description: 'The ID of the template, as shown in the ElevenLabs app or by `GET /v1/flows/templates`.'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - flows
        - templates
        - runs
      x-fern-sdk-method-name: get
  /v1/flows/templates:
    get:
      tags:
        - Flows
        - Templates
      summary: List Templates
      description: 'List the published flows templates in your workspace, together with each runnable version''s inputs and outputs. Use the ids here as `template_id` / `version_id` on `POST /v1/flows/templates/{template_id}/runs`. Versions built on models that are not available to you through the API are left out, so `versions` is empty when none of a template''s published versions is runnable through this API. Templates shared with you by link, or published to Explore from another workspace, are not listed but can still be fetched and run by `template_id`.'
      operationId: list_public_templates
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            description: 'Pagination cursor: the `next_cursor` value of the previous page''s response. Omit it for the first page.'
            title: Cursor
            type: string
          description: 'Pagination cursor: the `next_cursor` value of the previous page''s response. Omit it for the first page.'
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 25
            minimum: 1
            description: How many templates to return per page. Lower than the run list's ceiling because each row expands its versions' input and output schemas.
            default: 10
            title: Page Size
          description: How many templates to return per page. Lower than the run list's ceiling because each row expands its versions' input and output schemas.
        - name: versions_per_template
          in: query
          required: false
          schema:
            type: integer
            maximum: 10
            minimum: 1
            description: 'How many of each template''s published versions to return, newest first. `has_more_versions` tells you when a template has more.'
            default: 3
            title: Versions Per Template
          description: 'How many of each template''s published versions to return, newest first. `has_more_versions` tells you when a template has more.'
        - name: search
          in: query
          required: false
          schema:
            description: Only return templates whose name or description contains this text.
            title: Search
            type: string
            maxLength: 100
          description: Only return templates whose name or description contains this text.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - flows
        - templates
      x-fern-sdk-method-name: list
  '/v1/flows/templates/{template_id}':
    get:
      tags:
        - Flows
        - Templates
      summary: Get Template
      description: 'Retrieve one flows template, together with each runnable version''s inputs and outputs. `versions` is empty when no published version is runnable through this API. Works for any template you can open, including templates shared with you by link or published to Explore from another workspace, which `GET /v1/flows/templates` does not list.'
      operationId: get_public_template
      parameters:
        - name: template_id
          in: path
          required: true
          schema:
            type: string
            description: 'The ID of the template, as shown in the ElevenLabs app or by `GET /v1/flows/templates`.'
            title: Template Id
          description: 'The ID of the template, as shown in the ElevenLabs app or by `GET /v1/flows/templates`.'
        - name: versions_per_template
          in: query
          required: false
          schema:
            type: integer
            maximum: 10
            minimum: 1
            description: 'How many of each template''s published versions to return, newest first. `has_more_versions` tells you when a template has more.'
            default: 10
            title: Versions Per Template
          description: 'How many of each template''s published versions to return, newest first. `has_more_versions` tells you when a template has more.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - flows
        - templates
      x-fern-sdk-method-name: get
  /v1/assets:
    get:
      tags:
        - Assets
      summary: List Assets
      description: 'List assets in the workspace, most recently created first.'
      operationId: list_assets
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Number of assets to return.
            default: 30
            title: Page Size
          description: Number of assets to return.
        - name: cursor
          in: query
          required: false
          schema:
            description: Token from a previous response's `next_cursor`. Omit to fetch the first page.
            title: Cursor
            type: string
          description: Token from a previous response's `next_cursor`. Omit to fetch the first page.
        - name: search
          in: query
          required: false
          schema:
            description: Optional free-text search filter over asset names.
            title: Search
            type: string
          description: Optional free-text search filter over asset names.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - assets
      x-fern-sdk-method-name: list
    post:
      tags:
        - Assets
      summary: Upload Asset
      description: Upload a new asset.
      operationId: upload_asset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Upload_asset_v1_assets_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - assets
      x-fern-sdk-method-name: create
  '/v1/assets/{asset_id}':
    get:
      tags:
        - Assets
      summary: Get Asset
      description: Retrieve a single asset by ID.
      operationId: get_asset
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            description: ID of the asset.
            examples:
              - 5xM2KqOnZyce22SPZ9d4
            title: Asset Id
          description: ID of the asset.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - assets
      x-fern-sdk-method-name: get
    delete:
      tags:
        - Assets
      summary: Delete Asset
