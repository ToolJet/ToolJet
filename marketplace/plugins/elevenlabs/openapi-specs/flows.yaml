          title: Images
          description: 'Up to 3 reference images to draw subjects or style from. Cannot be combined with `start_frame`/`end_frame`, and requires the 8-second duration.'
        model_id:
          type: string
          const: veo-3.1-generate-001
          title: Model Id
          description: The model to use for the generation.
      additionalProperties: false
      type: object
      required:
        - prompt
        - model_id
      title: Veo3_1Request
      description: Request body for the Google Veo 3.1 video model.
    CreatifyAuroraRequest:
      properties:
        webhook:
          description: Include to send the generation's result to the workspace's configured flows webhooks once it completes or fails. The webhook payload matches the terminal response of the corresponding GET endpoint.
          examples:
            - type: all
            - ids:
                - Q8mVr2LpXcT4nB6yJdKw
              type: ids
          $ref: '#/components/schemas/WebhookTarget'
        model_id:
          type: string
          const: creatify-aurora
          title: Model Id
          description: The model to use for the generation.
        image:
          $ref: '#/components/schemas/ImageReference'
          description: The image of the character to animate.
        audio:
          $ref: '#/components/schemas/AudioReference'
          description: The speech audio to drive the character's lip movements.
        resolution:
          type: string
          enum:
            - 480p
            - 720p
          title: Resolution
          description: The resolution of the output video.
          default: 720p
        guidance_scale:
          title: Guidance Scale
          description: How strongly the generation adheres to the input image. Omit to use the model's default.
          type: number
          maximum: 5
          minimum: 0
        audio_guidance_scale:
          title: Audio Guidance Scale
          description: How strongly the lip movements adhere to the audio. Omit to use the model's default.
          type: number
          maximum: 5
          minimum: 0
      additionalProperties: false
      type: object
      required:
        - model_id
        - image
        - audio
      title: CreatifyAuroraRequest
      description: Request body for the Creatify Aurora lipsync video model.
    MediaGenerationListResponse:
      properties:
        generations:
          items:
            $ref: '#/components/schemas/MediaGenerationResponse'
          type: array
          title: Generations
          description: 'The generations on this page, newest first. Each item has the same shape as the corresponding GET endpoint''s response.'
        next_cursor:
          title: Next Cursor
          description: Pass as `cursor` to fetch the next page. `null` when there is no further page.
          type: string
        has_more:
          type: boolean
          title: Has More
          description: Whether more generations exist beyond this page.
          readOnly: true
      type: object
      required:
        - generations
        - next_cursor
        - has_more
      title: MediaGenerationListResponse
      description: 'One page of the caller''s generations, newest first.'
      example:
        generations:
          - content_mime_type: video/mp4
            content_url: 'https://storage.googleapis.com/generations/JWr5N6X9ZTqf8jD2LmQb'
            id: JWr5N6X9ZTqf8jD2LmQb
            status: completed
          - id: Kx2mP7Y4WVrg9kE3NnRc
            status: generating
        has_more: true
        next_cursor: MjAyNi0wNy0xN1QxMjowMDowMHxLeDJtUDdZNFdWcmc5a0UzTm5SYw
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    UsageCharactersResponseModel:
      properties:
        time:
          items:
            type: integer
          type: array
          title: Time
          description: The time axis with unix timestamps for each day.
        usage:
          additionalProperties:
            items:
              type: number
            type: array
          type: object
          title: Usage
          description: The usage of each breakdown type along the time axis.
      type: object
      required:
        - time
        - usage
      title: UsageCharactersResponseModel
      example:
        time:
          - 1738252091000
          - 1739404800000
        usage:
          All:
            - 49
            - 1053
    MetricType:
      type: string
      enum:
        - credits
        - tts_characters
        - minutes_used
        - request_count
        - ttfb_avg
        - ttfb_p95
        - fiat_units_spent
        - concurrency
        - concurrency_average
      title: MetricType
    UsageAggregationInterval:
      type: string
      enum:
        - hour
        - day
        - week
        - month
        - cumulative
      title: UsageAggregationInterval
      description: The time interval over which to aggregate the usage data.
    BreakdownTypes:
      type: string
      enum:
        - none
        - voice
        - voice_multiplier
        - user
        - groups
        - api_keys
        - all_api_keys
        - product_type
        - model
        - resource
        - request_queue
        - region
        - subresource_id
        - reporting_workspace_id
        - has_api_key
        - request_source
      title: BreakdownTypes
      description: How to break down the information. Cannot be "user" or "api_key" if include_workspace_metrics is False.
tags:
  - name: text-to-speech
    description: Convert text into lifelike speech using a voice of your choice.
  - name: speech-to-speech
    description: Create speech by combining the style and content of an audio file you upload with a voice of your choice.
  - name: speech-to-text
    description: Transcribe your audio files with detailed speaker annotations and precise timestamps using our cutting-edge model.
  - name: forced-alignment
    description: Force align an audio file to a text transcript to get precise word-level and character level timing information. Response is a list of characters with their start and end times as milliseconds elapsed from the start of the recording.
  - name: models
    description: Access the different models of the platform.
  - name: productions
    description: Access and manage ElevenProductions orders.
  - name: voices
    description: Access to voices created either by you or ElevenLabs.
  - name: samples
    description: Access to your samples. A sample is any audio file you attached to a voice. A voice can have one or more samples.
  - name: speech-history
    description: Accesses your speech history. Your speech history is a list of all your created audio including its metadata using our text-to-speech and speech-to-speech models.
  - name: studios
    description: 'Access, create and convert Studio Projects programmatically, only specifically whitelisted accounts can access the Studio API. If you need access please contact our sales team.'
  - name: workspace
    description: Access to workspace related endpoints.
  - name: text-to-voice
    description: Design and generate custom voices from a text prompt.
  - name: text-to-dialogue
    description: Generate multi-speaker dialogue from a script using different voices.
  - name: sound-generation
    description: Generate sound effects and non-speech audio from a text prompt.
  - name: audio-isolation
    description: Isolate speech from background noise in an audio file.
  - name: audio-native
    description: Embed AI-narrated audio players into your website using Audio Native.
  - name: music-generation
    description: Generate music from a text prompt.
  - name: music-finetunes
    description: Create and manage music finetunes.
  - name: video-to-music
