          description: A text description of the video to generate.
          examples:
            - 'A corgi rides a tiny surfboard across a sunlit wave at golden hour, cinematic'
        aspect_ratio:
          type: string
          enum:
            - auto
            - '21:9'
            - '16:9'
            - '4:3'
            - '1:1'
            - '3:4'
            - '9:16'
          title: Aspect Ratio
          description: 'The aspect ratio of the output video. With `auto`, the model picks an aspect ratio based on the inputs. First-frame / first-and-last-frame tasks always use `auto`.'
          default: '16:9'
        resolution:
          type: string
          enum:
            - 480p
            - 720p
            - 1080p
          title: Resolution
          description: The resolution of the output video.
          default: 720p
        duration_secs:
          type: integer
          maximum: 30
          minimum: 4
          title: Duration Secs
          description: The duration of the output video in seconds.
          default: 5
