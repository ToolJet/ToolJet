        propertyName: type
        mapping:
          asset: '#/components/schemas/StaticAssetReference'
          generation: '#/components/schemas/GenerationReference'
          inline_base64: '#/components/schemas/InlineAudioReference'
    InlineAudioReference:
      properties:
        type:
          type: string
          const: inline_base64
          title: Type
        content_base64:
          type: string
          maxLength: 34952536
          title: Content Base64
          description: 'The media file''s bytes, base64-encoded (standard alphabet). Up to 25MB decoded.'
          examples:
            - iVBORw0KGgoAAAANSUhEUgAA...
        mime_type:
          type: string
          enum:
            - audio/mpeg
            - audio/wav
          title: Mime Type
          description: The MIME type of the encoded audio.
      additionalProperties: false
      type: object
      required:
        - type
        - content_base64
        - mime_type
      title: InlineAudioReference
      description: |-
        Audio passed inline as base64. The audio is stored as an ephemeral
        asset with no guaranteed retention: it may be deleted at any time after
        the generation completes. To keep an input and reuse it across
        generations, upload it via the assets API (`POST /v1/assets`) and pass
        an `asset` reference instead.
