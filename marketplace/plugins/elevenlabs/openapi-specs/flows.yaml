openapi: 3.1.0
info:
  title: ElevenLabs API Documentation
  description: 'This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically, this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.'
  version: '1.0'
paths:
  /v1/usage/character-stats:
    get:
      summary: Get Characters Usage Metrics (Deprecated)
      description: '(Deprecated) This endpoint is deprecated. Use /v1/workspace/analytics/query/usage-by-product-over-time instead, which exposes the bucket size as `interval_seconds` (an integer in seconds) rather than `aggregation_interval`. Returns the usage metrics for the current user or the entire workspace they are part of. The response provides a time axis based on the specified aggregation interval (default: day), with usage values for each interval along that axis. Usage is broken down by the selected breakdown type. For example, breakdown type "voice" will return the usage of each voice for each interval along the time axis.'
      operationId: usage_characters
      deprecated: true
      parameters:
        - name: start_unix
          in: query
          required: true
          schema:
            type: integer
            description: 'UTC Unix timestamp for the start of the usage window, in milliseconds. To include the first day of the window, the timestamp should be at 00:00:00 of that day.'
            examples:
              - '1685574000'
            title: Start Unix
          description: 'UTC Unix timestamp for the start of the usage window, in milliseconds. To include the first day of the window, the timestamp should be at 00:00:00 of that day.'
        - name: end_unix
          in: query
          required: true
          schema:
            type: integer
            description: 'UTC Unix timestamp for the end of the usage window, in milliseconds. To include the last day of the window, the timestamp should be at 23:59:59 of that day.'
            examples:
              - '1688165999'
            title: End Unix
          description: 'UTC Unix timestamp for the end of the usage window, in milliseconds. To include the last day of the window, the timestamp should be at 23:59:59 of that day.'
        - name: include_workspace_metrics
          in: query
          required: false
          schema:
            type: boolean
            description: Whether or not to include the statistics of the entire workspace.
            default: false
            title: Include Workspace Metrics
          description: Whether or not to include the statistics of the entire workspace.
        - name: breakdown_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BreakdownTypes'
            description: How to break down the information. Cannot be "user" if include_workspace_metrics is False.
            default: none
          description: How to break down the information. Cannot be "user" if include_workspace_metrics is False.
        - name: aggregation_interval
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UsageAggregationInterval'
            description: 'How to aggregate usage data over time. Can be "hour", "day", "week", "month", or "cumulative".'
            default: day
          description: 'How to aggregate usage data over time. Can be "hour", "day", "week", "month", or "cumulative".'
        - name: aggregation_bucket_size
          in: query
          required: false
          schema:
            description: Aggregation bucket size in seconds. Overrides the aggregation interval.
            title: Aggregation Bucket Size
            type: integer
          description: Aggregation bucket size in seconds. Overrides the aggregation interval.
        - name: metric
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MetricType'
            description: Which metric to aggregate.
            default: credits
          description: Which metric to aggregate.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageCharactersResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: usage
      x-fern-sdk-method-name: get
      tags:
        - other
  /v1/flows/video:
    get:
      tags:
        - Flows
        - Video
      summary: List Video Generations
      description: 'List the video generations created through this API, newest first.'
      operationId: list_video_generations
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            description: 'Pagination cursor: the `next_cursor` value of the previous page''s response. Omit it for the first page.'
            title: Cursor
            type: string
          description: 'Pagination cursor: the `next_cursor` value of the previous page''s response. Omit it for the first page.'
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: How many generations to return per page.
            default: 30
            title: Page Size
          description: How many generations to return per page.
        - name: status
          in: query
          required: false
          schema:
            description: Only return generations with this lifecycle status.
            title: Status
            enum:
              - pending
              - generating
              - completed
              - failed
            type: string
          description: Only return generations with this lifecycle status.
        - name: model_id
          in: query
          required: false
          schema:
            description: Only return generations of this model.
            title: Model Id
            type: string
          description: Only return generations of this model.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGenerationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - flows
        - video
      x-fern-sdk-method-name: list
    post:
      tags:
        - Flows
        - Video
      summary: Create Video Generation
      description: Start a video generation with the selected model.
      operationId: create_video_generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoGenerationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGenerationCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - flows
        - video
      x-fern-sdk-method-name: create
