      required:
        - id
        - status
        - failure_reason
        - error_message
      title: MediaGenerationFailedResponse
      description: A failed media generation and why it failed.
      example:
        error_message: Timed out while processing. You were not charged for this generation.
        failure_reason: timeout
        id: JWr5N6X9ZTqf8jD2LmQb
        status: failed
    MediaGenerationCompletedResponse:
      properties:
        id:
          type: string
          title: Id
          description: The unique identifier of the generation.
          examples:
            - JWr5N6X9ZTqf8jD2LmQb
        status:
          type: string
          const: completed
          title: Status
          description: The lifecycle status of the generation.
          examples:
            - completed
        content_url:
          type: string
          title: Content Url
          description: A signed URL to download the generated media from. It expires about an hour after this response is returned; fetch the generation again for a fresh URL.
          examples:
            - 'https://storage.googleapis.com/generations/JWr5N6X9ZTqf8jD2LmQb'
