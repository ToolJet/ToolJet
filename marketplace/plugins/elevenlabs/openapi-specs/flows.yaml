        status:
          type: string
          const: failed
          title: Status
          description: The lifecycle status of the generation.
          examples:
            - failed
        failure_reason:
          type: string
          enum:
            - timeout
            - model_error
            - moderated
            - invalid_parameters
            - dependency_failed
            - charging_failed
            - internal_error
          title: Failure Reason
          description: The category of failure.
          examples:
            - timeout
        error_message:
          type: string
          title: Error Message
          description: A human-readable description of the failure. Failed generations are not charged.
          examples:
            - Timed out while processing. You were not charged for this generation.
