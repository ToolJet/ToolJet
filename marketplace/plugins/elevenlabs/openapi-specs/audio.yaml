      description: 'Transcribe an audio or video file. If webhook is set to true, the request will be processed asynchronously and results sent to configured webhooks. When use_multi_channel is true and the provided audio has multiple channels, a ''transcripts'' object with separate transcripts for each channel is returned; set multichannel_output_style=''combined'' to instead receive a single transcript with all channels merged and sorted by time. Otherwise, returns a single transcript. The optional webhook_metadata parameter allows you to attach custom data that will be included in webhook responses for request correlation and tracking.'
      operationId: speech_to_text
      parameters:
        - name: token
          in: query
          required: false
          schema:
            description: A single-use authentication token created via POST /v1/single-use-token/batch_scribe. This token can only be used once and expires after 15 minutes. Alternative to API key or bearer token authentication for frontend clients.
            title: Token
            type: string
          description: A single-use authentication token created via POST /v1/single-use-token/batch_scribe. This token can only be used once and expires after 15 minutes. Alternative to API key or bearer token authentication for frontend clients.
        - name: enable_logging
          in: query
          required: false
          schema:
            type: boolean
            title: Enable request logging.
            description: When enable_logging is set to false zero retention mode will be used for the request. This will mean log and transcript storage features are unavailable for this request. Zero retention mode may only be used by enterprise customers.
            default: true
          description: When enable_logging is set to false zero retention mode will be used for the request. This will mean log and transcript storage features are unavailable for this request. Zero retention mode may only be used by enterprise customers.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Speech_to_Text_v1_speech_to_text_post'
      responses:
        '200':
          description: Synchronous transcription result
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/SpeechToTextChunkResponseModel'
                  - $ref: '#/components/schemas/MultichannelSpeechToTextResponseModel'
                  - $ref: '#/components/schemas/SpeechToTextWebhookResponseModel'
                title: Response Speech To Text V1 Speech To Text Post
                oneOf:
                  - $ref: '#/components/schemas/SpeechToTextChunkResponseModel'
                  - $ref: '#/components/schemas/MultichannelSpeechToTextResponseModel'
              examples:
                single_channel:
                  summary: Single channel response
                  value:
                    language_code: en
                    language_probability: 0.98
                    text: Hello world!
                    words:
                      - text: Hello
                        start: 0
                        end: 0.5
                        type: word
                        speaker_id: speaker_1
                        logprob: -0.124
                multichannel:
                  summary: Multichannel response
                  value:
                    transcripts:
                      - language_code: en
                        language_probability: 0.98
                        text: Hello from channel one.
                        words:
                          - text: Hello
                            start: 0
                            end: 0.5
                            type: word
                            speaker_id: speaker_0
                            channel_index: 0
                            logprob: -0.124
                      - language_code: en
                        language_probability: 0.97
                        text: Greetings from channel two.
                        words:
                          - text: Greetings
                            start: 0.1
                            end: 0.7
                            type: word
                            speaker_id: speaker_1
                            channel_index: 1
                            logprob: -0.156
        '202':
          description: Asynchronous request accepted
          content:
            application/json:
              example:
                message: Request accepted. Transcription result will be sent to the webhook.
                request_id: abc123
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
