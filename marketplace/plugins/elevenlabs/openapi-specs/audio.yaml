          format: binary
        stem_variation_id:
          type: string
          enum:
            - two_stems_v1
            - six_stems_v1
          title: Stem Variation Id
          description: The id of the stem variation to use.
          default: six_stems_v1
        sign_with_c2pa:
          type: boolean
          title: Sign With C2Pa
          description: Whether to sign the generated song with C2PA. Applicable only for mp3 files.
          default: false
      type: object
      required:
        - file
      title: Body_Stem_separation_v1_music_stem_separation_post
    MusicUploadResponse:
      properties:
        song_id:
          type: string
          title: Song Id
          description: Unique identifier for the uploaded song
        composition_plan:
          anyOf:
            - $ref: '#/components/schemas/MusicPrompt'
            - $ref: '#/components/schemas/CompositionPlan'
          title: Composition Plan
          description: The composition plan extracted from the uploaded song. Only present if `extract_composition_plan` was provided in the request body.
        words_timestamps:
          title: Words Timestamps
          description: Word-level timestamps transcribed from the uploaded song. Only present if `with_timestamps` was True in the request body
          items:
            $ref: '#/components/schemas/WordTimestamp'
          type: array
        waveform_visual:
          title: Waveform Visual
          description: 'A low-resolution waveform of the uploaded song, for showing a preview of it. Holds 4 values per second of audio, from -1000 to 1000. Stereo is mixed down to a single channel. Only present if `with_waveform_visual` was True in the request body.'
          items:
            type: integer
          type: array
      type: object
      required:
        - song_id
      title: MusicUploadResponse
      description: Response model for music upload endpoint.
      example:
        song_id: jR4Xz8kL2mNpQ9wVtY1b
    WordTimestamp:
      properties:
        word:
          type: string
          title: Word
        start_ms:
          type: integer
          title: Start Ms
        end_ms:
          type: integer
          title: End Ms
      type: object
      required:
        - word
        - start_ms
        - end_ms
      title: WordTimestamp
    CompositionPlan:
      properties:
        chunks:
          items:
            oneOf:
              - $ref: '#/components/schemas/GenerationChunk-Input'
              - $ref: '#/components/schemas/AudioRefChunk'
          type: array
          maxItems: 30
          title: Chunks
          description: The chunks that make up the generation.
      type: object
      required:
        - chunks
      title: CompositionPlan
      description: Composition plan for the `music_v2` and `music_v2_5` models. Using this field with any other model will result in an error.
      example:
        chunks:
          - duration_ms: 15000
            positive_styles:
              - pop
              - warm synths
              - steady groove
              - layered harmonies
            text: |-
              [Verse]
              City lights are fading
              We keep moving through the night
          - duration_ms: 15000
            positive_styles:
              - uplifting
              - bigger drums
              - wide vocals
            text: |-
              [Chorus]
              Hold on to the feeling
              {very loud}Let it rise and come alive
          - duration_ms: 5000
            positive_styles:
              - gentle ending
              - soft pads
            text: '[Instrumental Outro]'
    AudioRefChunk:
      properties:
        song_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Song Id
          description: The ID of the song to source the chunk from. You can find the song ID in the response headers when you generate a song.
        range:
          $ref: '#/components/schemas/TimeRange'
          description: The time range to extract from the song.
      type: object
      required:
        - song_id
        - range
      title: AudioRefChunk
    TimeRange:
      properties:
        start_ms:
          type: integer
          title: Start Ms
        end_ms:
          type: integer
          title: End Ms
      type: object
      required:
        - start_ms
        - end_ms
      title: TimeRange
    GenerationChunk-Input:
      properties:
        text:
          type: string
          maxLength: 6132
          title: Text
          description: 'The text config to be generated for this chunk. Can contain an optional section name in square brackets at the beginning, e.g. [Verse 1], lyrics lines, and inline directions in curly braces, e.g. {scratching}. Section names must be between 1 and 100 characters. At most 30 lines are allowed, each at most 200 characters.'
        duration_ms:
          type: integer
          maximum: 120000
          minimum: 3000
          title: Duration Ms
          description: The duration of the chunk in milliseconds. Must be between 3000ms and 120000ms.
        positive_styles:
          items:
            type: string
          type: array
          maxItems: 50
          title: Positive Styles
          description: 'The styles and musical directions that should be present in this chunk. Use English language for best results. The styles for the first chunk are the most important as they set the overall tone and genre. Styles for subsequent chunks can be used to add nuance, progression, emphasis, or change the direction of the song. Aim to have at least 6-7 styles in early chunks until the direction is established. Generic styles like ''great production quality'' are good default styles to append to the list.'
        negative_styles:
          items:
            type: string
          type: array
          maxItems: 50
          title: Negative Styles
          description: 'The styles and musical directions that should not be present in this chunk. Use English language for best results. Leaving empty is a good default, only use this field if you want to explicitly avoid a particular style or direction.'
        context_adherence:
          type: string
          enum:
            - low
            - medium
            - high
          title: Context Adherence
          description: How much the model adheres to the context of its surrounding chunks. Low adherence means the model can deviate from the context and be more creative. High adherence means the model will be more consistent with the context.
          default: high
        conditioning_ref:
          description: 'The audio reference to condition the generation on. The first chunk is the most important as it will influence the generation of all subsequent chunks. Thus, if you want to apply conditioning to the entire song, start conditioning from the first chunk.'
          $ref: '#/components/schemas/AudioRefChunk'
        condition_strength:
          description: How strongly the model adheres to the conditioning reference. Low strength means the model will be more creative and deviate from the reference. High strength means the model will be more consistent with the reference.
          $ref: '#/components/schemas/ConditionStrength'
      type: object
      required:
        - text
        - duration_ms
        - positive_styles
      title: GenerationChunk
    ConditionStrength:
      type: string
      enum:
        - low
        - medium
        - high
        - xhigh
      title: ConditionStrength
    MusicPrompt:
      properties:
        positive_global_styles:
          items:
            type: string
          type: array
          maxItems: 50
          title: Positive Global Styles
          description: The styles and musical directions that should be present in the entire song. Use English language for best result.
        negative_global_styles:
          items:
            type: string
          type: array
          maxItems: 50
          title: Negative Global Styles
          description: The styles and musical directions that should not be present in the entire song. Use English language for best result.
        sections:
          items:
            $ref: '#/components/schemas/SongSection'
          type: array
          maxItems: 30
          title: Sections
          description: The sections of the song.
      type: object
      required:
        - positive_global_styles
        - negative_global_styles
        - sections
      title: MusicPrompt
      description: Composition plan for the `music_v1` model. Using this field with any other model will result in an error.
      example:
        negative_global_styles:
          - metal
          - hip-hop
          - country
        positive_global_styles:
          - pop
          - rock
          - jazz
        sections:
          - duration_ms: 10000
            lines:
              - Verse 1 lyrics
            negative_local_styles:
              - metal
              - hip-hop
              - country
            positive_local_styles:
              - pop
              - rock
              - jazz
            section_name: Verse 1
    SongSection:
      properties:
        section_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Section Name
          description: The name of the section. Must be between 1 and 100 characters.
        positive_local_styles:
          items:
            type: string
          type: array
          maxItems: 50
          title: Positive Local Styles
          description: The styles and musical directions that should be present in this section. Use English language for best result.
        negative_local_styles:
          items:
            type: string
          type: array
          maxItems: 50
          title: Negative Local Styles
          description: The styles and musical directions that should not be present in this section. Use English language for best result.
        duration_ms:
          type: integer
          maximum: 120000
          minimum: 3000
          title: Duration Ms
          description: The duration of the section in milliseconds. Must be between 3000ms and 120000ms.
        lines:
          items:
            type: string
            maxLength: 200
          type: array
          maxItems: 30
          title: Lines
          description: The lyrics of the section. Max 30 lines per section and max 200 characters per line.
        source_from:
          description: Optional source to extract the section from. Used for inpainting.
          $ref: '#/components/schemas/SectionSource'
      type: object
      required:
        - section_name
        - positive_local_styles
        - negative_local_styles
        - duration_ms
        - lines
      title: SongSection
    SectionSource:
      properties:
        song_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Song Id
          description: The ID of the song to source the section from. You can find the song ID in the response headers when you generate a song.
        range:
          $ref: '#/components/schemas/TimeRange'
          description: The range to extract from the source song.
        negative_ranges:
          items:
            $ref: '#/components/schemas/TimeRange'
          type: array
          maxItems: 10
          title: Negative Ranges
          description: The ranges to exclude from the 'range'.
      type: object
      required:
        - song_id
        - range
      title: SectionSource
    Body_Upload_music_v1_music_upload_post:
      properties:
        file:
          type: string
          title: File
          description: The audio file to upload.
          format: binary
        extract_composition_plan:
          anyOf:
            - type: boolean
            - $ref: '#/components/schemas/MusicModelID'
          title: Extract Composition Plan
          description: 'Whether to generate and return the composition plan for the uploaded song. Pass a model id (`music_v1`, `music_v2` or `music_v2_5`) to control which composition plan format is returned. Passing `true`/`false` is deprecated; `true` defaults to the `music_v1` plan format. Enabling this will increase the latency.'
          default: false
        with_timestamps:
          type: boolean
          title: With Timestamps
          description: 'Whether to transcribe the uploaded song and return word-level timestamps. If True, the response will include words_timestamps but will increase the latency.'
          default: false
