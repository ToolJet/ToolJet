          description: The detected language code (e.g. 'eng' for English).
        language_probability:
          type: number
          title: Language Probability
          description: The confidence score of the language detection (0 to 1).
        text:
          type: string
          title: Text
          description: The raw text of the transcription.
        words:
          items:
            $ref: '#/components/schemas/SpeechToTextWordResponseModel'
          type: array
          title: Words
          description: List of words with their timing information.
        channel_index:
          title: Channel Index
          description: The channel index this transcript belongs to (for multichannel audio).
          type: integer
        additional_formats:
          title: Additional Formats
          description: Requested additional formats of the transcript.
          items:
            $ref: '#/components/schemas/AdditionalFormatResponseModel'
          type: array
        transcription_id:
          title: Transcription Id
          description: The transcription ID of the response.
          type: string
        entities:
          title: Entities
          description: 'List of detected entities with their text, type, and character positions in the transcript.'
          items:
            $ref: '#/components/schemas/DetectedEntity'
          type: array
        audio_duration_secs:
          title: Audio Duration Secs
          description: The duration of the audio that was transcribed in seconds.
          type: number
        edited_transcript:
          title: Edited Transcript
          description: 'Result of the optional transcript edit: the edited text, or an error if it could not be produced. Absent when no edit was requested.'
          oneOf:
            - $ref: '#/components/schemas/EditedTranscript'
            - $ref: '#/components/schemas/TranscriptEditError'
          discriminator:
            propertyName: kind
