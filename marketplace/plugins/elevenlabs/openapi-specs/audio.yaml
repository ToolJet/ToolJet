          type: string
          title: Primary Genre
          description: Primary musical genre of the finetune.
        files:
          items:
            type: string
            format: binary
          type: array
          maxItems: 50
          title: Files
          description: Audio files to train on.
          default: []
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Tags to associate with the finetune.
          default: []
        visibility:
          title: Visibility
