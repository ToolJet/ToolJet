    FinetuneVisibility:
      type: string
      enum:
        - private
        - workspace
        - public
      title: FinetuneVisibility
    Body_Create_Music_Finetune_v1_music_finetunes_post:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 5
          title: Name
