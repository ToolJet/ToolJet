          type: array
          title: Inputs
          description: 'A list of dialogue inputs, each containing text and a voice ID which will be converted into speech. The maximum number of unique voice IDs is 10. For reliable generation, keep the total character count across all `inputs[].text` values at or below 2,000 characters per request. Longer requests can terminate early in streaming responses or return a validation error.'
          examples:
            - - text: 'Hello, how are you?'
                voice_id: bYTqZQo3Jz7LQtmGTgwi
              - text: 'I''m doing well, thank you!'
                voice_id: 6lCwbsX1yVjD49QmpkTR
        model_id:
          type: string
          title: Model Id
          description: 'Identifier of the model that will be used, you can query them using GET /v1/models. The model needs to have support for text to speech, you can check this using the can_do_text_to_speech property.'
          default: eleven_v3
        language_code:
          title: Language Code
          description: 'Language code (ISO 639-1) used to enforce a language for the model and text normalization. If the model does not support the provided language code, it will be ignored. This parameter is not supported for multilingual_v2 models.'
          examples:
            - en
          type: string
        settings:
          description: Settings controlling the dialogue generation.
          examples:
            - stability: 0.5
          $ref: '#/components/schemas/ToDialogueSettingsResponseModel'
        pronunciation_dictionary_locators:
          title: Pronunciation Dictionary Locators
          description: 'A list of pronunciation dictionary locators (id, version_id) to be applied to the text. They will be applied in order. You may have up to 3 locators per request'
          examples:
            - - pronunciation_dictionary_id: test
                version_id: id2
          items:
            $ref: '#/components/schemas/PronunciationDictionaryVersionLocatorRequestModel'
          type: array
        seed:
          title: Seed
          description: 'If specified, our system will make a best effort to sample deterministically, such that repeated requests with the same seed and parameters should return the same result. Determinism is not guaranteed. Must be integer between 0 and 4294967295.'
          examples:
            - 12345
          type: integer
        apply_text_normalization:
          type: string
          enum:
            - auto
            - 'on'
            - 'off'
          title: Apply Text Normalization
          description: 'This parameter controls text normalization with three modes: ''auto'', ''on'', and ''off''. When set to ''auto'', the system will automatically decide whether to apply text normalization (e.g., spelling out numbers). With ''on'', text normalization will always be applied, while with ''off'', it will be skipped.'
          default: auto
          examples:
            - true
        use_pvc_as_ivc:
          type: boolean
          title: Use Pvc As Ivc
          description: Whether to use the IVC version of a professional voice. This may improve expressiveness and reduce latency.
          default: false
          examples:
            - true
        previous_request_ids:
          title: Previous Request Ids
          description: A list of request_ids of dialogue generations that came before this one. Used to condition the model for continuity when splitting a large task into multiple requests. A maximum of 3 request_ids can be sent. The last request_id is the audio which is closest to the current request. Not supported by every model.
          items:
            type: string
          type: array
        next_request_ids:
          title: Next Request Ids
          description: A list of request_ids of dialogue generations that come after this one. Useful for maintaining continuity when regenerating a clip in the middle of a sequence. A maximum of 3 request_ids can be sent. The first request_id is the audio which is closest to the current request. Not supported by every model.
          items:
            type: string
          type: array
        previous_text:
          title: Previous Text
          description: 'The text that comes immediately before this generation, used to condition the model for prosodic continuity. A maximum of 100 characters can be sent. Not supported by every model.'
          type: string
          maxLength: 100
        future_text:
          title: Future Text
          description: 'The text that comes immediately after this generation, used to condition the model for prosodic continuity. A maximum of 100 characters can be sent. Not supported by every model.'
          type: string
          maxLength: 100
      type: object
      required:
