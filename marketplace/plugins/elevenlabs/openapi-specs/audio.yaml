openapi: 3.1.0
info:
  title: ElevenLabs API Documentation
  description: 'This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically, this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.'
  version: '1.0'
paths:
  /v1/sound-generation:
    post:
      tags:
        - sound-generation
      summary: Sound Generation
      description: 'Turn text into sound effects for your videos, voice-overs or video games using the most advanced sound effects models in the world.'
      operationId: sound_generation
      parameters:
        - name: output_format
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AllowedOutputFormats'
            title: Output format of the generated audio.
            description: 'Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.'
            enum:
              - mp3_22050_32
              - mp3_24000_48
              - mp3_44100_32
              - mp3_44100_64
              - mp3_44100_96
              - mp3_44100_128
              - mp3_44100_192
              - pcm_8000
              - pcm_16000
              - pcm_22050
              - pcm_24000
              - pcm_32000
              - pcm_44100
              - pcm_48000
              - ulaw_8000
              - alaw_8000
              - opus_48000_32
              - opus_48000_64
              - opus_48000_96
              - opus_48000_128
              - opus_48000_192
            default: mp3_44100_128
          description: 'Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Sound_Generation_v1_sound_generation_post'
      responses:
        '200':
          description: The generated sound effect as an MP3 file
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
          headers:
            character-cost:
              description: The number of characters used for billing
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: text_to_sound_effects
      x-fern-sdk-method-name: convert
  /v1/audio-isolation:
    post:
      tags:
        - audio-isolation
      summary: Audio Isolation
      description: Removes background noise from audio
      operationId: audio_isolation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Audio_Isolation_v1_audio_isolation_post'
      responses:
        '200':
          description: Successful Response
          content:
            audio/mpeg: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: audio_isolation
      x-fern-sdk-method-name: convert
  /v1/audio-isolation/history:
    get:
      tags:
        - audio-isolation
      summary: Get Audio Isolation History
      description: Returns a list of all your audio isolation generations.
      operationId: get_audio_isolation_history
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 1000
            minimum: 1
            description: How many history items to return at maximum. Defaults to 100.
            default: 100
            title: Page Size
          description: How many history items to return at maximum. Defaults to 100.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: Page number for search pagination (1-based). Only used when search is provided.
            default: 1
            title: Page
          description: Page number for search pagination (1-based). Only used when search is provided.
        - name: search
          in: query
          required: false
          schema:
            description: Optional search term used for filtering audio isolation history (title/text).
            examples:
              - podcast
              - lecture
            title: Search
            type: string
          description: Optional search term used for filtering audio isolation history (title/text).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAudioIsolationHistoryResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: audio_isolation
      x-fern-sdk-method-name: list
  '/v1/audio-isolation/history/{history_item_id}':
    delete:
      tags:
        - audio-isolation
      summary: Delete Audio Isolation History Item
      description: Deletes a specific audio isolation history item and the associated media files.
      operationId: delete_audio_isolation_history_item
      parameters:
        - name: history_item_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the audio isolation history item.
            title: History Item Id
          description: Identifier of the audio isolation history item.
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: audio_isolation
      x-fern-sdk-method-name: delete
  /v1/audio-isolation/stream:
    post:
      tags:
        - audio-isolation
      summary: Audio Isolation Stream
      description: Removes background noise from audio and streams the result
      operationId: audio_isolation_stream
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Audio_Isolation_Stream_v1_audio_isolation_stream_post'
      responses:
        '200':
          description: Successful Response
          content:
            audio/mpeg: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: audio_isolation
      x-fern-sdk-method-name: stream
      x-fern-streaming: true
  '/v1/text-to-speech/{voice_id}':
    post:
      tags:
        - text-to-speech
      summary: Text To Speech
      description: Converts text into speech using a voice of your choice and returns audio.
      operationId: text_to_speech_full
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
            description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
            examples:
              - 21m00Tcm4TlvDq8ikWAM
            title: Voice Id
          description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
        - name: enable_logging
          in: query
          required: false
          schema:
            type: boolean
            title: Enable request logging.
            description: 'When enable_logging is set to false zero retention mode will be used for the request. This will mean history features are unavailable for this request, including request stitching. Zero retention mode may only be used by enterprise customers.'
            default: true
          description: 'When enable_logging is set to false zero retention mode will be used for the request. This will mean history features are unavailable for this request, including request stitching. Zero retention mode may only be used by enterprise customers.'
        - name: optimize_streaming_latency
          in: query
          required: false
          schema:
            title: DEPRECATED. How much we should optimize streaming request latency (time to first audio byte).
            description: |
              You can turn on latency optimizations at some cost of quality. The best possible final latency varies by model. Possible values:
              0 - default mode (no latency optimizations)
              1 - normal latency optimizations (about 50% of possible latency improvement of option 3)
              2 - strong latency optimizations (about 75% of possible latency improvement of option 3)
              3 - max latency optimizations
              4 - max latency optimizations, but also with text normalizer turned off for even more latency savings (best latency, but can mispronounce eg numbers and dates).

              Defaults to None.
            deprecated: true
            type: integer
          description: |
            You can turn on latency optimizations at some cost of quality. The best possible final latency varies by model. Possible values:
            0 - default mode (no latency optimizations)
            1 - normal latency optimizations (about 50% of possible latency improvement of option 3)
