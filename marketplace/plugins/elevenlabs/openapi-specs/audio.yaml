    MultichannelSpeechToTextResponseModel:
      properties:
        transcripts:
          items:
            $ref: '#/components/schemas/SpeechToTextChunkResponseModel'
          type: array
          title: Transcripts
          description: 'List of transcripts, one for each audio channel. Each transcript contains the text and word-level details for its respective channel.'
        transcription_id:
          title: Transcription Id
          description: The transcription ID of the response.
          type: string
        audio_duration_secs:
          title: Audio Duration Secs
          description: The duration of the audio that was transcribed across all channels in seconds.
          type: number
      type: object
      required:
        - transcripts
      title: MultichannelSpeechToTextResponseModel
      description: Response model for multichannel speech-to-text transcription.
      example:
        transcripts:
          - language_code: en
            language_probability: 0.98
            text: Hello from channel one.
            words:
              - end: 0.5
                logprob: -0.124
                speaker_id: speaker_0
                start: 0
                text: Hello
                type: word
              - end: 0.5
                logprob: 0
                speaker_id: speaker_0
                start: 0.5
                text: ' '
                type: spacing
              - end: 0.8
                logprob: -0.089
                speaker_id: speaker_0
                start: 0.5
                text: from
                type: word
          - language_code: en
            language_probability: 0.97
            text: Greetings from channel two.
            words:
              - end: 0.7
                logprob: -0.156
                speaker_id: speaker_1
                start: 0.1
                text: Greetings
                type: word
              - end: 0.7
                logprob: 0
                speaker_id: speaker_1
                start: 0.7
                text: ' '
                type: spacing
              - end: 1
                logprob: -0.078
                speaker_id: speaker_1
                start: 0.7
                text: from
                type: word
    SpeechToTextChunkResponseModel:
      properties:
        language_code:
          type: string
