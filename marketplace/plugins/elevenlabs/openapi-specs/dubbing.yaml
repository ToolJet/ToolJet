openapi: 3.1.0
info:
  title: ElevenLabs API Documentation
  description: 'This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically, this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.'
  version: '1.0'
paths:
  /v1/dubbing/project:
    get:
      tags:
        - Dubbing
      summary: List Dubbing Projects
      description: 'List the dubbing projects in your workspace that you can access, newest first, cursor-paginated. Listed projects carry no `language_ids`; fetch a project, or list its language targets, to see them.'
      operationId: dubbing_project_list
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            description: Pass the `next_cursor` from a previous response to fetch the page after it. Omit for the first page.
            title: Cursor
            type: string
          description: Pass the `next_cursor` from a previous response to fetch the page after it. Omit for the first page.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            description: 'Number of projects per page. Clamped to between 1 and 100 rather than rejected, so a larger value returns a full page.'
            default: 20
            title: Page Size
          description: 'Number of projects per page. Clamped to between 1 and 100 rather than rejected, so a larger value returns a full page.'
        - name: status
          in: query
          required: false
          schema:
            description: 'Filter to projects in this status: `queued`, `preparing`, `ready`, or `failed`. Omit to return every status.'
            title: Status
            type: string
          description: 'Filter to projects in this status: `queued`, `preparing`, `ready`, or `failed`. Omit to return every status.'
        - name: sort_direction
          in: query
          required: false
          schema:
            enum:
              - ASCENDING
              - DESCENDING
            type: string
            description: Sort by creation time; newest first by default.
            default: DESCENDING
            title: Sort Direction
          description: Sort by creation time; newest first by default.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingProjectListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - dubbing
        - project
      x-fern-sdk-method-name: list
      x-fern-examples:
        - query-parameters:
            page_size: 20
          response:
            body:
              projects:
                - project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
                  status: ready
                  reference: Q3 marketing video
                  source_language: en
                  model_id: dubbing_v2
                  media:
                    filename: promo.mp4
                    duration_s: 42.5
                    has_video: true
                    mime_type: video/mp4
                  language_ids:
                    - lang_1001kwkyxp0je6ktn4knsfrasx5s
                  webhook_ids: []
                  revision: 3
                  warnings:
                    - type: voices_not_permitted
                      speaker_ids:
                        - speaker_1
                      message: 'Voice cloning was not permitted for speaker speaker_1, so a replacement voice was used.'
                  created_at: '2026-07-03T10:15:30Z'
                  updated_at: '2026-07-03T10:17:12Z'
    post:
      tags:
        - Dubbing
      summary: Create Dubbing Project
      description: |-
        Create a dubbing project from an uploaded file (`file`) or a source URL (`source_url`).

        Returns as soon as the project record exists, before the source has been fetched: the project starts `queued` and reaches `ready` once its source has been transcribed. Add a language target to it for each language you want, or pass `target_language` to queue the first one here.

        Creating a project incurs a minimum charge of one language: you are charged for at least one language's dubbing when the project is created, before any output exists. This charge prepays the first language target — the first target you add, or the one queued via `target_language`, consumes it — and each additional language is charged separately.

        Preparation can take minutes on a long source, so we recommend passing `webhook_ids` to be notified when the project turns `ready` or `failed`, rather than polling for it.
      operationId: dubbing_project_create
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Create_Dubbing_Project_v1_dubbing_project_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - dubbing
        - project
      x-fern-sdk-method-name: create
      x-fern-examples:
        - request:
            source_url: 'https://example.com/promo.mp4'
            source_language: en
            reference: Q3 marketing video
          response:
            body:
              project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
              status: queued
              reference: Q3 marketing video
              source_language: en
              model_id: dubbing_v2
              language_ids: []
              webhook_ids: []
              revision: 0
              warnings: []
              created_at: '2026-07-03T10:15:30Z'
              updated_at: '2026-07-03T10:15:30Z'
  '/v1/dubbing/project/{project_id}':
    get:
      tags:
        - Dubbing
      summary: Get Dubbing Project
      description: 'Full project detail, including the IDs of every language target under it. To follow a project to `ready`, we recommend a `webhook_ids` subscription rather than polling this endpoint.'
      operationId: dubbing_project_get
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the dubbing project to fetch.
            title: Project Id
          description: Identifier of the dubbing project to fetch.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - dubbing
        - project
      x-fern-sdk-method-name: get
      x-fern-examples:
        - path-parameters:
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
          response:
            body:
              project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
              status: ready
              reference: Q3 marketing video
              source_language: en
              model_id: dubbing_v2
              media:
                filename: promo.mp4
                duration_s: 42.5
                has_video: true
                mime_type: video/mp4
              language_ids:
                - lang_1001kwkyxp0je6ktn4knsfrasx5s
              webhook_ids: []
              revision: 3
              warnings:
                - type: voices_not_permitted
                  speaker_ids:
                    - speaker_1
                  message: 'Voice cloning was not permitted for speaker speaker_1, so a replacement voice was used.'
              created_at: '2026-07-03T10:15:30Z'
              updated_at: '2026-07-03T10:17:12Z'
    delete:
      tags:
        - Dubbing
      summary: Delete Dubbing Project
      description: 'Delete a project, every language target under it, and their stored media and outputs. This cannot be undone, and a dub already running is still billed.'
      operationId: dubbing_project_delete
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the dubbing project to delete.
            title: Project Id
          description: Identifier of the dubbing project to delete.
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - dubbing
        - project
      x-fern-sdk-method-name: delete
      x-fern-examples:
        - path-parameters:
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
  '/v1/dubbing/project/{project_id}/language':
    get:
      tags:
        - Dubbing
      summary: List Dubbing Language Targets
      description: 'List a project''s language targets, cursor-paginated, each with signed output URLs once it has produced an output.'
      operationId: dubbing_language_list
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the parent dubbing project.
            title: Project Id
          description: Identifier of the parent dubbing project.
        - name: cursor
          in: query
          required: false
          schema:
            description: Pass the `next_cursor` from a previous response to fetch the page after it. Omit for the first page.
            title: Cursor
            type: string
          description: Pass the `next_cursor` from a previous response to fetch the page after it. Omit for the first page.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            description: 'Number of language targets per page. Clamped to between 1 and 100 rather than rejected, so a larger value returns a full page.'
            default: 20
            title: Page Size
          description: 'Number of language targets per page. Clamped to between 1 and 100 rather than rejected, so a larger value returns a full page.'
        - name: status
          in: query
          required: false
          schema:
            description: 'Filter to targets in this status: `queued`, `processing`, `completed`, `stale`, or `failed`. Omit to return every status.'
            title: Status
            type: string
          description: 'Filter to targets in this status: `queued`, `processing`, `completed`, `stale`, or `failed`. Omit to return every status.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingLanguageListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - dubbing
        - project
        - language
      x-fern-sdk-method-name: list
      x-fern-examples:
        - path-parameters:
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
          query-parameters:
            page_size: 20
          response:
            body:
              languages:
                - language_id: lang_1001kwkyxp0je6ktn4knsfrasx5s
                  project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
                  target_language: es
                  status: completed
                  model_id: dubbing_v2
                  outputs:
                    lossless_audio: 'https://storage.googleapis.com/eleven-dubbing/proj_1601kwkyxp0hfzvtmyxwqxx6mcy3/lang_1001kwkyxp0je6ktn4knsfrasx5s/output.flac?X-Goog-Signature=...'
                  revision: 3
                  output_revision: 3
                  warnings: []
                  created_at: '2026-07-03T10:16:00Z'
                  updated_at: '2026-07-03T10:20:45Z'
    post:
      tags:
        - Dubbing
      summary: Create Dubbing Language Target
      description: |-
        Add a language to dub a project into, and queue the dub.

        This is the call that produces dubbed audio, and it is billed per generation. The target is created `queued` and starts as soon as the project is `ready`, so it can be added at any point after the project is created. It inherits the project's dubbing model and cannot pick another.

        A project created with `webhook_ids` sends a `dubbing_language_completed` event carrying the output download URLs, so we recommend subscribing rather than polling this target to completion.
      operationId: dubbing_language_create
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the parent dubbing project.
            title: Project Id
          description: Identifier of the parent dubbing project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Create_Dubbing_Language_Target_v1_dubbing_project__project_id__language_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingLanguageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - dubbing
        - project
        - language
      x-fern-sdk-method-name: create
      x-fern-examples:
        - path-parameters:
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
          request:
            target_language: es
          response:
            body:
              language_id: lang_1001kwkyxp0je6ktn4knsfrasx5s
              project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
              target_language: es
              status: queued
              model_id: dubbing_v2
              revision: 0
              warnings: []
              created_at: '2026-07-03T10:16:00Z'
              updated_at: '2026-07-03T10:16:00Z'
  '/v1/dubbing/project/{project_id}/language/{language_id}':
    get:
      tags:
        - Dubbing
      summary: Get Dubbing Language Target
      description: 'Full language-target detail. Once the target reports `completed`, `outputs` carries the signed download URLs. To learn when that happens, we recommend the project''s `webhook_ids` subscription rather than polling this endpoint; fetch here when a delivered URL has expired, or to reconcile after an edit.'
      operationId: dubbing_language_get
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the parent dubbing project.
            title: Project Id
          description: Identifier of the parent dubbing project.
        - name: language_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the language target to fetch.
            title: Language Id
          description: Identifier of the language target to fetch.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingLanguageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - dubbing
        - project
        - language
      x-fern-sdk-method-name: get
      x-fern-examples:
        - path-parameters:
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
            language_id: lang_1001kwkyxp0je6ktn4knsfrasx5s
          response:
            body:
              language_id: lang_1001kwkyxp0je6ktn4knsfrasx5s
              project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
              target_language: es
              status: completed
              model_id: dubbing_v2
              outputs:
                lossless_audio: 'https://storage.googleapis.com/eleven-dubbing/proj_1601kwkyxp0hfzvtmyxwqxx6mcy3/lang_1001kwkyxp0je6ktn4knsfrasx5s/output.flac?X-Goog-Signature=...'
              revision: 3
              output_revision: 3
              warnings: []
              created_at: '2026-07-03T10:16:00Z'
              updated_at: '2026-07-03T10:20:45Z'
    delete:
      tags:
        - Dubbing
      summary: Delete Dubbing Language Target
      description: 'Delete a language target and its outputs, leaving the project and its other languages intact. This cannot be undone, and a dub already running is still billed.'
      operationId: dubbing_language_delete
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the parent dubbing project.
            title: Project Id
          description: Identifier of the parent dubbing project.
        - name: language_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the language target to delete.
            title: Language Id
          description: Identifier of the language target to delete.
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - dubbing
        - project
        - language
      x-fern-sdk-method-name: delete
      x-fern-examples:
        - path-parameters:
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
            language_id: lang_1001kwkyxp0je6ktn4knsfrasx5s
  '/v1/dubbing/project/{project_id}/transcript':
    get:
      tags:
        - Dubbing
      summary: Get Dubbing Transcript
      description: 'The project''s source transcript, as editable segments. Available once the project is `ready`.'
      operationId: dubbing_transcript_get
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the dubbing project.
            title: Project Id
          description: Identifier of the dubbing project.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingSourceTranscriptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - dubbing
        - project
        - transcript
      x-fern-sdk-method-name: get
      x-fern-examples:
        - path-parameters:
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
          response:
            body:
              language: en
              segments:
                - id: 0199a3f0-1c2d-7abc-8def-0123456789ab
                  text: Welcome to our product demo.
                  speaker_id: default_speaker
                  start_s: 0
                  end_s: 2.5
              revision: 3
  '/v1/dubbing/project/{project_id}/transcript/segment/{segment_id}':
    delete:
      tags:
        - Dubbing
      summary: Delete Dubbing Transcript Segment
      description: 'Enterprise only. Remove a source segment from the transcript so it is no longer dubbed. Bumps the project''s `revision`, discards the affected translations in every language target, and marks any target that had already completed `stale`. No audio changes until you regenerate a target.'
      operationId: dubbing_transcript_segment_delete
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the dubbing project.
            title: Project Id
          description: Identifier of the dubbing project.
        - name: segment_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the segment to remove.
            title: Segment Id
          description: Identifier of the segment to remove.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingTranscriptRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - dubbing
        - project
        - transcript
      x-fern-sdk-method-name: delete_segment
      x-fern-examples:
        - path-parameters:
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
            segment_id: 0199a3f0-1c2d-7abc-8def-0123456789ab
          response:
            body:
              revision: 6
    patch:
      tags:
        - Dubbing
      summary: Update Dubbing Transcript Segment
      description: 'Enterprise only. Edit a source segment''s text, speaker, or timing. Omitted fields are left unchanged. Bumps the project''s `revision`, discards the affected translations in every language target, and marks any target that had already completed `stale`. No audio changes until you regenerate a target.'
      operationId: dubbing_transcript_segment_update
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the dubbing project.
            title: Project Id
          description: Identifier of the dubbing project.
        - name: segment_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the segment to edit.
            title: Segment Id
          description: Identifier of the segment to edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DubbingSegmentUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingSourceSegmentUpdateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - dubbing
        - project
        - transcript
      x-fern-sdk-method-name: update_segment
      x-fern-examples:
        - path-parameters:
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
            segment_id: 0199a3f0-1c2d-7abc-8def-0123456789ab
          request:
            text: Welcome to our latest product demo.
          response:
            body:
              segment:
                id: 0199a3f0-1c2d-7abc-8def-0123456789ab
                text: Welcome to our latest product demo.
                speaker_id: default_speaker
                start_s: 0
                end_s: 2.5
              revision: 4
  '/v1/dubbing/project/{project_id}/transcript/segments':
    patch:
      tags:
        - Dubbing
      summary: Update Dubbing Transcript Segments
      description: 'Enterprise only. Edit several source segments'' text, speaker, or timing in one atomic request: every edit applies or none does. Bumps the project''s `revision`, discards the affected translations in every language target, and marks any target that had already completed `stale`. No audio changes until you regenerate a target.'
      operationId: dubbing_transcript_segments_update
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the dubbing project.
            title: Project Id
          description: Identifier of the dubbing project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DubbingBulkSegmentUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingBulkSourceSegmentUpdateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - dubbing
        - project
        - transcript
      x-fern-sdk-method-name: update_segments
      x-fern-examples:
        - path-parameters:
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
          request:
            segments:
              0199a3f0-1c2d-7abc-8def-0123456789ab:
                text: Welcome to our latest product demo.
              0199a3f0-3e4f-7abc-8def-0123456789cd:
                speaker_id: narrator
          response:
            body:
              segments:
                - id: 0199a3f0-1c2d-7abc-8def-0123456789ab
                  text: Welcome to our latest product demo.
                  speaker_id: default_speaker
                  start_s: 0
                  end_s: 2.5
                - id: 0199a3f0-3e4f-7abc-8def-0123456789cd
                  text: Let's get started.
                  speaker_id: narrator
                  start_s: 2.5
                  end_s: 4
              revision: 5
  '/v1/dubbing/project/{project_id}/transcript/segment':
    post:
      tags:
        - Dubbing
      summary: Add Dubbing Transcript Segment
      description: 'Enterprise only. Add a new source segment to the transcript. Its span must lie within the source media, last between 0.1 and 25 seconds, and not overlap another segment by the same speaker. Bumps the project''s `revision`, discards the affected translations in every language target, and marks any target that had already completed `stale`. No audio changes until you regenerate a target.'
      operationId: dubbing_transcript_segment_add
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            description: Identifier of the dubbing project.
            title: Project Id
          description: Identifier of the dubbing project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DubbingSegmentCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingSourceSegmentUpdateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - dubbing
        - project
        - transcript
      x-fern-sdk-method-name: create_segment
      x-fern-examples:
        - path-parameters:
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
          request:
            text: Thanks for watching.
            speaker_id: default_speaker
            start_s: 42
            end_s: 44
          response:
