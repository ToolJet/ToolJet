          type: string
          title: Message
          description: 'Human-readable description of the failure, for display. The wording may change at any time, so we recommend branching on `code` instead.'
        retryable:
          type: boolean
          title: Retryable
          description: 'Whether resubmitting the same input could succeed. A value of false means the failure describes the input or the account, so an identical retry will fail the same way.'
      type: object
      required:
        - code
        - message
        - retryable
      title: DubbingError
    DubbingLanguageOutputs:
      properties:
        lossless_audio:
          title: Lossless Audio
          description: 'Signed URL for the dubbed lossless audio track, in FLAC. The link expires one hour after it is issued; re-read the language target for a fresh one.'
          type: string
      type: object
      title: DubbingLanguageOutputs
      description: 'Signed, time-limited download URLs for a language target''s outputs.'
    VoiceSettings:
      properties:
        cloning_strength:
          type: integer
          maximum: 10
          minimum: 0
          title: Cloning Strength
          description: 'How strongly the dubbed speakers clone the source voices, 0 to 10.'
          default: 7
      type: object
      title: VoiceSettings
    Body_Create_Dubbing_Language_Target_v1_dubbing_project__project_id__language_post:
      properties:
        target_language:
          type: string
          title: Target Language
          description: 'BCP-47 language tag to dub the project into (for example, `fr` or `es-MX`). Must be one of the [languages the project''s dubbing model supports](https://elevenlabs.io/docs/help-center/product/dubbing/which-languages-are-supported-in-dubbing), and a region-qualified tag must be one of the supported dialects.'
        voice_settings:
          description: Voice settings applied to every speaker in this language. Omit to use the defaults.
          $ref: '#/components/schemas/VoiceSettings'
        translations:
          title: Translations
          description: 'Enterprise only. Optional translations to use instead of machine translation. A map from each source segment''s `external_id` (or its `id`, if you supplied none) to the translated text; every source segment must be covered exactly once. At most 20,000 entries, totaling at most 4 MiB of text. See [Bring your own transcript](https://elevenlabs.io/docs/eleven-api/guides/how-to/dubbing/bring-your-own-transcript).'
          additionalProperties:
            type: string
          type: object
          maxProperties: 20000
      type: object
      required:
        - target_language
      title: Body_Create_Dubbing_Language_Target_v1_dubbing_project__project_id__language_post
    DubbingLanguageListResponse:
      properties:
        languages:
          items:
            $ref: '#/components/schemas/DubbingLanguageResponse'
          type: array
          title: Languages
          description: The page of language targets for the project.
        next_cursor:
          title: Next Cursor
          description: 'Opaque cursor to pass back as `cursor` for the next page, or null when there are no more results.'
          type: string
      type: object
      required:
        - languages
      title: DubbingLanguageListResponse
    DubbingProjectResponse:
      properties:
        project_id:
          type: string
          title: Project Id
          description: Unique identifier of the dubbing project.
        status:
          type: string
          enum:
            - queued
            - preparing
            - processing
            - ready
            - failed
          title: Status
          description: 'Lifecycle status of the project: `queued` before the source is picked up, `preparing` while it is transcribed, `ready` once transcription is done and language targets can start, or `failed`. A project is never reported as `processing` — that value belongs to language targets.'
        reference:
          title: Reference
          description: 'The free-form string you supplied as `reference` when creating the project, or null if you supplied none.'
          type: string
        source_language:
          title: Source Language
          description: BCP-47 language tag of the source media (null if auto-detected).
          type: string
        model_id:
          title: Model Id
          description: Dubbing model every language target of this project is dubbed with. Fixed at create time and not selectable per language.
          type: string
        media:
          description: 'Source media metadata, populated once the source has been fetched and decoded (shortly after create, before the project is `ready`); null until then.'
          $ref: '#/components/schemas/DubbingSourceMediaInfo'
        language_ids:
          items:
            type: string
          type: array
          title: Language Ids
          description: 'Identifiers of the language targets under this project. Populated when a single project is fetched, and on create when `target_language` creates one. Always empty in list responses — list the project''s language targets instead.'
          default: []
        webhook_ids:
          items:
            type: string
          type: array
          title: Webhook Ids
          description: 'IDs of the workspace webhooks notified as this project and its languages reach `ready`, `completed`, or `failed`.'
          default: []
        revision:
          type: integer
          title: Revision
          description: Monotonic counter incremented whenever the source transcript is edited (segment add/edit/delete).
        error:
          description: Why the project failed; null unless `status` is `failed`. Also null for the few projects that failed before failure reporting was introduced.
          $ref: '#/components/schemas/DubbingError'
        warnings:
          items:
            $ref: '#/components/schemas/VoicesNotPermittedWarning'
          type: array
          title: Warnings
          description: 'Non-fatal conditions raised while preparing the source, empty when there are none. Reflects the latest preparation. Conditions raised while dubbing a particular language are reported on that language instead.'
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the project was created.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: When the project was last updated.
      type: object
      required:
        - project_id
        - status
        - revision
        - created_at
        - updated_at
      title: DubbingProjectResponse
    DubbingSourceMediaInfo:
      properties:
        filename:
          title: Filename
          description: Original filename of the uploaded source media (null for URL sources).
          type: string
        duration_s:
          title: Duration S
          description: 'Duration of the source media, in seconds.'
          type: number
        has_video:
          title: Has Video
          description: Whether the source media contains a video stream.
          type: boolean
        mime_type:
          title: Mime Type
          description: MIME type of the uploaded source media (null for URL sources).
          type: string
      type: object
      title: DubbingSourceMediaInfo
      description: Metadata about the project's source media.
    Body_Create_Dubbing_Project_v1_dubbing_project_post:
      properties:
        file:
          title: File
          description: 'The source media file to dub: an audio or video file of at most 3 GiB. Provide this or `source_url`, not both.'
          type: string
          format: binary
        source_url:
          title: Source Url
          description: 'Public HTTP(S) URL the source media is fetched from server-side, subject to the same size and format limits as an upload. Provide this or `file`, not both.'
          type: string
        reference:
          title: Reference
          description: Optional free-form string (at most 500 characters) to identify the project on your end. Stored and echoed back verbatim; it does not affect the dub.
          type: string
        source_language:
          title: Source Language
          description: 'BCP-47 language tag of the source media; must be a language the transcription model supports. Any region or script subtag is ignored, since transcription is per-language. Omit to auto-detect.'
          type: string
        model_id:
          anyOf:
            - type: string
              enum:
                - dubbing_v1
                - dubbing_v2
            - type: string
          title: Model Id
          description: 'Dubbing model (`dubbing_v1` or `dubbing_v2`) every language target of this project is dubbed with. Defaults to `dubbing_v2`. Fixed at create time — the source is prepared for this model, so neither the project nor an individual target can change it later.'
        keyterms:
          items:
            type: string
          type: array
          title: Keyterms
          description: 'Key terms to bias transcription and translation toward (for example, product or brand names). At most 1,000 terms; each term at most 50 characters and 5 words; the characters `<>{}[]\` are not allowed. Terms are trimmed and deduplicated. Repeat the field once per term, or pass a single JSON array.'
        webhook_ids:
          items:
            type: string
          type: array
          title: Webhook Ids
          description: 'IDs of workspace webhooks to notify as this project progresses — the alternative to polling, and what we recommend. Each receives a `dubbing_project_ready` or `dubbing_project_failed` event for the project, and a `dubbing_language_completed` or `dubbing_language_failed` event for every language under it; `dubbing_language_completed` carries the output download URLs. At most 3 IDs, each already configured in your workspace — see [Webhooks](https://elevenlabs.io/docs/eleven-api/resources/webhooks) for how to create one and verify its signature. Repeat the field once per ID, or pass a single JSON array or comma-separated string. Delivery is best-effort and can repeat, so we recommend handling events idempotently.'
        target_language:
          title: Target Language
          description: 'Optional shortcut: also create a language target in this BCP-47 language, queued to start once the project is ready — equivalent to creating the project and then creating one language target. Must be one of the [languages the dubbing model supports](https://elevenlabs.io/docs/help-center/product/dubbing/which-languages-are-supported-in-dubbing), and a region-qualified tag must be one of the supported dialects. This is the first language target, so it consumes the project''s minimum charge rather than adding to it. Its ID is returned in `language_ids`.'
          type: string
        transcript:
          title: Transcript
          description: 'Enterprise only. Optional JSON transcript to use instead of transcribing the source: a `{"segments": [...]}` document, at most 20,000 segments and 4 MiB. See [Bring your own transcript](https://elevenlabs.io/docs/eleven-api/guides/how-to/dubbing/bring-your-own-transcript) for the segment fields and their constraints. `source_language` is required whenever a transcript is provided. If any segment carries a `translation`, `target_language` is required and every segment must carry one; those translations seed the target created via `target_language`, which then skips machine translation.'
          type: string
          format: binary
      type: object
      title: Body_Create_Dubbing_Project_v1_dubbing_project_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    DubbingProjectListResponse:
      properties:
        projects:
          items:
            $ref: '#/components/schemas/DubbingProjectResponse'
          type: array
          title: Projects
          description: The page of dubbing projects the caller can access.
        next_cursor:
          title: Next Cursor
          description: 'Opaque cursor to pass back as `cursor` for the next page, or null when there are no more results.'
          type: string
      type: object
      required:
        - projects
      title: DubbingProjectListResponse
tags:
