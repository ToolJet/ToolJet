components:
  schemas:
    DubbingTranscriptsResponseModel:
      properties:
        transcript_format:
          type: string
          enum:
            - srt
            - webvtt
            - json
          title: Transcript Format
        srt:
          title: Srt
          type: string
        webvtt:
          title: Webvtt
          type: string
        json:
          $ref: '#/components/schemas/DubbingTranscript'
      type: object
      required:
        - transcript_format
      title: DubbingTranscriptsResponseModel
    DubbingTranscript:
      properties:
        language:
          type: string
          title: Language
        utterances:
          items:
            $ref: '#/components/schemas/DubbingTranscriptUtterance'
          type: array
          title: Utterances
      type: object
      required:
        - language
        - utterances
      title: DubbingTranscript
    DubbingTranscriptUtterance:
      properties:
        text:
          type: string
          title: Text
          default: ''
        speaker_id:
          type: string
          title: Speaker Id
          default: unknown
        start_s:
          type: number
          title: Start S
          default: 0
        end_s:
          type: number
          title: End S
          default: 0
        words:
          items:
            $ref: '#/components/schemas/DubbingTranscriptWord'
          type: array
          title: Words
      type: object
      title: DubbingTranscriptUtterance
    DubbingTranscriptWord:
      properties:
        text:
          type: string
          title: Text
          default: ''
        word_type:
          type: string
          title: Word Type
          default: unknown
        start_s:
          type: number
          title: Start S
          default: 0
        end_s:
          type: number
          title: End S
          default: 0
        characters:
          items:
            $ref: '#/components/schemas/DubbingTranscriptCharacter'
          type: array
          title: Characters
      type: object
      title: DubbingTranscriptWord
    DubbingTranscriptCharacter:
      properties:
        text:
          type: string
          title: Text
          default: ''
        start_s:
          type: number
          title: Start S
          default: 0
        end_s:
          type: number
          title: End S
          default: 0
      type: object
      title: DubbingTranscriptCharacter
    DubbingTranscriptResponseModel:
      properties:
        language:
          type: string
          title: Language
        utterances:
          items:
            $ref: '#/components/schemas/DubbingTranscriptUtterance'
          type: array
          title: Utterances
      type: object
      required:
        - language
        - utterances
      title: DubbingTranscriptResponseModel
    DeleteDubbingResponseModel:
      properties:
        status:
          type: string
          title: Status
          description: 'The status of the dubbing project. If the request was successful, the status will be ''ok''. Otherwise an error message with status 500 will be returned.'
      type: object
      required:
        - status
      title: DeleteDubbingResponseModel
      example:
        status: ok
    DubbingMetadataResponse:
      properties:
        dubbing_id:
          type: string
          title: Dubbing Id
          description: The ID of the dubbing project.
        name:
          type: string
          title: Name
          description: The name of the dubbing project.
        status:
          type: string
          title: Status
          description: The state this dub is in.
          examples:
            - preparing
            - queued
            - dubbing
            - dubbed
            - failed
            - cloning
        source_language:
          title: Source Language
          description: 'Once dubbing has completed, the ISO-639-1 code of the original media''s source language.'
          type: string
        target_languages:
          items:
            type: string
          type: array
          title: Target Languages
          description: The ISO-639-1 code of the languages this media has been dubbed into.
        editable:
          type: boolean
          title: Editable
          description: Whether this dubbing project is editable in Dubbing Studio.
          default: false
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Timestamp this dub was created.
        media_metadata:
          description: 'Metadata, such as the length in seconds and content type, of the dubbed content.'
          $ref: '#/components/schemas/DubbingMediaMetadata'
        error:
          title: Error
          description: 'Error message indicate, if this dub has failed, what happened.'
          type: string
      type: object
      required:
        - dubbing_id
        - name
        - status
        - source_language
        - target_languages
        - created_at
      title: DubbingMetadataResponse
      example:
        created_at: '2025-07-15T14:49:41.149000'
        dubbing_id: 21m00Tcm4TlvDq8ikWAM
        editable: true
        media_metadata:
          content_type: video/mp4
          duration: 127.5
        name: My Dubbing Project
        source_language: en
        status: dubbed
        target_languages:
          - es
          - fr
          - de
