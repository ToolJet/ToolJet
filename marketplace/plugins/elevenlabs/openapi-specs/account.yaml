components:
  schemas:
    Body_List_API_requests_v1_workspace_analytics_requests_post:
      properties:
        start_time:
          title: Start Time
          description: Start of the time range as a Unix timestamp in milliseconds.
          type: integer
          minimum: 1577836800000
        end_time:
          title: End Time
          description: End of the time range as a Unix timestamp in milliseconds.
          type: integer
          minimum: 1577836800000
        limit:
          type: integer
          maximum: 1000
          minimum: 1
          title: Limit
          default: 100
        sort:
          title: Sort
          description: 'Optional timestamp sort direction. If omitted, defaults to desc when end_time is provided, otherwise asc.'
          type: string
          enum:
            - asc
            - desc
        filters:
          title: Filters
          items:
            $ref: '#/components/schemas/ColumnFilter'
          type: array
        search:
          title: Search
          type: string
      type: object
      title: Body_List_API_requests_v1_workspace_analytics_requests_post
    ColumnFilter:
      properties:
        column:
          type: string
          title: Column
        operation:
          type: string
          enum:
            - in
            - not_in
            - le
            - ge
            - lt
            - gt
            - eq
            - neq
          title: Operation
        values:
          items:
            anyOf:
              - type: string
              - type: integer
              - type: number
              - type: string
                format: date-time
              - type: boolean
          type: array
          title: Values
      type: object
      required:
        - column
        - operation
        - values
      title: ColumnFilter
    WorkspaceAnalyticsQueryResponseModel:
      properties:
        columns:
          items:
            type: string
          type: array
          title: Columns
        column_types:
          items:
            type: string
            enum:
              - String
              - Float
              - DateTime
              - Int
              - Bool
              - JSON
              - Map
              - Array
          type: array
          title: Column Types
        rows:
          items:
            items:
              anyOf:
                - type: string
                - type: integer
                - type: number
                - type: boolean
                - type: string
                  format: date-time
            type: array
          type: array
          title: Rows
        column_units:
          items:
            $ref: '#/components/schemas/ColumnUnit'
          type: array
          title: Column Units
      type: object
      required:
        - columns
        - column_types
        - rows
        - column_units
      title: WorkspaceAnalyticsQueryResponseModel
    ColumnUnit:
      type: string
      enum:
        - ms
        - s
        - min
        - duration
        - credits
        - usd
        - eur
        - inr
        - pln
        - gbp
        - ratio
        - rating
      title: ColumnUnit
    Body_Get_Workspace_Usage_v1_workspace_analytics_query_usage_by_product_over_time_post:
      properties:
        start_time:
          type: integer
          minimum: 1577836800000
          title: Start Time
          description: Start of the time range as a Unix timestamp in milliseconds. Must be at least 2020-01-01.
        end_time:
          type: integer
          minimum: 1577836800000
          title: End Time
          description: End of the time range as a Unix timestamp in milliseconds. Must be at least 2020-01-01.
        interval_seconds:
          type: integer
          minimum: 1
          title: Interval Seconds
          description: 'Bucket size in seconds. Each row in the response covers this many seconds of the selected time range. For example, pass 3600 for hourly buckets, 86400 for daily buckets, or 604800 for weekly buckets. Whether `time_zone` shifts bucket boundaries depends on this value: week multiples (e.g. 604800) are calendar weeks that start Monday at local midnight; whole-day multiples that are not whole weeks (e.g. 86400) align to local midnight; whole-hour multiples up to 24 hours (e.g. 3600, 14400) align to local hour boundaries from midnight; sub-hour values and other sizes remain UTC-anchored regardless of `time_zone`.'
          default: 60
        group_by:
          title: Group By
          items:
