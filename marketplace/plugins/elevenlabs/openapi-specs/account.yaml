openapi: 3.1.0
info:
  title: ElevenLabs API Documentation
  description: 'This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically, this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.'
  version: '1.0'
paths:
  /v1/history:
    get:
      tags:
        - speech-history
      summary: List Generated Items
      description: 'Returns a list of your generated audio (e.g. text to speech, speech to speech, Studio, dubbing). Music and SFX generations are not included and cannot currently be retrieved via the API.'
      operationId: get_speech_history
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            description: 'How many history items to return at maximum. Can not exceed 1000, defaults to 100.'
            default: 100
            title: Page Size
          description: 'How many history items to return at maximum. Can not exceed 1000, defaults to 100.'
        - name: start_after_history_item_id
          in: query
          required: false
          schema:
            description: 'After which ID to start fetching, use this parameter to paginate across a large collection of history items. In case this parameter is not provided history items will be fetched starting from the most recently created one ordered descending by their creation date.'
            title: Start After History Item Id
            type: string
          description: 'After which ID to start fetching, use this parameter to paginate across a large collection of history items. In case this parameter is not provided history items will be fetched starting from the most recently created one ordered descending by their creation date.'
        - name: voice_id
          in: query
          required: false
          schema:
            description: 'Voice ID to be filtered for, you can use GET https://api.elevenlabs.io/v1/voices to receive a list of voices and their IDs.'
            title: Voice Id
            type: string
          description: 'Voice ID to be filtered for, you can use GET https://api.elevenlabs.io/v1/voices to receive a list of voices and their IDs.'
        - name: model_id
          in: query
          required: false
          schema:
            description: Model ID to filter history items by.
            examples:
              - eleven_turbo_v2
              - eleven_multilingual_v2
            title: Model Id
            type: string
          description: Model ID to filter history items by.
        - name: date_before_unix
          in: query
          required: false
          schema:
            description: Unix timestamp to filter history items before this date (exclusive).
            examples:
              - 1640995200
            title: Date Before Unix
            type: integer
          description: Unix timestamp to filter history items before this date (exclusive).
        - name: date_after_unix
          in: query
          required: false
          schema:
            description: Unix timestamp to filter history items after this date (inclusive).
            examples:
              - 1640995200
            title: Date After Unix
            type: integer
          description: Unix timestamp to filter history items after this date (inclusive).
        - name: sort_direction
          in: query
          required: false
          schema:
            description: Sort direction for the results.
            examples:
              - desc
              - asc
            default: desc
            title: Sort Direction
            enum:
              - asc
              - desc
            type: string
          description: Sort direction for the results.
        - name: search
          in: query
          required: false
          schema:
            description: search term used for filtering
            examples:
              - In the land far far away
            title: Search
            type: string
          description: search term used for filtering
        - name: source
          in: query
          required: false
          schema:
            description: Source of the generated history item
            examples:
              - TTS
            title: Source
            enum:
              - TTS
              - STS
              - Flows
            type: string
          description: Source of the generated history item
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSpeechHistoryResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: history
      x-fern-sdk-method-name: list
  '/v1/history/{history_item_id}':
    get:
      tags:
        - speech-history
      summary: Get History Item
      description: Retrieves a history item.
      operationId: get_speech_history_item_by_id
      parameters:
        - name: history_item_id
          in: path
          required: true
          schema:
            type: string
            description: 'History item ID to be used, you can use GET https://api.elevenlabs.io/v1/history to receive a list of history items and their IDs.'
            examples:
              - VW7YKqPnjY4h39yTbx2L
            title: History Item Id
          description: 'History item ID to be used, you can use GET https://api.elevenlabs.io/v1/history to receive a list of history items and their IDs.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechHistoryItemResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: history
      x-fern-sdk-method-name: get
    delete:
      tags:
        - speech-history
      summary: Delete History Item
      description: Delete a history item by its ID
      operationId: delete_speech_history_item
      parameters:
        - name: history_item_id
          in: path
          required: true
          schema:
            type: string
            description: 'History item ID to be used, you can use GET https://api.elevenlabs.io/v1/history to receive a list of history items and their IDs.'
            examples:
              - VW7YKqPnjY4h39yTbx2L
            title: History Item Id
          description: 'History item ID to be used, you can use GET https://api.elevenlabs.io/v1/history to receive a list of history items and their IDs.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteHistoryItemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: history
      x-fern-sdk-method-name: delete
  '/v1/history/{history_item_id}/audio':
    get:
      tags:
        - speech-history
      summary: Get Audio From History Item
      description: Returns the audio of an history item.
      operationId: get_audio_full_from_speech_history_item
      parameters:
        - name: history_item_id
          in: path
          required: true
          schema:
            type: string
            description: 'History item ID to be used, you can use GET https://api.elevenlabs.io/v1/history to receive a list of history items and their IDs.'
            examples:
              - VW7YKqPnjY4h39yTbx2L
            title: History Item Id
          description: 'History item ID to be used, you can use GET https://api.elevenlabs.io/v1/history to receive a list of history items and their IDs.'
      responses:
        '200':
          description: The audio file of the history item.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: history
      x-fern-sdk-method-name: get_audio
  /v1/history/download:
    post:
      tags:
        - speech-history
      summary: Download History Items
      description: 'Download one or more history items. If one history item ID is provided, we will return a single audio file. If more than one history item IDs are provided, we will provide the history items packed into a .zip file.'
      operationId: download_speech_history_items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Download_history_items_v1_history_download_post'
      responses:
        '200':
          description: 'The requested audio file, or a zip file containing multiple audio files when multiple history items are requested.'
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: invalid_output_format
                message: output_format must be wav or none
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: history
      x-fern-sdk-method-name: download
  /v1/user:
    get:
      summary: Get User Info
      description: Gets information about the user
      operationId: get_user_info
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: user
      x-fern-sdk-method-name: get
      tags:
        - user
  /v1/user/subscription:
    get:
      summary: Get User Subscription Info
      description: Gets extended information about the users subscription
      operationId: get_user_subscription_info
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedSubscriptionResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - user
        - subscription
      x-fern-sdk-method-name: get
      tags:
        - user
  /v1/models:
    get:
      tags:
        - models
      summary: Get Models
      description: Gets a list of available models.
      operationId: get_models
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelResponseModel'
                title: Response Get Models V1 Models Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: models
      x-fern-sdk-method-name: list
  /v1/workspaces/api-keys/disable:
    post:
      tags:
        - workspace
        - api-key
      summary: Disable Api Key
      description: Disable the API key used to authenticate this request. Requires the query parameter `api_key_name=self` as an explicit confirmation.
      operationId: disable
      parameters:
        - name: api_key_name
          in: query
          required: true
          schema:
            type: string
            description: Must be set to `self` to disable the API key used to authenticate this request. Required as an explicit confirmation to avoid accidentally disabling the wrong key.
            title: Api Key Name
          description: Must be set to `self` to disable the API key used to authenticate this request. Required as an explicit confirmation to avoid accidentally disabling the wrong key.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - workspaces
        - api_keys
      x-fern-sdk-method-name: disable
  /v1/workspaces/api-keys/third-party-disabling:
    post:
      tags:
        - workspace
        - api-key
      summary: Set Workspace Third-Party Disabling Policy
      description: 'Set the workspace-wide Third-Party Disabling policy. When set, it forces, for every API key in the workspace, whether the holder of a key (potentially a third party who found it) may disable it via the self-disable endpoint or when it leaks publicly — overriding each key''s own setting. Pass `true` to allow it for all keys, `false` to forbid it for all keys, or `null` to clear the override so per-key values and the plan default apply again. Workspace admins only.'
      operationId: set_third_party_disabling_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Set_workspace_Third_Party_Disabling_policy_v1_workspaces_api_keys_third_party_disabling_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  '/v1/service-accounts/{service_account_user_id}/api-keys':
    get:
      tags:
        - workspace
      summary: Get Service Account Api Keys Route
      description: Get all API keys for a service account
      operationId: get_service_account_api_keys_route
      parameters:
        - name: service_account_user_id
          in: path
          required: true
          schema:
            type: string
            title: Service Account User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceApiKeyListResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - service_accounts
        - api_keys
      x-fern-sdk-method-name: list
    post:
      tags:
        - workspace
      summary: Create Service Account Api Key
      description: Create a new API key for a service account
      operationId: create_service_account_api_key
      parameters:
        - name: service_account_user_id
          in: path
          required: true
          schema:
            type: string
            title: Service Account User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_create_service_account_api_key_v1_service_accounts__service_account_user_id__api_keys_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceCreateApiKeyResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - service_accounts
        - api_keys
      x-fern-sdk-method-name: create
  '/v1/service-accounts/{service_account_user_id}/api-keys/{api_key_id}':
    delete:
      tags:
        - workspace
      summary: Delete Service Account Api Key
      description: Delete an existing API key for a service account
      operationId: delete_service_account_api_key
      parameters:
        - name: service_account_user_id
          in: path
          required: true
          schema:
            type: string
            title: Service Account User Id
        - name: api_key_id
          in: path
          required: true
          schema:
            type: string
            title: Api Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - service_accounts
        - api_keys
      x-fern-sdk-method-name: delete
    patch:
      tags:
        - workspace
      summary: Edit Service Account Api Key
      description: Update an existing API key for a service account
      operationId: edit_service_account_api_key
      parameters:
        - name: service_account_user_id
          in: path
          required: true
          schema:
            type: string
            title: Service Account User Id
        - name: api_key_id
          in: path
          required: true
          schema:
            type: string
            title: Api Key Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_edit_service_account_api_key_v1_service_accounts__service_account_user_id__api_keys__api_key_id__patch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - service_accounts
        - api_keys
      x-fern-sdk-method-name: update
  /v1/workspace/audit-logs:
    get:
      tags:
        - workspace
      summary: Get Workspace Audit Logs
      description: Returns the audit log for the workspace. Requires enterprise tier and the audit_log_read permission.
      operationId: get_workspace_audit_logs
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Maximum number of entries per page
            default: 50
            title: Limit
          description: Maximum number of entries per page
        - name: cursor
          in: query
          required: false
          schema:
            description: Cursor for the next page (from previous response)
            title: Cursor
            type: string
          description: Cursor for the next page (from previous response)
        - name: time_from_unix_ms
          in: query
          required: false
          schema:
            description: Only include entries at or after this time (ms since epoch)
            title: Time From Unix Ms
            type: integer
          description: Only include entries at or after this time (ms since epoch)
        - name: time_to_unix_ms
          in: query
          required: false
          schema:
            description: Only include entries at or before this time (ms since epoch)
            title: Time To Unix Ms
            type: integer
          description: Only include entries at or before this time (ms since epoch)
        - name: actor_uid
          in: query
          required: false
          schema:
            description: Filter by actor user ID
            title: Actor Uid
            type: string
          description: Filter by actor user ID
        - name: class_name
          in: query
          required: false
          schema:
            description: Filter by OCSF event class name (e.g. Account Change)
            title: Class Name
            type: string
          description: Filter by OCSF event class name (e.g. Account Change)
        - name: activity_name
          in: query
          required: false
          schema:
            description: Filter by audit activity name (e.g. Subscription Creation)
            title: Activity Name
            type: string
          description: Filter by audit activity name (e.g. Subscription Creation)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAuditLogsPageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - workspace
        - audit_logs
      x-fern-sdk-method-name: list
  /v1/workspace/auth-connections:
    get:
      tags:
        - workspace
      summary: Get Workspace Auth Connections
      description: Get all auth connections for the workspace
      operationId: list_auth_connections
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuthConnectionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - workspace
        - auth_connections
      x-fern-sdk-method-name: list
    post:
      tags:
        - workspace
      summary: Create Workspace Auth Connection
      description: Create a new OAuth2 auth connection for the workspace
      operationId: create_auth_connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/CreateOAuth2ClientCredsRequest'
                - $ref: '#/components/schemas/CreateCustomHeaderAuthRequest'
                - $ref: '#/components/schemas/CreateBasicAuthRequest'
                - $ref: '#/components/schemas/CreateBearerAuthRequest'
                - $ref: '#/components/schemas/CreateOAuth2JWTRequest'
                - $ref: '#/components/schemas/CreatePrivateKeyJWTRequest'
                - $ref: '#/components/schemas/CreateMTLSAuthRequest'
              description: Auth connection to create
              title: Request Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OAuth2ClientCredsResponse'
                  - $ref: '#/components/schemas/RefreshTokenAuthResponse'
                  - $ref: '#/components/schemas/BasicAuthResponse'
                  - $ref: '#/components/schemas/BearerAuthResponse'
                  - $ref: '#/components/schemas/OAuth2JWTResponse'
                  - $ref: '#/components/schemas/PrivateKeyJWTResponse'
                  - $ref: '#/components/schemas/MTLSAuthResponse'
                  - $ref: '#/components/schemas/CustomHeaderAuthResponse'
                  - $ref: '#/components/schemas/ApiIntegrationOAuth2AuthCodeResponse'
                  - $ref: '#/components/schemas/ApiIntegrationOAuth2CustomAppResponse'
                  - $ref: '#/components/schemas/WhatsAppAuthResponse'
                  - $ref: '#/components/schemas/SlackBotAuthResponse'
                  - $ref: '#/components/schemas/UrlSecretAuthResponse'
                discriminator:
                  propertyName: auth_type
                  mapping:
                    oauth2_client_credentials: '#/components/schemas/OAuth2ClientCredsResponse'
                    refresh_token_auth: '#/components/schemas/RefreshTokenAuthResponse'
                    basic_auth: '#/components/schemas/BasicAuthResponse'
                    bearer_auth: '#/components/schemas/BearerAuthResponse'
                    oauth2_jwt: '#/components/schemas/OAuth2JWTResponse'
                    private_key_jwt: '#/components/schemas/PrivateKeyJWTResponse'
                    mtls: '#/components/schemas/MTLSAuthResponse'
                    custom_header_auth: '#/components/schemas/CustomHeaderAuthResponse'
                    api_integration_oauth2_auth_code: '#/components/schemas/ApiIntegrationOAuth2AuthCodeResponse'
                    api_integration_oauth2_custom_app: '#/components/schemas/ApiIntegrationOAuth2CustomAppResponse'
                    whatsapp_auth: '#/components/schemas/WhatsAppAuthResponse'
                    slack_bot_auth: '#/components/schemas/SlackBotAuthResponse'
                    url_secret: '#/components/schemas/UrlSecretAuthResponse'
                description: The type of auth connection config
                title: Response Create Workspace Auth Connection V1 Workspace Auth Connections Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - workspace
        - auth_connections
      x-fern-sdk-method-name: create
  '/v1/workspace/auth-connections/{auth_connection_id}':
    delete:
      tags:
        - workspace
      summary: Delete Workspace Auth Connection
      description: Delete an auth connection
      operationId: delete_auth_connection
      parameters:
        - name: auth_connection_id
          in: path
          required: true
          schema:
            type: string
            title: Auth Connection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - workspace
        - auth_connections
      x-fern-sdk-method-name: delete
    patch:
      tags:
        - workspace
      summary: Update Workspace Auth Connection
      description: Update an auth connection
      operationId: update_auth_connection
      parameters:
        - name: auth_connection_id
          in: path
          required: true
          schema:
            type: string
            title: Auth Connection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/UpdateOAuth2ClientCredsRequest'
                - $ref: '#/components/schemas/UpdateBasicAuthRequest'
                - $ref: '#/components/schemas/UpdateBearerAuthRequest'
                - $ref: '#/components/schemas/UpdateOAuth2JWTRequest'
              description: Updated auth connection fields
              title: Request Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OAuth2ClientCredsResponse'
                  - $ref: '#/components/schemas/RefreshTokenAuthResponse'
                  - $ref: '#/components/schemas/BasicAuthResponse'
                  - $ref: '#/components/schemas/BearerAuthResponse'
                  - $ref: '#/components/schemas/OAuth2JWTResponse'
                  - $ref: '#/components/schemas/PrivateKeyJWTResponse'
                  - $ref: '#/components/schemas/MTLSAuthResponse'
                  - $ref: '#/components/schemas/CustomHeaderAuthResponse'
                  - $ref: '#/components/schemas/ApiIntegrationOAuth2AuthCodeResponse'
                  - $ref: '#/components/schemas/ApiIntegrationOAuth2CustomAppResponse'
                  - $ref: '#/components/schemas/WhatsAppAuthResponse'
                  - $ref: '#/components/schemas/SlackBotAuthResponse'
                  - $ref: '#/components/schemas/UrlSecretAuthResponse'
                discriminator:
                  propertyName: auth_type
                  mapping:
                    oauth2_client_credentials: '#/components/schemas/OAuth2ClientCredsResponse'
                    refresh_token_auth: '#/components/schemas/RefreshTokenAuthResponse'
                    basic_auth: '#/components/schemas/BasicAuthResponse'
                    bearer_auth: '#/components/schemas/BearerAuthResponse'
                    oauth2_jwt: '#/components/schemas/OAuth2JWTResponse'
                    private_key_jwt: '#/components/schemas/PrivateKeyJWTResponse'
                    mtls: '#/components/schemas/MTLSAuthResponse'
                    custom_header_auth: '#/components/schemas/CustomHeaderAuthResponse'
                    api_integration_oauth2_auth_code: '#/components/schemas/ApiIntegrationOAuth2AuthCodeResponse'
