          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    GetSpeechHistoryResponseModel:
      properties:
        history:
          items:
            $ref: '#/components/schemas/SpeechHistoryItemResponseModel'
