openapi: 3.1.0
info:
  title: ElevenLabs API Documentation
  description: 'This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically, this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.'
  version: '1.0'
paths:
  '/v1/voices/{voice_id}/samples/{sample_id}':
    delete:
      tags:
        - samples
      summary: Delete Sample
      description: Removes a sample by its ID.
      operationId: delete_sample
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
            description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
            examples:
              - 21m00Tcm4TlvDq8ikWAM
            title: Voice Id
          description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
        - name: sample_id
          in: path
          required: true
          schema:
            type: string
            description: 'Sample ID to be used, you can use GET https://api.elevenlabs.io/v1/voices/{voice_id} to list all the available samples for a voice.'
            examples:
              - VW7YKqPnjY4h39yTbx2L
            title: Sample Id
          description: 'Sample ID to be used, you can use GET https://api.elevenlabs.io/v1/voices/{voice_id} to list all the available samples for a voice.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSampleResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: samples
      x-fern-sdk-method-name: delete
  '/v1/voices/{voice_id}/samples/{sample_id}/audio':
    get:
      tags:
        - samples
      summary: Get Audio From Sample
      description: Returns the audio corresponding to a sample attached to a voice.
      operationId: get_audio_from_sample
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
            description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
            examples:
              - 21m00Tcm4TlvDq8ikWAM
            title: Voice Id
          description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
        - name: sample_id
          in: path
          required: true
          schema:
            type: string
            description: 'Sample ID to be used, you can use GET https://api.elevenlabs.io/v1/voices/{voice_id} to list all the available samples for a voice.'
            examples:
              - VW7YKqPnjY4h39yTbx2L
            title: Sample Id
          description: 'Sample ID to be used, you can use GET https://api.elevenlabs.io/v1/voices/{voice_id} to list all the available samples for a voice.'
      responses:
        '200':
          description: Successful Response
          content:
            audio/*: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - voices
        - samples
        - audio
      x-fern-sdk-method-name: get
  /v1/text-to-voice/create-previews:
    post:
      tags:
        - text-to-voice
      summary: '[Deprecated] Generate A Voice Preview From Description'
      description: '**Deprecated.** Use `POST /v1/text-to-voice/design` instead. Generate a custom voice based on voice description. This method returns a list of voice previews. Each preview has a generated_voice_id and a sample of the voice as base64 encoded mp3 audio. To create the voice use `POST /v1/text-to-voice` with the chosen `generated_voice_id`.'
      operationId: text_to_voice
      deprecated: true
      parameters:
        - name: output_format
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AllowedOutputFormats'
            title: Output format of the generated audio.
            description: 'Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.'
            enum:
              - mp3_22050_32
              - mp3_24000_48
              - mp3_44100_32
              - mp3_44100_64
              - mp3_44100_96
              - mp3_44100_128
              - mp3_44100_192
              - pcm_8000
              - pcm_16000
              - pcm_22050
              - pcm_24000
              - pcm_32000
              - pcm_44100
              - pcm_48000
              - ulaw_8000
              - alaw_8000
              - opus_48000_32
              - opus_48000_64
              - opus_48000_96
              - opus_48000_128
              - opus_48000_192
            default: mp3_44100_192
          description: 'Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoicePreviewsRequestModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoicePreviewsResponseModel'
        '409':
          description: A generation for this preview is already in progress. Retry the request.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: text_to_voice
      x-fern-sdk-method-name: create_previews
  /v1/text-to-voice:
    post:
      tags:
        - text-to-voice
      summary: Create A New Voice From Voice Preview
      description: 'Create a voice from previously generated voice preview. This endpoint should be called after you fetched a generated_voice_id using POST /v1/text-to-voice/design or POST /v1/text-to-voice/:voice_id/remix.'
      operationId: create_voice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Create_a_new_voice_from_voice_preview_v1_text_to_voice_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceResponseModel'
        '409':
          description: A generation for this preview is already in progress. Retry the request.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: text_to_voice
      x-fern-sdk-method-name: create
  /v1/text-to-voice/design:
    post:
      tags:
        - text-to-voice
      summary: Design A Voice.
      description: Design a voice via a prompt. This method returns a list of voice previews. Each preview has a generated_voice_id and a sample of the voice as base64 encoded mp3 audio. To create a voice use the generated_voice_id of the preferred preview with the /v1/text-to-voice endpoint.
      operationId: text_to_voice_design
      parameters:
        - name: output_format
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AllowedOutputFormats'
            title: Output format of the generated audio.
            description: 'Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.'
            enum:
              - mp3_22050_32
              - mp3_24000_48
              - mp3_44100_32
              - mp3_44100_64
              - mp3_44100_96
              - mp3_44100_128
              - mp3_44100_192
              - pcm_8000
              - pcm_16000
              - pcm_22050
              - pcm_24000
              - pcm_32000
              - pcm_44100
              - pcm_48000
              - ulaw_8000
              - alaw_8000
              - opus_48000_32
              - opus_48000_64
              - opus_48000_96
              - opus_48000_128
              - opus_48000_192
            default: mp3_44100_192
          description: 'Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceDesignRequestModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoicePreviewsResponseModel'
        '409':
          description: A generation for this preview is already in progress. Retry the request.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: text_to_voice
      x-fern-sdk-method-name: design
  '/v1/text-to-voice/{voice_id}/remix':
    post:
      tags:
        - text-to-voice
      summary: Remix A Voice.
      description: Remix an existing voice via a prompt. This method returns a list of voice previews. Each preview has a generated_voice_id and a sample of the voice as base64 encoded mp3 audio. To create a voice use the generated_voice_id of the preferred preview with the /v1/text-to-voice endpoint.
      operationId: text_to_voice_remix
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
            description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
            examples:
              - 21m00Tcm4TlvDq8ikWAM
            title: Voice Id
          description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
        - name: output_format
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AllowedOutputFormats'
            title: Output format of the generated audio.
            description: 'Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.'
            enum:
              - mp3_22050_32
              - mp3_24000_48
              - mp3_44100_32
              - mp3_44100_64
              - mp3_44100_96
              - mp3_44100_128
              - mp3_44100_192
              - pcm_8000
              - pcm_16000
              - pcm_22050
              - pcm_24000
              - pcm_32000
              - pcm_44100
              - pcm_48000
              - ulaw_8000
              - alaw_8000
              - opus_48000_32
              - opus_48000_64
              - opus_48000_96
              - opus_48000_128
              - opus_48000_192
            default: mp3_44100_192
          description: 'Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceRemixRequestModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoicePreviewsResponseModel'
        '409':
          description: A generation for this preview is already in progress. Retry the request.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: text_to_voice
      x-fern-sdk-method-name: remix
  '/v1/text-to-voice/{generated_voice_id}/stream':
    get:
      tags:
        - text-to-voice
      summary: Text To Voice Preview Streaming
      description: Stream a voice preview that was created via the /v1/text-to-voice/design endpoint.
      operationId: text_to_voice_preview_stream
      parameters:
        - name: generated_voice_id
          in: path
          required: true
          schema:
            type: string
            description: The generated_voice_id to stream.
            examples:
              - 37HceQefKmEi3bGovXjL
            embed: true
            title: Generated Voice Id
          description: The generated_voice_id to stream.
      responses:
        '200':
          description: Streaming audio data
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - text_to_voice
        - preview
      x-fern-sdk-method-name: stream
      x-fern-streaming: true
  /v1/voices/settings/default:
    get:
      tags:
        - voices
        - voices
      summary: Get Default Voice Settings.
      description: Gets the default settings for voices. "similarity_boost" corresponds to"Clarity + Similarity Enhancement" in the web app and "stability" corresponds to "Stability" slider in the web app.
      operationId: get_voice_settings_default
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSettingsResponseModel'
      x-fern-sdk-group-name:
        - voices
        - settings
      x-fern-sdk-method-name: get_default
  '/v1/voices/{voice_id}/settings':
    get:
      tags:
        - voices
        - voices
      summary: Get Voice Settings
      description: Returns the settings for a specific voice. "similarity_boost" corresponds to"Clarity + Similarity Enhancement" in the web app and "stability" corresponds to "Stability" slider in the web app.
      operationId: get_voice_settings
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
            description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
            examples:
              - 21m00Tcm4TlvDq8ikWAM
            title: Voice Id
          description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSettingsResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - voices
        - settings
      x-fern-sdk-method-name: get
  '/v1/voices/{voice_id}/settings/edit':
    post:
      tags:
        - voices
        - voices
      summary: Edit Voice Settings
      description: Edit your settings for a specific voice. "similarity_boost" corresponds to "Clarity + Similarity Enhancement" in the web app and "stability" corresponds to "Stability" slider in the web app.
      operationId: edit_voice_settings
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
            description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
            examples:
              - 21m00Tcm4TlvDq8ikWAM
            title: Voice Id
          description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceSettingsResponseModel'
              description: The settings for a specific voice.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditVoiceSettingsResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - voices
        - settings
      x-fern-sdk-method-name: update
  /v1/voices/accents:
    get:
      tags:
        - voices
      summary: Get Voice Accents
      description: Gets the list of available accents in the shared voice library.
      operationId: get_voice_accents
      parameters:
        - name: language
          in: query
          required: false
          schema:
            description: 'If provided, only accents for this language code are returned.'
            examples:
              - en
            title: Language
            type: string
          description: 'If provided, only accents for this language code are returned.'
        - name: model_id
          in: query
          required: false
          schema:
            description: 'If provided, returns the accents available for this model. Defaults to the most complete accent list when omitted.'
            examples:
              - eleven_v3
            title: Model Id
            type: string
          description: 'If provided, returns the accents available for this model. Defaults to the most complete accent list when omitted.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVoiceAccentsResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - voices
        - accents
      x-fern-sdk-method-name: get
  /v1/voices:
    get:
      tags:
        - voices
        - voices
      summary: List Voices
      description: Returns a list of all available voices for a user. Stops working once the user's workspace exceeds 500 voices.
      operationId: get_voices
      parameters:
        - name: show_legacy
          in: query
          required: false
          schema:
            description: 'If set to true, legacy premade voices will be included in responses from /v1/voices'
            examples:
              - true
            default: false
            title: Show Legacy
            type: boolean
          description: 'If set to true, legacy premade voices will be included in responses from /v1/voices'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVoicesResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: voices
      x-fern-sdk-method-name: get_all
  '/v1/voices/{voice_id}':
    get:
      tags:
        - voices
        - voices
      summary: Get Voice
      description: Returns metadata about a specific voice.
      operationId: get_voice_by_id
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
            description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
            examples:
              - 21m00Tcm4TlvDq8ikWAM
            title: Voice Id
          description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
        - name: with_settings
          in: query
          required: false
          schema:
            type: boolean
            description: This parameter is now deprecated. It is ignored and will be removed in a future version.
            deprecated: true
            default: true
            title: With Settings
          description: This parameter is now deprecated. It is ignored and will be removed in a future version.
          deprecated: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: voices
      x-fern-sdk-method-name: get
    delete:
      tags:
        - voices
        - voices
      summary: Delete Voice
      description: Deletes a voice by its ID.
      operationId: delete_voice
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
            description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
            examples:
              - 21m00Tcm4TlvDq8ikWAM
            title: Voice Id
          description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteVoiceResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: voices
      x-fern-sdk-method-name: delete
  '/v1/voices/{voice_id}/edit':
    post:
      tags:
        - voices
        - voices
      summary: Edit Voice
      description: Edit a voice created by you.
      operationId: edit_voice
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
            description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
            examples:
              - 21m00Tcm4TlvDq8ikWAM
            title: Voice Id
          description: 'Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Edit_voice_v1_voices__voice_id__edit_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditVoiceResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: voices
      x-fern-sdk-method-name: update
  /v2/voices:
    get:
      tags:
        - voices
        - voices
      summary: Get Voices V2
      description: 'Gets a list of all available voices for a user with search, filtering and pagination.'
      operationId: get_user_voices_v2
      parameters:
        - name: next_page_token
          in: query
          required: false
          schema:
            description: The next page token to use for pagination. Returned from the previous request. Use this in combination with the has_more flag for reliable pagination.
            examples:
              - '0'
            title: Next Page Token
            type: string
          description: The next page token to use for pagination. Returned from the previous request. Use this in combination with the has_more flag for reliable pagination.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            description: 'How many voices to return at maximum. Can not exceed 100, defaults to 10. Page 0 may include more voices due to default voices being included.'
            default: 10
            title: Page Size
          description: 'How many voices to return at maximum. Can not exceed 100, defaults to 10. Page 0 may include more voices due to default voices being included.'
        - name: search
          in: query
          required: false
          schema:
            description: 'Search term to filter voices by. Searches in name, description, labels, category.'
            title: Search
            type: string
          description: 'Search term to filter voices by. Searches in name, description, labels, category.'
        - name: sort
          in: query
          required: false
          schema:
            description: 'Which field to sort by, one of ''created_at_unix'' or ''name''. ''created_at_unix'' may not be available for older voices.'
            examples:
              - created_at_unix
            title: Sort
            type: string
          description: 'Which field to sort by, one of ''created_at_unix'' or ''name''. ''created_at_unix'' may not be available for older voices.'
        - name: sort_direction
          in: query
          required: false
          schema:
            description: Which direction to sort the voices in. 'asc' or 'desc'.
            examples:
              - desc
            title: Sort Direction
            type: string
          description: Which direction to sort the voices in. 'asc' or 'desc'.
