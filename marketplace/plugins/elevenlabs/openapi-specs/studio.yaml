        - studio
      summary: Convert Studio Project
      description: Starts conversion of a Studio project and all of its chapters.
      operationId: convert_project_endpoint
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            description: The ID of the Studio project.
            examples:
              - 21m00Tcm4TlvDq8ikWAM
            title: Project Id
          description: The ID of the Studio project.
      responses:
