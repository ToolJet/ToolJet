          description: The ID of the Studio project snapshot.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Stream_Studio_project_audio_v1_studio_projects__project_id__snapshots__project_snapshot_id__stream_post'
      responses:
