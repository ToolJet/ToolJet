          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveOrderItemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - productions
        - orders
        - items
      x-fern-sdk-method-name: remove
  '/v1/productions/orders/{order_id}/submit':
    post:
      tags:
        - productions
      summary: Submit Order
      description: |-
        Submits an open order for processing. The order must have at least one item. Once submitted, items can no longer be modified.

        Upon submission, the workspace will be charged for the order. The quote is based on information extracted from the uploaded media, such as its duration. The quote may not be available immediately; if you wish to see the quote before submission, you may need to poll the order details until the quote is ready.
      operationId: public_submit_order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrderId'
            description: The ID of the order.
          description: The ID of the order.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - productions
        - orders
      x-fern-sdk-method-name: submit
  '/v1/productions/orders/{order_id}/deliverables':
    get:
      tags:
        - productions
      summary: Get Order Deliverables
      description: Retrieves the delivered files for a completed order. Returns an empty list if the order is not yet completed.
      operationId: public_get_order_deliverables
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrderId'
            description: The ID of the order.
          description: The ID of the order.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDeliverablesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - productions
        - orders
        - deliverables
      x-fern-sdk-method-name: list
  '/v1/productions/orders/languages/{order_item_kind}':
    get:
      tags:
        - productions
      summary: Get Available Languages
      description: Returns the available languages for a given order item kind.
      operationId: public_get_available_languages
      parameters:
        - name: order_item_kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrderItemKind'
            description: The kind of order item.
          description: The kind of order item.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguagesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
        - productions
        - orders
        - languages
      x-fern-sdk-method-name: list
components:
  schemas:
    LanguagesResponse:
      oneOf:
        - $ref: '#/components/schemas/PairedLanguagesResponse'
        - $ref: '#/components/schemas/SingleLanguagesResponse'
      discriminator:
        propertyName: kind
        mapping:
          pair: '#/components/schemas/PairedLanguagesResponse'
          single: '#/components/schemas/SingleLanguagesResponse'
    SingleLanguagesResponse:
      properties:
        kind:
          type: string
          const: single
          title: Kind
          description: Indicates this response contains single languages (not source-to-destination pairs).
          default: single
        languages:
          items:
            $ref: '#/components/schemas/LanguageInfo'
          type: array
          title: Languages
          description: The list of available languages.
      type: object
      required:
        - languages
      title: SingleLanguagesResponse
      example:
        kind: single
        languages:
          - code: en
            label: English
          - code: es-ES
            label: Spanish (Spain)
          - code: fr
            label: French
    LanguageInfo:
      properties:
        code:
          type: string
          title: Code
          description: 'The language code (e.g. ''en'', ''fr'', ''es-ES'').'
        label:
          type: string
          title: Label
          description: 'The human-readable language name (e.g. ''English'', ''French'', ''Spanish (Spain)'').'
      type: object
      required:
        - code
        - label
      title: LanguageInfo
      example:
        code: es-ES
        label: Spanish (Spain)
    PairedLanguagesResponse:
      properties:
        kind:
          type: string
          const: pair
          title: Kind
          description: Indicates this response contains source-to-destination language pairs.
          default: pair
        language_pairs:
          items:
            $ref: '#/components/schemas/LanguagePairInfo'
          type: array
          title: Language Pairs
          description: The list of available source-to-destination language mappings.
      type: object
      required:
        - language_pairs
      title: PairedLanguagesResponse
      example:
        kind: pair
        language_pairs:
          - destination_languages:
              - code: es
                label: Spanish
              - code: es-ES
                label: Spanish (Spain)
              - code: fr
                label: French
            source_language:
              code: en
              label: English
          - destination_languages:
              - code: en
                label: English
            source_language:
              code: es-ES
              label: Spanish (Spain)
    LanguagePairInfo:
      properties:
        source_language:
          $ref: '#/components/schemas/LanguageInfo'
          description: The source language.
        destination_languages:
          items:
            $ref: '#/components/schemas/LanguageInfo'
          type: array
          title: Destination Languages
          description: The available destination languages for this source language.
      type: object
      required:
        - source_language
        - destination_languages
      title: LanguagePairInfo
      example:
        destination_languages:
          - code: es-ES
            label: Spanish (Spain)
          - code: fr
            label: French
        source_language:
          code: en
          label: English
    OrderItemKind:
      type: string
      enum:
        - dub
        - subtitles
        - transcription
      title: OrderItemKind
    OrderDeliverablesResponse:
      properties:
        deliverables:
          items:
            $ref: '#/components/schemas/DeliverableInfo'
          type: array
          title: Deliverables
          description: The list of delivered files for the order. Empty if the order is not yet completed.
      type: object
      required:
        - deliverables
      title: OrderDeliverablesResponse
      example:
        deliverables:
          - content_type: video/mp4
            name: output_fr.mp4
            signed_url: 'https://storage.googleapis.com/example-bucket/deliverables/output_fr.mp4?X-Goog-Signature=...'
            version: 1
    DeliverableInfo:
      properties:
        signed_url:
          type: string
          title: Signed Url
          description: A time-limited URL to download the delivered file.
        content_type:
          type: string
          title: Content Type
          description: The MIME type of the delivered file (e.g. 'video/mp4').
        name:
          type: string
          title: Name
          description: The name of the delivered file.
        version:
          type: integer
          title: Version
          description: The version number of the deliverable.
          default: 1
      type: object
      required:
        - signed_url
        - content_type
        - name
      title: DeliverableInfo
      example:
        content_type: video/mp4
        name: '[fr][mp4] Item #cbaba1fe'
        signed_url: 'https://storage.googleapis.com/example-bucket/deliverables/output_fr.mp4?X-Goog-Signature=...'
        version: 1
    SubmitOrderResponse:
      properties:
        order_id:
          $ref: '#/components/schemas/OrderId'
          description: The ID of the submitted order.
        state:
          $ref: '#/components/schemas/OrderState'
          description: The current state of the order after submission.
        submitted_at:
          type: string
          format: date-time
          title: Submitted At
          description: The timestamp when the order was submitted.
      type: object
      required:
        - order_id
        - state
        - submitted_at
      title: SubmitOrderResponse
      example:
        order_id: prodorder_01jgatk6h0fwxrtbjade61yqhx
        state: submitted
        submitted_at: '2025-03-15T10:30:00Z'
    OrderState:
      type: string
      enum:
        - open
        - submitted
        - paid
        - accepted
        - rejected
        - done
        - cancelling
        - cancelled
        - expired
        - merged
      title: OrderState
    OrderId:
      type: string
      pattern: '^prodorder_[a-z0-9]{26}$'
    RemoveOrderItemResponse:
      properties:
        success:
          type: boolean
          title: Success
          description: Whether the item was successfully removed.
      type: object
      required:
        - success
      title: RemoveOrderItemResponse
      example:
        success: true
    ItemId:
      type: string
      pattern: '^proditem_[a-z0-9]{26}$'
    UpsertOrderItemResponse:
      properties:
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: The ID of the upserted order item.
        quote:
          description: The quoted price for this item.
          $ref: '#/components/schemas/QuoteInfo'
      type: object
      required:
        - item_id
      title: UpsertOrderItemResponse
      example:
        item_id: proditem_01jgd3qhejfs7rm6swknz2ytjb
        quote:
          amount_usd: 11
    QuoteInfo:
      properties:
        amount_usd:
          type: number
          title: Amount Usd
          description: The quoted price for this item in USD. Use the order's total_amount_usd for the combined order total.
      type: object
      required:
        - amount_usd
      title: QuoteInfo
      example:
        amount_usd: 11
    Body_Upsert_order_item_v1_productions_orders__order_id__items_post:
      properties:
        request:
          $ref: '#/components/schemas/UpsertOrderItemRequest'
      type: object
      required:
        - request
      title: Body_Upsert_order_item_v1_productions_orders__order_id__items_post
    UpsertOrderItemRequest:
      properties:
        item:
          $ref: '#/components/schemas/OrderItemRequest-Input'
          description: The order item to add or update.
        item_id:
          description: The ID of an existing item to update. Omit to create a new item.
          $ref: '#/components/schemas/ItemId'
      type: object
      required:
        - item
      title: UpsertOrderItemRequest
      examples:
        - item:
            captions_sdh: false
            destination_languages:
              - hi
              - fr-FR
              - de
            include_captions: true
            include_source_captions: false
            instructions: 'Voices don''t need to match the originals, prioritize native-sounding voices'
            kind: dub
            media_id: prodmedia_01jgatk6h0fwxrtbjade61yqhx
            source_language: en
        - item:
            cue_options:
              max_chars_per_line: 42
              max_lines_per_cue: 2
            destination_languages:
              - hi
              - fr-FR
              - de
            instructions: Avoid splitting noun phrases across lines.
            kind: subtitles
            media_ids:
              - prodmedia_01jgatk6h0fwxrtbjade61yqhx
              - prodmedia_01jgb2zd68f8f9tfvbb968wb8z
            sdh: false
            source_language: en
    OrderItemRequest-Input:
      oneOf:
        - $ref: '#/components/schemas/DubOrderItemRequest'
        - $ref: '#/components/schemas/SubtitleOrderItemRequest'
        - $ref: '#/components/schemas/TranscriptionOrderItemRequest'
      discriminator:
        propertyName: kind
        mapping:
          dub: '#/components/schemas/DubOrderItemRequest'
          subtitles: '#/components/schemas/SubtitleOrderItemRequest'
          transcription: '#/components/schemas/TranscriptionOrderItemRequest'
    TranscriptionOrderItemRequest:
      properties:
        kind:
          type: string
          const: transcription
          title: Kind
          description: The type of order item.
          default: transcription
        media_ids:
          items:
            $ref: '#/components/schemas/MediaId'
          type: array
          title: Media Ids
          description: The IDs of the uploaded media files to transcribe.
        source_language:
          type: string
          title: Source Language
          description: 'The language code of the source media (e.g. ''en'', ''es'').'
        verbatim:
          type: boolean
          title: Verbatim
          description: 'Whether to transcribe every word exactly, including filler words.'
          default: false
        instructions:
          title: Instructions
          description: Optional free-text instructions for the transcription team.
          type: string
      type: object
      required:
        - media_ids
        - source_language
      title: TranscriptionOrderItemRequest
      example:
        instructions: Use speaker labels where possible.
        kind: transcription
        media_ids:
          - prodmedia_01jgatk6h0fwxrtbjade61yqhx
          - prodmedia_01jgb2zd68f8f9tfvbb968wb8z
        source_language: en
        verbatim: false
    MediaId:
      type: string
      pattern: '^prodmedia_[a-z0-9]{26}$'
    SubtitleOrderItemRequest:
      properties:
        kind:
          type: string
          const: subtitles
          title: Kind
          description: The type of order item.
          default: subtitles
        media_ids:
          items:
            $ref: '#/components/schemas/MediaId'
          type: array
          title: Media Ids
          description: The IDs of the uploaded media files to generate subtitles for.
        source_language:
          type: string
          title: Source Language
          description: 'The language code of the source media (e.g. ''en'', ''es'').'
        destination_languages:
          items:
            type: string
          type: array
          title: Destination Languages
          description: List of target language codes. Subtitles will be generated for each media file in each destination language.
        cue_options:
          $ref: '#/components/schemas/CueOptionsRequest'
          description: 'Formatting options for subtitle cues such as duration, line count, and character limits.'
        sdh:
          type: boolean
          title: Sdh
          description: 'Whether subtitles should use SDH format, which includes descriptions for deaf and hard-of-hearing viewers.'
          default: false
        instructions:
          title: Instructions
          description: Optional free-text instructions for the subtitling team.
          type: string
      type: object
      required:
        - media_ids
        - source_language
        - destination_languages
      title: SubtitleOrderItemRequest
      example:
        cue_options:
          max_chars_per_line: 42
          max_duration_ms: 7000
          max_lines_per_cue: 2
          min_duration_ms: 1000
        destination_languages:
          - hi
          - fr-FR
          - de
        instructions: Keep reading speed moderate; preserve humor in idioms.
        kind: subtitles
        media_ids:
          - prodmedia_01jgatk6h0fwxrtbjade61yqhx
          - prodmedia_01jgb2zd68f8f9tfvbb968wb8z
        sdh: false
        source_language: en
    CueOptionsRequest:
      properties:
        min_duration_ms:
          type: integer
          maximum: 2000
          title: Min Duration Ms
          description: Minimum duration of each cue in milliseconds.
          default: 1000
        max_duration_ms:
          type: integer
          minimum: 4000
          title: Max Duration Ms
          description: Maximum duration of each cue in milliseconds.
          default: 7000
        max_lines_per_cue:
          type: integer
          maximum: 3
          minimum: 1
          title: Max Lines Per Cue
          description: Maximum number of lines per cue.
          default: 2
        max_chars_per_line:
          type: integer
          maximum: 50
          minimum: 16
          title: Max Chars Per Line
          description: Maximum number of characters per line in a cue.
          default: 42
        max_chars_per_s:
          title: Max Chars Per S
          description: 'Maximum characters per second reading speed. If not set, no reading speed limit is applied.'
          type: integer
          maximum: 30
          minimum: 15
        min_gap_between_cues_frames:
          title: Min Gap Between Cues Frames
          description: 'Minimum gap between consecutive cues in frames. If not set, no minimum gap is enforced.'
          type: integer
          maximum: 6
          minimum: 0
      type: object
      title: CueOptionsRequest
      example:
        max_chars_per_line: 42
        max_duration_ms: 7000
        max_lines_per_cue: 2
        min_duration_ms: 1000
    DubOrderItemRequest:
      properties:
        kind:
          type: string
          const: dub
          title: Kind
          description: The type of order item.
          default: dub
        media_id:
          $ref: '#/components/schemas/MediaId'
          description: The ID of the uploaded media file to dub.
        source_language:
          type: string
          title: Source Language
          description: 'The language code of the source media (e.g. ''en'', ''es'').'
        destination_languages:
          items:
            type: string
          type: array
          title: Destination Languages
          description: List of target language codes to dub the media into.
        include_captions:
          type: boolean
          title: Include Captions
          description: Whether to generate captions for the dubbed outputs.
        include_source_captions:
          type: boolean
          title: Include Source Captions
          description: Whether to generate captions for the source language.
        instructions:
          title: Instructions
          description: Optional free-text instructions for the dubbing team.
          type: string
        captions_sdh:
          title: Captions Sdh
          description: 'Whether captions should use SDH format, which includes descriptions for deaf and hard-of-hearing viewers.'
          type: boolean
      type: object
      required:
        - media_id
        - source_language
        - destination_languages
        - include_captions
        - include_source_captions
      title: DubOrderItemRequest
      example:
        captions_sdh: false
        destination_languages:
          - hi
          - fr-FR
          - de
        include_captions: true
        include_source_captions: false
        instructions: 'Voices don''t need to match the originals, prioritize native-sounding voices'
        kind: dub
        media_id: prodmedia_01jgatk6h0fwxrtbjade61yqhx
        source_language: en
    OrderMediaResponse:
      properties:
        media_id:
          $ref: '#/components/schemas/MediaId'
          description: The ID of the media file.
        name:
          type: string
          title: Name
          description: The original filename of the uploaded media.
        content_type:
          type: string
          title: Content Type
          description: The MIME type of the media file (e.g. 'video/mp4').
        language:
          title: Language
          description: 'The detected or declared language of the media, if available.'
          type: string
        signed_url:
          type: string
          title: Signed Url
          description: A time-limited URL to download the media file.
      type: object
      required:
        - media_id
        - name
        - content_type
        - signed_url
      title: OrderMediaResponse
      example:
        content_type: video/mp4
        language: en
        media_id: prodmedia_01jgb2zd68f8f9tfvbb968wb8z
        name: example.mp4
        signed_url: 'https://storage.googleapis.com/example-bucket/media/example.mp4?X-Goog-Signature=...'
    RegisterMediaResponse:
      properties:
        media_id:
          $ref: '#/components/schemas/MediaId'
          description: The ID of the uploaded media file.
      type: object
      required:
        - media_id
      title: RegisterMediaResponse
      example:
        media_id: prodmedia_01jgb2zd68f8f9tfvbb968wb8z
    Body_Register_media_v1_productions_orders__order_id__media_post:
      properties:
        declared_language:
          type: string
          title: Declared Language
          description: 'The language code of the media content (e.g. ''en'', ''es-ES''). Must be a supported source language for some order item kind.'
        media:
          title: Media
          description: The media file to upload. Mutually exclusive with media_url.
          type: string
          format: binary
        media_url:
          title: Media Url
          description: A URL to fetch the media file from. Mutually exclusive with media.
          type: string
        media_url_filename:
          title: Media Url Filename
          description: The filename for URL-sourced media (e.g. 'example.mp4'). Required when using media_url.
          type: string
        media_url_content_type:
          title: Media Url Content Type
          description: The MIME type for URL-sourced media (e.g. 'video/mp4'). Required when using media_url.
          type: string
      type: object
      required:
        - declared_language
      title: Body_Register_media_v1_productions_orders__order_id__media_post
    UpdateOrderResponse:
      properties:
        name:
          type: string
          title: Name
          description: The updated order name.
      type: object
      required:
        - name
      title: UpdateOrderResponse
      example:
        name: Spanish Dubs
    Body_Update_order_v1_productions_orders__order_id__patch:
      properties:
        request:
          $ref: '#/components/schemas/UpdateOrderRequest'
      type: object
      required:
        - request
      title: Body_Update_order_v1_productions_orders__order_id__patch
    UpdateOrderRequest:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
          description: The new name for the order.
      type: object
      required:
        - name
      title: UpdateOrderRequest
      example:
        name: Spanish Dubs
    OrderResponse:
      properties:
        order_id:
          $ref: '#/components/schemas/OrderId'
          description: The ID of the order.
        name:
          type: string
          title: Name
          description: The display name of the order.
        state:
          $ref: '#/components/schemas/OrderState'
          description: The current state of the order.
        items:
          items:
            $ref: '#/components/schemas/OrderItemInfo'
          type: array
          title: Items
          description: The list of items in this order with their quotes.
        total_amount_usd:
          title: Total Amount Usd
          description: The total price for all items in USD. Excluded from response until quotes are available.
          type: number
        sandbox:
          type: boolean
          title: Sandbox
          description: Whether this is a sandbox order that auto-progresses without producer intervention.
          default: false
        created_at:
          type: string
          format: date-time
          title: Created At
          description: The timestamp when the order was created.
        submitted_at:
          title: Submitted At
          description: 'The timestamp when the order was submitted, if applicable.'
          type: string
          format: date-time
        paid_at:
          title: Paid At
          description: 'The timestamp when payment was received, if applicable.'
          type: string
          format: date-time
        accepted_at:
          title: Accepted At
          description: 'The timestamp when the order was accepted for production, if applicable.'
          type: string
          format: date-time
        completed_at:
          title: Completed At
          description: 'The timestamp when the order was completed, if applicable.'
          type: string
          format: date-time
        cancel_reason:
          title: Cancel Reason
          description: 'The reason the order was cancelled, if applicable.'
          type: string
      type: object
      required:
        - order_id
        - name
        - state
        - items
        - created_at
      title: OrderResponse
      example:
        created_at: '2025-03-15T10:00:00Z'
        items:
          - item:
              captions_sdh: false
              destination_languages:
                - hi
                - fr-FR
                - de
              include_captions: true
              include_source_captions: false
              instructions: 'Voices don''t need to match the originals, prioritize native-sounding voices'
              kind: dub
              media_id: prodmedia_01jgb2zd68f8f9tfvbb968wb8z
              source_language: en
            item_id: proditem_01jgd3qhejfs7rm6swknz2ytjb
            quote:
              amount_usd: 11
        name: Spanish Dubs
        order_id: prodorder_01jgatk6h0fwxrtbjade61yqhx
        sandbox: false
        state: open
        total_amount_usd: 11
    OrderItemInfo:
      properties:
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: The ID of the order item.
        item:
          $ref: '#/components/schemas/OrderItemRequest-Output'
          description: The item configuration details.
        quote:
          description: The quoted price for this item.
          $ref: '#/components/schemas/QuoteInfo'
      type: object
      required:
        - item_id
        - item
      title: OrderItemInfo
      example:
        item:
          captions_sdh: false
          destination_languages:
            - hi
            - fr-FR
            - de
          include_captions: true
          include_source_captions: false
          instructions: 'Voices don''t need to match the originals, prioritize native-sounding voices'
          kind: dub
          media_id: prodmedia_01jgatk6h0fwxrtbjade61yqhx
          source_language: en
        item_id: proditem_01jgd3qhejfs7rm6swknz2ytjb
        quote:
          amount_usd: 11
    OrderItemRequest-Output:
      oneOf:
        - $ref: '#/components/schemas/DubOrderItemRequest'
        - $ref: '#/components/schemas/SubtitleOrderItemRequest'
        - $ref: '#/components/schemas/TranscriptionOrderItemRequest'
      discriminator:
        propertyName: kind
        mapping:
          dub: '#/components/schemas/DubOrderItemRequest'
