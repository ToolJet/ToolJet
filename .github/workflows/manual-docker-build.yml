name: Manual Docker Build and Push

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Git branch to build from"
        required: true
        default: "main"
      dockerfile_path:
        description: "Path to Dockerfile"
        required: true
        type: choice
        options:
          - ./docker/LTS/ee/ee-production.Dockerfile
          - ./docker/pre-release/ee/ee-production.Dockerfile
          - ./docker/LTS/cloud/cloud-server.Dockerfile
      docker_tag:
        description: "Docker tag suffix (e.g., pre-release-14)"
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_name }}
          fetch-depth: 0

      - name: Assert ee public key is the real key
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          EE_BRANCH: ${{ github.event.inputs.branch_name }}
          EE_FALLBACK: ${{ contains(github.event.inputs.dockerfile_path, '/LTS/') && 'lts-3.16' || 'main' }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/ToolJet/ee-server.git"
          git clone -q --depth 1 --branch "$EE_BRANCH" "$url" "$RUNNER_TEMP/ee-key" 2>/dev/null \
            || git clone -q --depth 1 --branch "$EE_FALLBACK" "$url" "$RUNNER_TEMP/ee-key"
          FP=$(openssl rsa -pubin -in "$RUNNER_TEMP/ee-key/keys/public.pem" -outform DER | sha256sum | cut -d' ' -f1)
          rm -rf "$RUNNER_TEMP/ee-key"
          if [ "$FP" != "d8c20ac83e914b68dd4c307f84aa43342e2b80919edd2b7059620dd0e4e1cdb0" ]; then
            echo "::error::ee keys/public.pem on the branch being built is not the real key ($FP)"; exit 1
          fi
          echo "ee public key OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate full Docker tag
        id: taggen
        run: |
          input_tag="${{ github.event.inputs.docker_tag }}"
          if [[ "$input_tag" == *"/"* ]]; then
            echo "tag=$input_tag" >> $GITHUB_OUTPUT
          else
            echo "tag=tooljet/tj-osv:$input_tag" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ github.event.inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.taggen.outputs.tag }}
          platforms: linux/amd64
          build-args: |
            CUSTOM_GITHUB_TOKEN=${{ secrets.CUSTOM_GITHUB_TOKEN }}
            BRANCH_NAME=${{ github.event.inputs.branch_name }}

      - name: Show the full Docker tag
        run: |
          echo "✅ Docker image will be tagged as: ${{ steps.taggen.outputs.tag }}"
