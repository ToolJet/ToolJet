name: CI
# Controls when the workflow will run
on:
  push:
    branches: [develop, main, lts-3.16]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  FORCE_COLOR: true
  NODE_OPTIONS: "--max-old-space-size=4096"
  LOCKBOX_MASTER_KEY: lockbox-master-key
  SECRET_KEY_BASE: secrret-key-base
  NODE_ENV: test
  PG_HOST: postgres
  PG_PORT: 5432
  PG_USER: postgres
  PG_PASS: postgres
  PG_DB: tooljet_test

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'labeled' && github.event.label.name == 'run-ci' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      # Cache server node modules to speed up subsequent builds
      - name: Cache server node modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-node-server-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-server-

      # Cache frontend node modules to speed up subsequent builds
      - name: Cache frontend node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-

      # Cache plugins node modules to speed up subsequent builds
      - name: Cache plugins node modules
        uses: actions/cache@v4
        with:
          path: plugins/node_modules
          key: ${{ runner.os }}-node-plugins-${{ hashFiles('plugins/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-plugins-

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Frontend ci
        run: |
          npm --prefix frontend ci

      - name: Server ci
        run: npm --prefix server ci
    
      - name: plugins ci
        run: npm --prefix plugins ci

      # Upload plugins build artifacts
      - name: Archive specific plugins files and folders
        uses: actions/upload-artifact@v4
        with:
          name: plugins-files
          path: |
            plugins/dist
            plugins/client.js
            plugins/node_modules
            plugins/packages/common
            plugins/package.json

      # Upload server build artifacts
      - name: Archive specific server files and folders
        uses: actions/upload-artifact@v4
        with:
          name: server-files
          path: |
            server/dist

      # Upload frontend build artifacts
      - name: Archive specific frontend files and folders
        uses: actions/upload-artifact@v4
        with:
          name: frontend-files
          path: |
            frontend/build

  lint-for-plugins:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      # Cache server node modules to speed up subsequent builds
      - name: Cache server node modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-node-server-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-server-

      # Cache frontend node modules to speed up subsequent builds
      - name: Cache frontend node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-

      # Cache plugins node modules to speed up subsequent builds
      - name: Cache plugins node modules
        uses: actions/cache@v4
        with:
          path: plugins/node_modules
          key: ${{ runner.os }}-node-plugins-${{ hashFiles('plugins/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-plugins-

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools

      # Download plugins build artifacts
      - name: Download plugins files and folders
        uses: actions/download-artifact@v4
        with:
          name: plugins-files

      - name: Running for plugins
        run: |
          npm --prefix plugins run lint


  lint-for-frontend:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      # Cache server node modules to speed up subsequent builds
      - name: Cache server node modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-node-server-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-server-

      # Cache frontend node modules to speed up subsequent builds
      - name: Cache frontend node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-

      # Cache plugins node modules to speed up subsequent builds
      - name: Cache plugins node modules
        uses: actions/cache@v4
        with:
          path: plugins/node_modules
          key: ${{ runner.os }}-node-plugins-${{ hashFiles('plugins/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-plugins-

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools

      # Download frontend build artifacts
      - name: Download frontend files and folders
        uses: actions/download-artifact@v4
        with:
          name: frontend-files

      - name: Running for frontend
        run: |
          npm --prefix frontend run lint

  lint-for-server:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      # Cache server node modules to speed up subsequent builds
      - name: Cache server node modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-node-server-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-server-

      # Cache frontend node modules to speed up subsequent builds
      - name: Cache frontend node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-

      # Cache plugins node modules to speed up subsequent builds
      - name: Cache plugins node modules
        uses: actions/cache@v4
        with:
          path: plugins/node_modules
          key: ${{ runner.os }}-node-plugins-${{ hashFiles('plugins/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-plugins-

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools

      # Download server build artifacts
      - name: Download server files and folders
        uses: actions/download-artifact@v4
        with:
          name: server-files

      - name: Running for server
        run: |
          npm --prefix server run lint

  # The regular server suites also accompany LTS's existing release-test labels.
  # They install their own dependencies, so they do not depend on a build artifact.
  unit-test:
    name: Server unit tests
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (contains(github.event.pull_request.labels.*.name, 'run-ci')
              || contains(github.event.pull_request.labels.*.name, 'run-cypress')
              || contains(github.event.pull_request.labels.*.name, 'run-frontend-tests')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: node:22.23.4-bookworm
    services: &test-services
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env: &test-env
      TOOLJET_DB_HOST: postgres
      TOOLJET_DB_PORT: 5432
      TOOLJET_DB_USER: postgres
      TOOLJET_DB_PASS: postgres
      TOOLJET_DB: tooljet_db_test
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ATTACHMENT_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tooljet_ai_test_ci
      MCP_OAUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tooljet_oauth_test_ci
      WORKFLOW_TIMEOUT_SECONDS: '60'
      PGRST_JWT_SECRET: 'r9iMKoe5CRMgvJBBtp4HrqN7QiPpUToj'
      ENABLE_TOOLJET_DB: 'true'
      ENABLE_EXTERNAL_API: 'true'
      EXTERNAL_API_ACCESS_TOKEN: test-external-api-token
    steps: &server-test-steps
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          persist-credentials: false
      - run: apt-get update && apt-get install -y postgresql-client libxml2 libaio1
      - run: npm --prefix plugins ci
      - run: npm --prefix plugins run create:client && npm --prefix plugins run create:server
      - run: npm --prefix plugins run build:packages && npm --prefix plugins run build:server
      - run: npm --prefix server ci
      - name: Validate AI and OAuth test discovery
        run: node scripts/check-ai-tests.cjs server
      - run: PGPASSWORD="$PG_PASS" createdb -h "$PG_HOST" -U "$PG_USER" tooljet_ai_test_ci
      - run: NODE_ENV= npm --prefix server run db:create
      - run: NODE_ENV= npm --prefix server run db:migrate
      - name: Run normal server suites
        run: |
          if [ "${{ github.job }}" = "unit-test" ]; then
            npm --prefix server test -- --group=working --group=workflows --group=security --coverage --coverageReporters=json --coverageReporters=json-summary --json --outputFile=coverage-unit/results.json
            node scripts/check-ai-test-results.cjs server server/coverage-unit/results.json unit
          else
            npm --prefix server run test:e2e -- --coverage --group=working --testTimeout=60000 --json-output-dir coverage-e2e/results
            node scripts/check-ai-test-results.cjs server server/coverage-e2e/results e2e
          fi
      - name: Upload numeric coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ github.job }}-coverage
          path: server/coverage-${{ github.job == 'unit-test' && 'unit' || 'e2e' }}/coverage-final.json
          if-no-files-found: warn
          retention-days: 7

  e2e-test:
    name: Server E2E tests
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (contains(github.event.pull_request.labels.*.name, 'run-ci')
              || contains(github.event.pull_request.labels.*.name, 'run-cypress')
              || contains(github.event.pull_request.labels.*.name, 'run-frontend-tests')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: node:22.23.4-bookworm
    services: *test-services
    env: *test-env
    steps: *server-test-steps

  server-coverage:
    name: Server coverage
    needs: [unit-test, e2e-test]
    runs-on: ubuntu-latest
    container: node:22.23.4-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          persist-credentials: false
      - run: apt-get update && apt-get install -y libxml2 libaio1
      - run: npm --prefix server ci
      - uses: actions/download-artifact@v4
        with:
          name: server-unit-test-coverage
          path: server/coverage-unit
      - uses: actions/download-artifact@v4
        with:
          name: server-e2e-test-coverage
          path: server/coverage-e2e
      - name: Merge normal unit and E2E coverage
        run: npm --prefix server run test:cov:merge
      - name: Report AI and OAuth coverage from the normal suite
        run: node scripts/report-ai-coverage.cjs server server/coverage-combined/coverage-final.json server/coverage-ai/ee/report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage-report
          path: |
            server/coverage-combined/coverage-summary.json
            server/coverage-ai/ee/report/coverage-summary.json
          retention-days: 7
