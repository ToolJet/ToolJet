name: AWS AMI build using Packer config

on:
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from (e.g. lts-3.16)"
        required: true
      version:
        description: "RELEASE_VERSION"
        required: true
      region:
        description: "AWS region to build AMI in (default: us-west-1)"
        required: false
        default: "us-west-1"

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    name: check-version
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check if version is AMI-eligible (multiple of 10)
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch — always build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.release.tag_name }}" != *-lts ]]; then
            # AMIs ship the LTS line only; pre-release tags build from main, not an LTS branch
            echo "Skipping AMI build: ${{ github.event.release.tag_name }} is not an LTS release"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/*/}"
            # Extract patch number: v3.20.100-lts → 100
            PATCH=$(echo "$TAG" | sed 's/^v//' | cut -d'.' -f3 | cut -d'-' -f1)
            if (( PATCH % 10 == 0 )); then
              echo "Version $TAG is AMI-eligible (patch $PATCH is multiple of 10)"
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "Skipping AMI build — $TAG patch $PATCH is not a multiple of 10"
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          fi

  packer-ee:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    name: packer-ee

    steps:
      # Release: the LTS branch .gitmodules tracks at the tag, so cutting a new LTS needs no edit here.
      # Fails if the tag isn't on that branch (.gitmodules not bumped on the new LTS branch).
      - name: Resolve branch to build
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          if [[ -n "$INPUT_BRANCH" ]]; then
            echo "name=$INPUT_BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch=$(gh api "repos/$REPO/contents/.gitmodules?ref=$TAG" --jq .content | base64 -d | git config -f /dev/stdin submodule.server/ee.branch)
          # The tag must sit on the release commit: tag name == v + .version at that commit
          version=$(gh api "repos/$REPO/contents/.version?ref=$TAG" --jq .content | base64 -d | tr -d '\n')
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::Release tag $TAG does not match .version ($version) at that commit."
            exit 1
          fi
          status=$(gh api "repos/$REPO/compare/${branch}...${TAG}" --jq .status)
          if [[ "$status" != "identical" && "$status" != "behind" ]]; then
            echo "::error::Release tag $TAG is not on $branch, the branch .gitmodules tracks. Update branch in .gitmodules on the LTS branch."
            exit 1
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: refs/heads/${{ steps.branch.outputs.name }}

      - name: Setting tag
        if: "${{ github.event.inputs.version != '' }}"
        run: echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: Set evn
        if: "${{ github.event.release }}"
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1-node16
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.region || 'us-west-1' }}

      # Initialize Packer templates
      - name: Initialize Packer Template
        uses: hashicorp/packer-github-actions@master
        with:
          command: init
          target: .
          working_directory: deploy/ec2/ee

      # validate templates
      - name: Validate Template
        uses: hashicorp/packer-github-actions@master
        with:
          command: validate
          arguments: -syntax-only
          target: .
          working_directory: deploy/ec2/ee

      # Echo RENDER_GITHUB_PAT
      - name: Set PACKER_GITHUB_PAT
        run: echo "PACKER_GITHUB_PAT=${{ secrets.CUSTOM_GITHUB_TOKEN }}" >> $GITHUB_ENV

      # Dynamically update setup_machine.sh with PAT
      - name: Validate PAT
        run: |
          sed -i "s|CUSTOM_GITHUB_TOKEN|${{ secrets.CUSTOM_GITHUB_TOKEN }}|g" ./deploy/ec2/ee/setup_machine.sh
          # No-op on branches whose setup script still hardcodes lts-3.16
          sed -i "s|BUILD_BRANCH_NAME|${{ steps.branch.outputs.name }}|g" ./deploy/ec2/ee/setup_machine.sh

      # build artifact
      - name: Build Artifact
        id: packer-build
        uses: hashicorp/packer-github-actions@master
        with:
          command: build
          #The the below argument is specific for building EE AMI image
          arguments: -color=false -on-error=abort -var ami_name=tooljet_${{ env.RELEASE_VERSION }}.ubuntu_jammy -var ami_region=${{ github.event.inputs.region || 'us-west-1' }}
          target: .
          working_directory: deploy/ec2/ee
        env:
          PACKER_LOG: 1

      - name: Cleanup EC2 instances
        if: always()
        run: |
          echo "Listing all EC2 instances..."

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --region ${{ github.event.inputs.region || 'us-west-1' }} \
            --query 'Reservations[*].Instances[*].InstanceId' \
            --output text)

          if [ -n "$INSTANCE_IDS" ] && [ "$INSTANCE_IDS" != "None" ]; then
            echo "Found instances: $INSTANCE_IDS"
            aws ec2 terminate-instances --region ${{ github.event.inputs.region || 'us-west-1' }} --instance-ids $INSTANCE_IDS
            echo "Terminated instances: $INSTANCE_IDS"
          else
            echo "No instances found to cleanup"
          fi

      - name: Send Slack Notification
        if: success()
        run: |
          ami_name="tooljet_${{ env.RELEASE_VERSION }}.ubuntu_jammy"
          message="✅ *ToolJet Enterprise AWS AMI Published*\nVersion: \`${{ env.RELEASE_VERSION }}\`\nType: 🔒 LTS Release\nBranch: \`${{ steps.branch.outputs.name }}\`\nRegion: \`${{ github.event.inputs.region || 'us-west-1' }}\`\nAMI Name: \`${ami_name}\`"

          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"$message\"}" ${{ secrets.SLACK_WEBHOOK_URL }}
