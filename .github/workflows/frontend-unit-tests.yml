name: Frontend unit tests

on:
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: frontend-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-tests:
    name: Tests for changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # --changedSince needs the full history to diff against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests related to changed files
        run: npx jest --ci --coverage --changedSince=origin/${{ github.base_ref }}

      - name: Validate App Builder coverage manifest and harness contracts
        run: npm run validate:app-builder-coverage-manifest && npm run test:app-builder:contracts

  full-suite:
    name: Full suite + App Builder coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/app-builder/**/jest/
          retention-days: 30
