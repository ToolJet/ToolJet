name: Frontend UI 2.0 checks

# The frontend jest suite, the coverage manifest and the widget contracts moved into ci.yml
# ('Test Suite · frontend' and 'widget-contracts'). What stays here is UI 2.0 only and is never required.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      update_ui2_visual_baselines:
        description: 'UI 2.0 visual check: write the Linux baselines and upload them as an artifact'
        type: boolean
        default: false

concurrency:
  group: frontend-ui2-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The runner is in UTC, where no clock change ever happens. The UI 2.0 date, time, Calendar and Schedule specs
  # run again in a zone with daylight saving, where a day can have 23 or 25 hours and an hour can repeat.
  ui2-dates-tz:
    name: UI 2.0 date and schedule specs in America/Los_Angeles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the UI 2.0 date and schedule specs in America/Los_Angeles
        run: npm run test:ui2-dates-tz

  # The UI 2.0 widgets' visual check: every widget (default, loading, disabled) in the light and dark theme, against
  # committed screenshots. It runs ON DEMAND (the run-ui2-visual label, or a manual run) and must not be marked
  # required. It needs no submodule: the gallery is built as CE. Baselines are per platform; a manual run with
  # update_ui2_visual_baselines writes the Linux set and uploads it for a developer to commit.
  ui2-visual:
    name: UI 2.0 visual check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-ui2-visual'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Not an app dependency, so not in package.json: installed for this job only.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright-core@1.63.0
          npx playwright-core install --with-deps chromium

      - name: Compare the widgets with their screenshots
        run: npm run test:ui2-visual -- ${{ inputs.update_ui2_visual_baselines && '--update' || '' }}

      - name: Upload differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui2-visual-differences
          path: frontend/build/ui2-visual/diff

      - name: Upload Linux baselines
        if: inputs.update_ui2_visual_baselines
        uses: actions/upload-artifact@v7
        with:
          name: ui2-visual-baselines-linux
          path: frontend/src/AppBuilder/Widgets/Ui2/__tests__/visual/baselines/linux
