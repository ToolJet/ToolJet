name: Frontend unit tests

on:
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches:
      - develop
      - lts-3.16
    paths:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: frontend-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Full suite + App Builder coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Layout first: a misfiled or *.test.* spec silently never runs, so this
      # must fail the build before the suite reports a misleading green.
      - name: Validate test layout
        run: npm run test:layout

      # The whole suite runs in seconds, so there is no reason to scope it to
      # changed files — doing that let PRs pass green without running a test.
      - name: Run full test suite with coverage
        run: npm run test:ci

      - name: Validate App Builder coverage manifest and harness contracts
        run: npm run validate:app-builder-coverage-manifest && npm run test:app-builder:contracts

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/app-builder/**/jest/
          retention-days: 30
