name: Deploy Storybook to Netlify

on:
  # push:
  #   branches:
  #     - lts-3.16
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true

jobs:
  deploy-storybook:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      # Production = the LTS branch .gitmodules tracks; anything else is a preview deploy
      - name: Resolve LTS branch from .gitmodules
        id: lts
        run: echo "branch=$(git config -f .gitmodules submodule.server/ee.branch)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build Storybook
        working-directory: frontend
        run: npx storybook build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: frontend/storybook-static
          production-branch: ${{ steps.lts.outputs.branch }}
          production-deploy: ${{ github.event_name == 'pull_request' || inputs.branch == steps.lts.outputs.branch }}
          deploy-message: |
            Storybook deploy from ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }} @ ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_STORYBOOK_SITE_ID }}
