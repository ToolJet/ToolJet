name: Release test suites

# Shared by LTS and main so forwarding the release adds no competing CI edits.
# Main-target PRs continue to use main's existing CI and coverage gates.
on:
  pull_request:
    branches: [lts-3.16, 'chore/ai-builder-release-*']
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches: [lts-3.16]
  workflow_dispatch:

concurrency:
  group: release-test-suites-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: true
  NODE_OPTIONS: "--max-old-space-size=4096"
  LOCKBOX_MASTER_KEY: lockbox-master-key
  SECRET_KEY_BASE: secrret-key-base
  NODE_ENV: test
  PG_HOST: postgres
  PG_PORT: 5432
  PG_USER: postgres
  PG_PASS: postgres
  PG_DB: tooljet_test

jobs:
  release-context:
    runs-on: ubuntu-latest
    env:
      TARGET_REF: ${{ github.base_ref || github.ref_name }}
    steps:
      - name: Require a release branch
        run: |
          case "$TARGET_REF" in
            lts-3.16|chore/ai-builder-release-*) ;;
            *) echo "::error::Use the normal CI workflow for main."; exit 1 ;;
          esac

  unit-test:
    needs: release-context
    name: Server unit tests
    if: >-
      github.event_name != 'pull_request'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (contains(github.event.pull_request.labels.*.name, 'run-ci')
              || contains(github.event.pull_request.labels.*.name, 'run-cypress')
              || contains(github.event.pull_request.labels.*.name, 'run-frontend-tests')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: node:22.23.4-bookworm
    services: &test-services
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env: &test-env
      TOOLJET_DB_HOST: postgres
      TOOLJET_DB_PORT: 5432
      TOOLJET_DB_USER: postgres
      TOOLJET_DB_PASS: postgres
      TOOLJET_DB: tooljet_db_test
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ATTACHMENT_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tooljet_ai_test_ci
      MCP_OAUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tooljet_oauth_test_ci
      WORKFLOW_TIMEOUT_SECONDS: '60'
      PGRST_JWT_SECRET: 'r9iMKoe5CRMgvJBBtp4HrqN7QiPpUToj'
      ENABLE_TOOLJET_DB: 'true'
      ENABLE_EXTERNAL_API: 'true'
      EXTERNAL_API_ACCESS_TOKEN: test-external-api-token
    steps: &server-test-steps
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          persist-credentials: false
      - name: Trust the checked-out repository in the test container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/server/ee"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/frontend/ee"
      - run: apt-get update && apt-get install -y postgresql-client libxml2 libaio1
      - run: npm --prefix plugins ci
      - run: npm --prefix plugins run create:client && npm --prefix plugins run create:server
      - run: npm --prefix plugins run build:packages && npm --prefix plugins run build:server
      - run: npm --prefix server ci
      - name: Validate AI and OAuth test discovery
        run: node scripts/check-ai-tests.cjs server
      - run: PGPASSWORD="$PG_PASS" createdb -h "$PG_HOST" -U "$PG_USER" tooljet_ai_test_ci
      - run: NODE_ENV= npm --prefix server run db:create
      - run: NODE_ENV= npm --prefix server run db:migrate
      - name: Run normal server suites
        run: |
          if [ "${{ github.job }}" = "unit-test" ]; then
            npm --prefix server test -- --group=working --group=workflows --group=security --coverage --coverageReporters=json --coverageReporters=json-summary --json --outputFile=coverage-unit/results.json
            node scripts/check-ai-test-results.cjs server server/coverage-unit/results.json unit
          else
            mkdir -p server/test-results/e2e
            npm --prefix server run test:e2e -- --coverage --group=working --testTimeout=60000 --json-output-dir test-results/e2e
            node scripts/check-ai-test-results.cjs server server/test-results/e2e e2e
          fi
      - name: Upload numeric coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ github.job }}-coverage
          path: server/coverage-${{ github.job == 'unit-test' && 'unit' || 'e2e' }}/coverage-final.json
          if-no-files-found: warn
          retention-days: 7

  e2e-test:
    needs: release-context
    name: Server E2E tests
    if: >-
      github.event_name != 'pull_request'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (contains(github.event.pull_request.labels.*.name, 'run-ci')
              || contains(github.event.pull_request.labels.*.name, 'run-cypress')
              || contains(github.event.pull_request.labels.*.name, 'run-frontend-tests')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: node:22.23.4-bookworm
    services: *test-services
    env: *test-env
    steps: *server-test-steps

  server-coverage:
    name: Server coverage
    needs: [unit-test, e2e-test]
    runs-on: ubuntu-latest
    container: node:22.23.4-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          persist-credentials: false
      - run: apt-get update && apt-get install -y libxml2 libaio1
      - run: npm --prefix server ci
      - uses: actions/download-artifact@v4
        with:
          name: server-unit-test-coverage
          path: server/coverage-unit
      - uses: actions/download-artifact@v4
        with:
          name: server-e2e-test-coverage
          path: server/coverage-e2e
      - name: Merge normal unit and E2E coverage
        run: npm --prefix server run test:cov:merge
      - name: Report AI and OAuth coverage from the normal suite
        run: node scripts/report-ai-coverage.cjs server server/coverage-combined/coverage-final.json server/coverage-ai/ee/report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage-report
          path: |
            server/coverage-combined/coverage-summary.json
            server/coverage-ai/ee/report/coverage-summary.json
          retention-days: 7

  frontend-tests:
    needs: release-context
    name: Frontend suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # Asked FIRST, before any checkout: a server-only PR should satisfy this
      # required check in seconds without cloning anything or needing a frontend
      # label. Uses the PR files API rather than a git diff, which would need
      # fetch-depth: 0 — a full history clone of a repo this size.
      - name: Does this PR touch the frontend?
        id: scope
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files=$(mktemp)
          trap 'rm -f "$changed_files"' EXIT
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' > "$changed_files"
          if grep -Eq '^(frontend/|scripts/(ai-|check-ai-|report-ai-)|\.github/workflows/release-test-suites\.yml$)' "$changed_files"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/ changes in this PR — nothing to run."
          fi

      # The suite runs ON DEMAND, but a frontend PR must not merge without having
      # run it. So this step FAILS while the label is absent, rather than the job
      # being skipped — a skipped job reports SUCCESS and would let the PR merge
      # unscreened. Mark this check as required in branch protection.
      - name: Require the run-frontend-tests label
        if: >-
          github.event_name == 'pull_request' &&
          steps.scope.outputs.frontend == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'run-frontend-tests') &&
          !contains(github.event.pull_request.labels.*.name, 'run-cypress') &&
          !contains(github.event.pull_request.labels.*.name, 'run-ci')
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error title=Frontend tests not run::This PR changes frontend/ but does not carry a test label (run-frontend-tests, run-cypress, or run-ci), so the suite has not run. Add the label to run it. This check must pass before the PR can be merged."
          exit 1

      # Default GITHUB_TOKEN only authenticates for this repo, not the private
      # ee-frontend/ee-server submodules — submodule checkout needs a PAT with
      # cross-repo read access, same as merging-pr.yml and render-preview-deploy-v2.yml.
      - uses: actions/checkout@v4
        if: steps.scope.outputs.frontend == 'true'
        with:
          submodules: recursive
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.frontend == 'true'
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.frontend == 'true'
        run: npm ci

      # Layout first: a misfiled or *.test.* spec silently never runs, so this
      # must fail the build before the suite reports a misleading green.
      - name: Validate test layout
        if: steps.scope.outputs.frontend == 'true'
        run: npm run test:layout

      # The whole suite runs in seconds, so there is no reason to scope it to
      # changed files — doing that let PRs pass green without running a test.
      - name: Run full test suite with coverage
        if: steps.scope.outputs.frontend == 'true'
        run: |
          node ../scripts/check-ai-tests.cjs frontend
          npm run test:ci -- --json --outputFile=coverage/app-builder/ee/jest/results.json
          node ../scripts/check-ai-test-results.cjs frontend coverage/app-builder/ee/jest/results.json
          node ../scripts/report-ai-coverage.cjs frontend coverage/app-builder/ee/jest/coverage-final.json coverage-ai/ee/report

      - name: Upload frontend coverage
        if: always() && steps.scope.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: |
            frontend/coverage/app-builder/ee/jest/coverage-summary.json
            frontend/coverage-ai/ee/report/coverage-summary.json
          retention-days: 7

      # Fails if an App Builder source file is not assigned to a subsystem in
      # app-builder-coverage-manifest.json. The harness contract spec is NOT run
      # here — testMatch already picks it up in the full suite above, so running
      # `test:app-builder:contracts` would execute it a second time.
      - name: Validate App Builder coverage manifest
        if: steps.scope.outputs.frontend == 'true'
        run: npm run validate:app-builder-coverage-manifest

  widget-contracts:
    needs: release-context
    name: Widget contracts
    # Label-gated rather than path-gated. The changed-file rules (production_changes,
    # new-widget contracts) only carry meaning on a PR where a human authored the
    # change, so back-merges and release PRs simply do not carry the label.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-validate-widget-contracts')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # Contracts live in the private frontend/ee submodule, so this needs the same
      # cross-repo PAT as the test job — the default token cannot read it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Existing untouched widgets remain a report-only backfill. New widget
      # definitions and modified widget tests must already have an approved
      # behavior contract before CI accepts them.
      - name: Validate widget testing contracts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[] | [.status, .filename] | @tsv' | \
              npm run validate:widget-testing-contracts -- --changed-files-stdin
          else
            npm run validate:widget-testing-contracts
          fi

  test-gate:
    # Preserve the existing required status while also enforcing server results.
    name: Frontend tests
    if: always()
    needs: [release-context, frontend-tests, unit-test, e2e-test, server-coverage]
    runs-on: ubuntu-latest
    env:
      CONTEXT_RESULT: ${{ needs.release-context.result }}
      FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
      UNIT_RESULT: ${{ needs.unit-test.result }}
      E2E_RESULT: ${{ needs.e2e-test.result }}
      COVERAGE_RESULT: ${{ needs.server-coverage.result }}
      SERVER_REQUESTED: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci') || contains(github.event.pull_request.labels.*.name, 'run-cypress') || contains(github.event.pull_request.labels.*.name, 'run-frontend-tests') }}
    steps:
      - name: Verify normal test results
        run: |
          test "$CONTEXT_RESULT" = success || exit 1
          test "$FRONTEND_RESULT" = success || exit 1
          if [ "$SERVER_REQUESTED" = true ]; then
            test "$UNIT_RESULT" = success || exit 1
            test "$E2E_RESULT" = success || exit 1
            test "$COVERAGE_RESULT" = success || exit 1
          fi
